  }
  // エクストラのBGM：ドローン（低い持続音）・ノイズ・チャイム・アルペジオ・パルスを、テーマの設定どおりに組み合わせる。
  // 各ループは session.alive が false になると止まる。テンポは石ごとに少し変わる（xs.tempo）。
  startBGMX(){
    const c = this.ctx, b = this.xs.bgm, tp = this.xs.tempo || 1, gain = c.createGain();
    gain.gain.setValueAtTime(.0001, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(.025, c.currentTime + .5);
    gain.connect(c.destination);
    const nodes = [], session = {gain, nodes, alive:true}, oct = o => Math.pow(2, (o || 1) - 1), sc = i => this.scale[i % this.scale.length];
    this.bgm = session;
    if(b.d){   // ドローン：左右に少し違う高さ
      [[this.base[0], -1], [this.base[1], 1]].forEach(([f, pan]) => {
        const o = c.createOscillator(), g = c.createGain(), p = c.createStereoPanner ? c.createStereoPanner() : null;
        o.type = b.d; o.frequency.value = f; g.gain.value = b.dv == null ? 1 : b.dv; o.connect(g);
        if(p){ p.pan.value = pan; g.connect(p); p.connect(gain); } else g.connect(gain);
        o.start(); nodes.push(o);
      });
    }
    if(b.n){   // ノイズ（ローパス／ハイパスで色を付ける）
      const n = this.pinkNoise(), g = c.createGain(); g.gain.value = b.n; let last = n;
      [['lowpass', b.nl], ['highpass', b.nh]].forEach(([t, f]) => { if(f){ const fl = c.createBiquadFilter(); fl.type = t; fl.frequency.value = f; last.connect(fl); last = fl; } });
      last.connect(g); g.connect(gain); n.start(); nodes.push(n);
    }
    const loop = (fn, ms) => { const run = () => { if(!session.alive) return; fn(); setTimeout(run, ms()); }; run(); };
    if(b.c){ const [w, v, mn, jt, o] = b.c; loop(() => this.tone(sc(Math.floor(Math.random() * this.scale.length)) * oct(o), v, 4, w), () => (mn + Math.pow(Math.random(), 2) * jt) / tp); }
    if(b.a){ const [w, v, ms, pat, o] = b.a; let k = 0; loop(() => { this.tone(sc(pat[k++ % pat.length]) * oct(o), v, ms / 1000 * 2, w); }, () => ms / tp); }
    if(b.p){ const [ms, f, v, w] = b.p; loop(() => this.tone(f, v, .18, w), () => ms / tp); }

  // ステージクリアの余韻：星が多いほど、長く昇る音（領域の節目はさらに長く）

    const seq = [0, 2, 4, 7, 9, 11, 14, 16].slice(0, 4 + stars * 2 + (big ? 2 : 0)), len = this.scale.length;
    seq.forEach((n, i) => setTimeout(() => { if(this.ctx) this.tone(this.scale[n % len] * (n >= len ? 2 : 1), .07, 1.8); }, 400 + i * 120));
  }
  // BGM停止：0.5秒かけて音量を下げてから止める
  stopBGM(){
    const s = this.bgm; this.bgm = null;
    clearTimeout(this.timer);
    if(!s) return;
    s.alive = false;
    s.gain.gain.cancelScheduledValues(this.ctx.currentTime);
    s.gain.gain.setValueAtTime(Math.max(s.gain.gain.value, .0001), this.ctx.currentTime);
    s.gain.gain.exponentialRampToValueAtTime(.0001, this.ctx.currentTime + .5);
    setTimeout(()=> s.nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }), 600);
  }
}

/* ---------- 視覚エフェクト（ループは1本に統合） ---------- */
// 背景の粒子・完成時の火花・呼吸ガイドの光を、1本の描画ループ(frame)でまとめて動かす。
const canvas = $('fx-canvas'), fx = canvas.getContext('2d'), halo = $('halo'), breathEl = $('breath-text');
let particleRgb = REALMS[0].rgb, lastBreath = '', particleMode = 'rise';   // particleMode: 粒の動き（通常は rise。エクストラはテーマごと）
// キャンバスを画面サイズに合わせる
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas); resizeCanvas();

// 背景の小さな光の粒。通常はゆっくり上昇して消える。エクストラでは particleMode に応じて動きと形が変わる
// （pixel=四角が降る / bubble=泡 / drift=横へ流れる / ember=火の粉 / fall=雪のように降る / rain=雨の線 / mote=ゆらぐ塵 / spark=はじける光 / twinkle=瞬く星）
class Particle{
  constructor(){ this.reset(true); }
  reset(initial){
    const W = canvas.width, H = canvas.height, m = particleMode;
    this.x = Math.random()*W; this.y = initial ? Math.random()*H : H + 10;
    this.size = Math.random()*2 + .5; this.alpha = Math.random()*.4 + .1;
    this.speedY = -(.1 + Math.pow(Math.random(),2)*.4); this.speedX = 0;
    this.fade = .001 + Math.random()*.002; this.ph = Math.random()*6.28;
    if(m === 'pixel'){ this.size = 2 + Math.floor(Math.random()*3)*1.5; this.speedY = .25 + Math.random()*.5; if(!initial) this.y = -10; this.fade = .002; }
    else if(m === 'bubble'){ this.size = 2 + Math.random()*5; this.speedY = -(.3 + Math.random()*.7); this.alpha = .25 + Math.random()*.3; this.fade = .002; }
    else if(m === 'drift'){ this.speedX = .4 + Math.random()*1.1; this.speedY = (Math.random() - .5)*.2; this.y = Math.random()*H; if(!initial) this.x = -10; this.fade = .002; }
    else if(m === 'ember'){ this.size = 1 + Math.random()*2.5; this.speedY = -(.5 + Math.random()*1.2); this.alpha = .5 + Math.random()*.4; this.fade = .006; }
    else if(m === 'fall'){ this.size = 1 + Math.random()*2.5; this.speedY = .3 + Math.random()*.7; this.alpha = .3 + Math.random()*.4; if(!initial) this.y = -10; this.fade = .001; }
    else if(m === 'rain'){ this.size = 8 + Math.random()*10; this.speedY = 6 + Math.random()*5; this.speedX = -1; this.alpha = .15 + Math.random()*.2; if(!initial) this.y = -20; this.fade = .002; }
    else if(m === 'mote'){ this.size = 1 + Math.random()*2; this.speedY = (Math.random() - .5)*.3; this.speedX = (Math.random() - .5)*.3; this.fade = .002; }
    else if(m === 'spark'){ this.size = 1 + Math.random()*2.5; this.speedY = -(.4 + Math.random()*.9); this.alpha = .6; this.fade = .012; }
    else if(m === 'twinkle'){ this.size = 1 + Math.random()*2; this.speedY = 0; this.alpha = .5; this.fade = .0015; }
  }
  update(){
    const m = particleMode; this.ph += .05;
    if(m === 'bubble') this.x += Math.sin(this.ph)*.4;
    else if(m === 'fall') this.x += Math.sin(this.ph)*.3;
    else if(m === 'mote') { this.speedX += (Math.random() - .5)*.02; this.speedY += (Math.random() - .5)*.02; }
    this.x += this.speedX; this.y += this.speedY; this.alpha -= this.fade;
    if(this.alpha <= 0 || this.y < -22 || this.y > canvas.height + 22 || this.x < -22 || this.x > canvas.width + 22) this.reset(false);
  }
  draw(){
    const m = particleMode; let a = this.alpha;
    if(m === 'twinkle') a = Math.max(0, this.alpha * (.4 + .6*Math.abs(Math.sin(this.ph))));
    else if(m === 'ember') a *= .6 + .4*Math.random();
    fx.fillStyle = `rgba(${particleRgb},${a})`; fx.strokeStyle = `rgba(${particleRgb},${a})`;
    if(m === 'pixel') fx.fillRect(this.x, this.y, this.size, this.size);
    else if(m === 'rain'){ fx.lineWidth = 1; fx.beginPath(); fx.moveTo(this.x, this.y); fx.lineTo(this.x + this.speedX*2, this.y - this.size); fx.stroke(); }
    else if(m === 'bubble'){ fx.lineWidth = 1; fx.beginPath(); fx.arc(this.x, this.y, this.size, 0, Math.PI*2); fx.stroke(); }
    else{ fx.beginPath(); fx.arc(this.x, this.y, this.size, 0, Math.PI*2); fx.fill(); }
  }
}
// 背景の粒を60個つくる
const particles = Array.from({length:60}, () => new Particle());
// 「視覚効果を減らす」設定なら、粒と火花を出さない
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const bursts = [];
// 呼吸ガイドの開始時刻（4秒吸う→7秒止める→8秒吐く = 19秒周期）
const breathStart = performance.now();

// 毎フレームの描画。タブが隠れている間は何もしない。
// 粒子→火花→呼吸ガイド（光の輪の拡縮と文字）の順に更新する。
function frame(now){
  if(!document.hidden){
    fx.clearRect(0,0,canvas.width,canvas.height);
    if(!reduceMotion) particles.forEach(p=>{ p.update(); p.draw(); });
    for(let i = bursts.length - 1; i >= 0; i--){
      const b = bursts[i]; b.x += b.vx; b.y += b.vy; b.vy += .02; b.a -= .012;
      if(b.a <= 0){ bursts.splice(i, 1); continue; }
      fx.fillStyle = `rgba(254,240,138,${b.a})`; fx.beginPath(); fx.arc(b.x, b.y, b.s, 0, Math.PI*2); fx.fill();
    }
    const e = ((now - breathStart) % 19000) / 1000;
    let scale, opacity, text;
    if(e < 4){ const p=e/4; scale=1+p*.35; opacity=.15+p*.2; text='BREATHE IN... (4s)'; }
    else if(e < 11){ scale=1.35; opacity=.35; text='HOLD... (7s)'; }
    else{ const p=(e-11)/8; scale=1.35-p*.35; opacity=.35-p*.2; text='EXHALE... (8s)'; }
    halo.style.transform = `scale(${scale})`;
    halo.style.opacity = opacity;
    if(text !== lastBreath){ breathEl.textContent = text; lastBreath = text; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function getStageConfig(stage, extra){

function generateLevel(stage){

/* ---------- 最短手数ソルバーと★評価 ----------
   盤面ごとに「ほぼ最短の手数（par）」をビームサーチで求め、それとの差で★を決める。
   状態は瓶ごとの文字列（先頭が底、色は a,b,c...）で表す。 */
const solverKey = st => st.slice().sort().join('|');   // 同じ並びの瓶は区別しない（探索の重複を減らす）
/* 下界: 動かさずに済むのは「各色で最長の、底からの同色の連なり」だけ。残りは最低1回は動く。0なら完成。 */
function solverLowerBound(st){
  let total = 0; const best = {};
  for(const b of st){
    if(!b.length) continue;
    total += b.length;
    const c = b[0]; let r = 1; while(r < b.length && b[r] === c) r++;
    if(!best[c] || r > best[c]) best[c] = r;
  }
  let stay = 0; for(const c in best) stay += best[c];
  return total - stay;
}
/* 打てる手の一覧 [from, to, 個数, 色]。完成した瓶や、単色瓶を空き瓶へ移すだけの手は無駄なので除く */
function solverMoves(st, batch){
  const out = [];
  for(let f = 0; f < st.length; f++){
    const A = st[f]; if(!A.length) continue;
    const c = A[A.length - 1];
    let uni = true; for(let i = 0; i < A.length; i++) if(A[i] !== c){ uni = false; break; }
    if(uni && A.length === BOTTLE_CAPACITY) continue;
    let run = 1; while(run < A.length && A[A.length - 1 - run] === c) run++;
    for(let t = 0; t < st.length; t++){
      if(t === f) continue;
      const B = st[t]; if(B.length >= BOTTLE_CAPACITY) continue;
      if(uni && !B.length) continue;
      out.push([f, t, batch ? Math.min(run, BOTTLE_CAPACITY - B.length) : 1, c]);   // まとめ移動なら同色の連なりを一度に移す
    }
  }
  return out;
}
function solverApply(st, m){
  const n = st.slice(), f = m[0], t = m[1], k = m[2];
  n[f] = st[f].slice(0, st[f].length - k);
  n[t] = st[t] + m[3].repeat(k);
  return n;
}
/* 1層ずつ進められるビームサーチ。step()で1層進め、finish()で最後まで解く。result = {len, path:[[from,to],…]} */
function createSolver(start, batch, width){
  let layer = [{st:start, par:null, mv:null}], depth = 0, idx = 0, next = [];   // idx/next: 現在の層の処理位置と、次の層の候補
  const seen = new Set([solverKey(start)]);
  const sv = {done:false, result:null,
    step(budgetMs){   // budgetMs(ミリ秒)を超えたら途中で戻る。完了したらtrue
      if(sv.done) return true;
      const t0 = budgetMs ? performance.now() : 0;
      while(idx < layer.length){
        const node = layer[idx++];
        for(const m of solverMoves(node.st, batch)){
          const ns = solverApply(node.st, m), key = solverKey(ns);
          if(seen.has(key)) continue;
          seen.add(key);
          const h = solverLowerBound(ns), child = {st:ns, par:node, mv:m, h};
          if(h === 0){   // 完成：親をたどって手順を復元
            const path = []; for(let n = child; n.par; n = n.par) path.push([n.mv[0], n.mv[1]]);
            sv.result = {len:path.length, path:path.reverse()}; sv.done = true; return true;
          }
          next.push(child);
        }
        if(budgetMs && performance.now() - t0 > budgetMs) return false;
      }
      if(!next.length || ++depth >= 300){ sv.done = true; return true; }
      // 下界が小さく、空き瓶が多い（動かしやすい）状態を優先して、上位width個だけ残す
      next.forEach(n => { let e = 0; for(const b of n.st) if(!b.length) e++; n.sc = n.h * 3 - e; });
      next.sort((a, b) => a.sc - b.sc);
      layer = next.length > width ? next.slice(0, width) : next; idx = 0; next = [];
      return false;
    },
    finish(){ while(!sv.step()); return sv.result; }
  };
  if(solverLowerBound(start) === 0){ sv.result = {len:0, path:[]}; sv.done = true; }
  return sv;
}
/* いまの盤面（数値の配列）をソルバー用の文字列表現にする */
const solverState = () => bottles.map(b => b.map(v => String.fromCharCode(97 + currentIds.indexOf(v))).join(''));

/* ステージ開始時に、1個ずつ／まとめ移動の両方のparをバックグラウンドで計算する（1層ずつ分割して画面を止めない） */
let parToken = 0, parInfo = {};
// ステージ開始時に、1個ずつ／まとめ移動の両方のparをバックグラウンドで計算する。
// 1層ずつ・約8msずつ進めるので、計算中も操作は止まらない。ステージが変わったら古い計算は破棄する(parToken)。
function startParCalc(){
  const token = ++parToken, start = solverState(), width = currentIds.length <= 6 ? 300 : 200;
  const info = parInfo = {};
  ['single', 'batch'].forEach(mode => { info[mode] = {len:null, lb:solverLowerBound(start), sv:createSolver(start, mode === 'batch', width)}; });
  const fin = p => { const r = p.sv.result; p.len = r ? r.len : p.lb + 4; };   // 万一解けなかったときは下界+4で代用
  const tick = () => {
    if(token !== parToken) return;   // 別のステージが始まったら破棄
    const p = info.single.len === null ? info.single : info.batch.len === null ? info.batch : null;
    if(!p) return;
    if(p.sv.step(8)){ fin(p); updateParText(); }   // 1回あたり約8msだけ進める（操作を邪魔しない）
    if(info.single.len === null || info.batch.len === null) setTimeout(tick, 0);
  };
  if(info.single.sv.done) fin(info.single);
  if(info.batch.sv.done) fin(info.batch);
  setTimeout(tick, 0);
}
/* 計算が間に合っていなければここで最後まで解く（クリア判定用） */
// parを返す。計算が間に合っていなければ、ここで最後まで解く（クリア判定用）。
function getPar(mode){
  const p = parInfo[mode]; if(!p) return null;
  if(p.len === null){ const r = p.sv.finish(); p.len = r ? r.len : p.lb + 4; }
  return p.len;
}
const judgedMode = () => (batchPoured || batchMode) ? 'batch' : 'single';   // 評価に使うparの種類
const spentMoves = () => moves + (5 - undoRemaining);   // 実際に注いだ回数（UNDOで取り消した手も含める）
/* parに対する手数から★を決める: ★3 = par+max(2,12%) 以内、★2 = par+max(4,50%) 以内、それ以外は★1 */
function rateMoves(par, spent){
  const t3 = par + Math.max(2, Math.ceil(par * 0.12)), t2 = par + Math.max(4, Math.ceil(par * 0.5));
  return {t3, t2, stars: spent <= t3 ? 3 : spent <= t2 ? 2 : 1};
}
/* ヘッダーの評価基準表示。到達できなくなった段は薄く表示する */
function updateParText(){
  const el = $('par-text'), p = parInfo[judgedMode()];
  if(inExtra){ el.textContent = 'EXTRA　★評価なし'; return; }
  if(assistUsed){ el.textContent = '補助を使用　評価は★1'; return; }
  if(!p || p.len === null){ el.textContent = '目安を計算中…'; return; }
  const r = rateMoves(p.len, spentMoves()), sp = spentMoves();
  el.innerHTML = `<span class="${sp > r.t3 ? 'lost' : ''}">★★★ ${r.t3}手以内</span>　<span class="${sp > r.t2 ? 'lost' : ''}">★★ ${r.t2}手以内</span>` + (rec.best[currentStage] ? `<span class="par-best">　自己ベスト ${rec.best[currentStage]}手</span>` : '');
}
/* 操作してよい状態か（画面遷移中・クリア後・確認ダイアログ表示中は不可） */
const canAct = () => !isTransitioning && !stageCleared && !$('clear-modal').classList.contains('show') && !$('confirm-modal').classList.contains('show') && !$('gem-modal').classList.contains('show');

// ステージを開始する：状態の初期化 → 盤面生成 → par計算開始 → 描画 → ゲーム画面を表示
// ex=true ならエクストラ。通常⇔エクストラの切替では、見た目・音・連続クリア数を整える。
function startStage(stage, ex){
  if(inExtra && !ex) xtLeave();
  inExtra = !!ex; XK = ex ? stage : 0;
  if(!ex) xtStreak = 0;
  const carry = xtCarry; xtCarry = 0; stageT0 = performance.now();
  currentStage = stage; hintsLeft = 3; moves = 0; undoRemaining = 5; selectedIdx = null; moveHistory = []; extraBottleAdded = false;
  assistUsed = false; batchPoured = false; stageCleared = false;
  if(inExtra){ xtData.att[stage] = (xtData.att[stage] || 0) + 1; saveJSON('lumina_xt', xtData); XT = xtNewTracker(stage, carry); xtEnter(stage); }
  else{ XT = null; $('xt-hint').hidden = true; applyRealmTheme(getRealm(stage)) }
  $('stage-num').textContent = stage;
  $('moves-num').textContent = 0;
  $('undo-num').textContent = undoRemaining;
  $('add-bottle-btn').disabled = false;
  bottles = generateLevel(stage);
  prevDone = [];
  if(inExtra){ parToken++; parInfo = {}; XT.LB = solverLowerBound(solverState()); XT.nb0 = bottles.length; showXtHint(); }   // エクストラは★評価なし。ソルバーの下界だけ条件判定に使う
  else startParCalc();
  updateParText();
  updateUndoButton(); updateHintBtn();
  renderBoard();
  showScreen('game');
}

// UNDOボタンの有効/無効（履歴が無い・回数切れなら無効）
function updateUndoButton(){ $('undo-btn').disabled = moveHistory.length === 0 || undoRemaining <= 0; }

// その瓶が完成しているか（4個とも同じ色）
const isDoneBottle = b => b.length === BOTTLE_CAPACITY && b.every(v => v === b[0]);
// 盤面を作り直す。瓶ごとに「瓶 + 台座 + 名札」を組み立て、完成した瓶には宝石名の名札を付ける。
// 完成したばかりの瓶には .fresh を付け、完成演出を1回だけ再生する（prevDone と比較）。
function renderBoard(){
  const board = $('game-board');
  board.innerHTML = '';
  const doneNow = bottles.map(isDoneBottle);
  const rack = document.createElement('div'); rack.className = 'rack';
  bottles.forEach((bottle, i) => {
    const done = doneNow[i];
    const slot = document.createElement('div');
    slot.className = 'slot' + (done ? ' done' : '') + (done && !prevDone[i] ? ' fresh' : '');
    const el = document.createElement('div');
    el.className = 'bottle' + (done ? ' completed' : '');
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', `瓶${i+1}`);
    bottle.forEach(v => {
      const g = document.createElement('div');
      g.className = 'gem';
      g.style.setProperty('--g', gemBg(v));
      g.innerHTML = `<span>${gemSym(v)}</span>`;
      el.appendChild(g);
    });
    const ped = document.createElement('div'); ped.className = 'pedestal';
    const plate = document.createElement('div'); plate.className = 'plate';
    plate.textContent = done ? GEM_LORE[bottle[0]][0] : '';   // 完成した瓶には宝石の名前の札が付く
    slot.append(el, ped, plate);
    slot.addEventListener('click', () => handleBottleClick(i));
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); handleBottleClick(i); } });
    rack.appendChild(slot);
  });
  board.appendChild(rack);
  prevDone = doneNow;
  updateSelection();
  updateProgress();
  fitBoard();
}
// 進捗メーターと「SORTED n / m」を更新する
function updateProgress(){
  const f = $('progress-fill'); if(!f) return;
  const total = currentIds.length || 1, n = bottles.filter(isDoneBottle).length;
  f.style.width = Math.min(100, n / total * 100) + '%';
  $('progress-text').textContent = `SORTED ${n} / ${total}`;
}
/* 画面の広さと瓶の本数から、全部が収まる最大の大きさを選ぶ */
// 画面の広さと瓶の本数から、全部が収まる最大の大きさ(--sc)を選ぶ。段ごとの本数は均等にそろえる（例: 14本 → 7本ずつ）。
function fitBoard(){
  const board = $('game-board'); if(!board) return;
  const W = board.clientWidth - 16, H = board.clientHeight, n = bottles.length;
  if(W <= 0 || H <= 0) return;
  let sc = 0.38, cols = Math.max(1, Math.floor((W + 14 * sc) / (110 * sc)));
  for(let s = 1.3; s >= 0.38; s -= 0.04){
    const c = Math.max(1, Math.floor((W + 14 * s) / (110 * s))), rows = Math.ceil(n / c);
    if((rows * 248 + 60) * s <= H){ sc = s; cols = c; break; }
  }
  // 段ごとの本数を均等にする（例: 14本 → 7本ずつ）
  const rows = Math.ceil(n / cols); cols = Math.ceil(n / rows);
  board.style.setProperty('--sc', sc.toFixed(2));
  if(board.firstElementChild) board.firstElementChild.style.maxWidth = Math.ceil((cols * 110 - 14) * sc + 2) + 'px';
  // 極小の画面で盤面が収まらないときだけ、エクストラでも盤面の縦スクロールを許す（普段はなぞる操作を優先して無効）
  document.body.classList.toggle('xt-scroll', board.scrollHeight > board.clientHeight + 2);
}

/* 選択だけの切り替えはクラス操作のみ（持ち上げアニメーションが効く） */
// 選択中の瓶に .selected を付け、一番上の宝石だけを持ち上げる（作り直さないのでアニメーションが効く）
function updateSelection(){
  document.querySelectorAll('.bottle').forEach((el, i) => {
    el.classList.toggle('selected', i === selectedIdx);
    if(el.lastElementChild) el.lastElementChild.classList.toggle('lifted', i === selectedIdx);   // 一番上の宝石だけがそっと持ち上がる
  });
}
// 宝石を図鑑に登録する（初めてのときだけ通知し、称号を確認する）
function discoverGem(c){
  if(stats.gems.includes(c)) return;
  stats.gems.push(c); saveJSON('lumina_stats', stats);
  showToast((c < CURATED ? '宝石を発見: ' : '鉱物を発見: ') + GEM_LORE[c][0]);
  quizSync(true, GENRE_OF[c]);   // そのジャンルが埋まったら、クイズが出現する
  checkTitles();
}
// このステージに出す宝石を n 種選ぶ。まだ見つけていない厳選宝石を優先し、足りなければ未発見の鉱物からランダムに選ぶ。
function pickGems(n){
  const have = new Set(stats.gems), total = NORMAL_COUNT, cur = [], pool = [];   // 通常の宝石・鉱物だけから選ぶ（幻の石は含めない）
  for(let i = 0; i < total; i++) if(!have.has(i)) (i < CURATED ? cur : pool).push(i);
  const out = cur.slice(0, n);
  while(out.length < n && pool.length){ const j = Math.floor(Math.random() * pool.length); out.push(pool[j]); pool[j] = pool[pool.length-1]; pool.pop(); }
  while(out.length < n){ const r = Math.floor(Math.random() * total); if(!out.includes(r)) out.push(r); }
  return out;
}
// 宝石番号 v の色（背景グラデーション）。厳選宝石は固定色、鉱物は色相を等間隔に割り当てて見分けやすくする。
function gemBg(v){
  if(v < CURATED) return GEM_PALETTE[v].bg;
  const k = Math.max(0, currentIds.indexOf(v)), n = Math.max(1, currentIds.length), h = (k * 360 / n + currentStage * 17) % 360;
  return `radial-gradient(circle at 35% 35%,hsl(${h},75%,${k % 2 ? 72 : 62}%),hsl(${(h + 28) % 360},65%,24%))`;
}
// 「色の記号」モードで宝石に重ねる記号
function gemSym(v){ return SYMS[Math.max(0, currentIds.indexOf(v)) % SYMS.length]; }
// 図鑑用：鉱物の番号から決まる色（毎回同じ色になる）
function hashBg(i){ const h = (i * 137.508) % 360; return `radial-gradient(circle at 35% 35%,hsl(${h},75%,68%),hsl(${(h + 28) % 360},65%,24%))`; }
// HINTボタンの表示（残り回数）と有効/無効
function updateHintBtn(){ $('hint-btn').textContent = `💡 HINT ${hintsLeft}`; $('hint-btn').disabled = hintsLeft <= 0; }
/* 予備のヒント（ソルバーが使えないときの簡易版） */
function fallbackMove(){
  const full = b => b.length === BOTTLE_CAPACITY && b.every(v => v === b[0]);
  let second = null, spare = null;
  for(let f = 0; f < bottles.length; f++){
    const A = bottles[f]; if(!A.length || full(A)) continue;
    const c = A[A.length-1], uni = A.every(v => v === c);
    for(let t = 0; t < bottles.length; t++){
      const B = bottles[t]; if(t === f || B.length >= BOTTLE_CAPACITY) continue;
      if(B.length && B[B.length-1] === c){
        if(B.every(v => v === c)) return [f, t];
        if(!uni && !second) second = [f, t];
      }else if(!B.length && !uni && !spare) spare = [f, t];
    }
  }
  return second || spare;
}
/* いまの盤面から解を探し、その最初の一手（[from, to]）を返す */
function findMove(){
  if(inExtra) return fallbackMove();   // エクストラは色が多く、ソルバーでは時間がかかるため、簡易のヒント（完成に近づく手）を返す
  try{
    const r = createSolver(solverState(), batchMode, 60).finish();
    if(r && r.path.length) return r.path[0];
  }catch(e){}
  return fallbackMove();
}
/* 補助（HINT／+BOTTLE）を初めて使うときだけ、★1になることを確認する。使ってよければtrue */
async function confirmAssist(){
  if(assistUsed) return true;
  if(inExtra){ assistUsed = true; return true; }   // エクストラには★がないので、確認は不要
  const ok = await askConfirm('ASSIST', 'ヒントや +BOTTLE を使うと、\nこのステージの評価は★1になります。\n使いますか？', '使う');
  if(!ok || !canAct()) return false;
  assistUsed = true; updateParText();
  return true;
}
async function useHint(){
  if(!canAct() || hintsLeft <= 0) return;
  const m = findMove();
  if(!m){ showToast('ひと呼吸おいてみましょう。+ BOTTLE が助けになるかもしれません。'); return; }
  if(!await confirmAssist()) return;
  hintsLeft--; if(XT) XT.hint++; updateHintBtn(); selectedIdx = null; updateSelection();
  const els = document.querySelectorAll('.bottle');
  m.forEach(i => els[i] && els[i].classList.add('hint'));
  setTimeout(() => m.forEach(i => els[i] && els[i].classList.remove('hint')), 4500);
}
// 移した先の宝石に「落ちる」アニメーションを付ける
function settle(idx){ const el = document.querySelectorAll('.bottle')[idx]; if(el && el.lastElementChild) el.lastElementChild.classList.add('drop'); }
// 指定した瓶の位置から、金色の火花を散らす
function burstAt(cx, cy, n){
  if(reduceMotion) return;
  for(let i = 0; i < n; i++){ const a = Math.random()*Math.PI*2, v = .6 + Math.random()*2; bursts.push({x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - .6, a:.9, s:1 + Math.random()*2}); }
}
// クリアの余韻：領域の色の光がふわりと広がり、星の数だけ花火が上がる（領域の節目は大きく）
function clearFlourish(stars, big){
  audio.playClearChime(stars, big);
  if(reduceMotion) return;
  const g = $('clear-glow'); g.classList.remove('go'); void g.offsetWidth; g.classList.add('go');
  const n = big ? 7 : stars;
  for(let i = 0; i < n; i++) setTimeout(() => burstAt(innerWidth * (.15 + Math.random() * .7), innerHeight * (.15 + Math.random() * .5), big ? 40 : 26), 500 + i * 260);
}
function burst(idx){
  if(reduceMotion) return;
  const el = document.querySelectorAll('.bottle')[idx]; if(!el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  for(let i = 0; i < 28; i++){ const a = Math.random()*Math.PI*2, v = .6 + Math.random()*1.8; bursts.push({x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - .6, a:.9, s:1 + Math.random()*2}); }
}

// 移せるか：移動元に宝石があり、移動先に空きがあればよい（色の制限はない）
function canPour(from, to){
  return from !== to && bottles[from].length > 0 && bottles[to].length < BOTTLE_CAPACITY;   // 色の制限なし
}

// 瓶がタップされたときの処理。
// 1回目のタップ＝移す宝石を選ぶ / 同じ瓶をもう一度＝選択解除 / 別の瓶＝そこへ移す（移せなければ、その瓶を選び直す）。
function handleBottleClick(idx){
  if(!canAct()) return;
  audio.init();
  if(inExtra) xtTap(idx);
  if(selectedIdx === null){
    if(bottles[idx].length > 0){ selectedIdx = idx; audio.playGemTouch(); updateSelection(); }
    return;
  }
  if(selectedIdx === idx){ selectedIdx = null; updateSelection(); return; }

  const from = selectedIdx, to = idx;
  if(canPour(from, to)){
    // UNDO用に、移す前の盤面を丸ごと保存する
    moveHistory.push(bottles.map(b => [...b]));
    const color = bottles[from][bottles[from].length-1], before = bottles[to].length;
    // 1個ずつ移動が基本。まとめ移動モードのときは、同じ色が続く限り（移動先が満杯になるまで）続けて移す。
    do{
      bottles[to].push(bottles[from].pop());
    }while(batchMode && bottles[from].length && bottles[from][bottles[from].length-1] === color && bottles[to].length < BOTTLE_CAPACITY);
    moves++;
    if(inExtra) xtPour(from, to, bottles[to].length - before, color, before);   // 行動の記録（条件の判定に使う）
    // 2個以上移れていたら、評価はまとめ移動用のparで判定する
    if(bottles[to].length - before > 1) batchPoured = true;   // 2個以上まとめて移した
    $('moves-num').textContent = moves;
    updateParText();
    selectedIdx = null;
    audio.playLiquidPour();
    if(bottles[to].length === BOTTLE_CAPACITY && bottles[to].every(v => v === color)) setTimeout(() => audio.playCompleteHarp(), 100);
    updateUndoButton();
    renderBoard();
    settle(to);
    if(bottles[to].length === BOTTLE_CAPACITY && bottles[to].every(v => v === color)){ burst(to); discoverGem(color); }
    checkClear();
  }else{
    selectedIdx = bottles[to].length > 0 ? to : null;
    if(selectedIdx !== null) audio.playGemTouch();
    updateSelection();
  }
}

// クリア判定と、その後の処理。
// 進行状況・統計・★の保存 → 称号の確認 → クリア画面の表示。stageCleared で二重判定を防ぐ。
function checkClear(){
  if(stageCleared || !isSolved(bottles)) return;
  stageCleared = true;
  if(inExtra){ clearExtra(); return; }
  const firstClear = currentStage >= maxUnlockedStage;   // 初めてのクリアなら、対応するエクストラが開く
  if(currentStage >= maxUnlockedStage){ maxUnlockedStage = currentStage + 1; saveMaxStage(maxUnlockedStage); }
  const cfg = getStageConfig(currentStage);
  currentIds.forEach(discoverGem);
  stats.clears++; stats.moves += moves; stats.tubes += cfg.colorCount;
  if(undoRemaining === 5) stats.noUndo++;
  if(audio.bgmEnabled) stats.bgmClears++;
  // ★評価: 補助（HINT／+BOTTLE）を使ったら★1固定。使っていなければ、最短手数(par)との差で決める
  const par = getPar(judgedMode()), spent = spentMoves(), undone = 5 - undoRemaining;
  const rr = assistUsed ? null : rateMoves(par, spent), stars = assistUsed ? 1 : rr.stars;
  if(!assistUsed && spent <= par) stats.swift++;
  if(new Date().getHours() < 4) stats.night++;
  if(currentStage >= 20 && undoRemaining === 5 && !assistUsed) stats.solo++;
  if(stars === 3){ stats.three++; stats.run3++; } else stats.run3 = 0;   // ★3の連続記録（シークレット称号用）
  if(stars > (bestStars[currentStage] || 0)){ bestStars[currentStage] = stars; saveJSON('lumina_stars', bestStars); }
  // 自己ベスト（補助なしの手数）。更新したら回数を数える
  let bestNote = '';
  if(!assistUsed){
    const prev = rec.best[currentStage], now = Math.max(1, spent);
    if(!prev){ rec.best[currentStage] = now; bestNote = `自己ベスト ${now}手`; }
    else if(now < prev){ rec.best[currentStage] = now; rec.bestUp++; bestNote = `◆ 自己ベストを更新　${prev}手 → ${now}手`; }
    else bestNote = `自己ベスト ${prev}手`;
  }
  saveJSON('lumina_rec', rec);
  saveJSON('lumina_stats', stats);
  lastClear = {stage:currentStage, moves, hour:new Date().getHours(), sec:(performance.now() - stageT0) / 1000, undoLeft:undoRemaining, silent:!audio.bgmEnabled && !audio.sfxEnabled};
  checkTitles();
  lastClear = null;
  const last = currentStage >= MAX_STAGE;
  $('clear-title').textContent = last ? 'ALL CLEAR' : 'HARMONY';
  const lead = last ? '全100ステージをクリアしました。穏やかな時間をありがとうございました。'
    : currentStage % 10 === 0 ? '領域を突破し、次の世界（REALM）が開かれました。' : '心が整い、静かな時間が訪れました。';
  const exOpen = firstClear && currentStage === XT_OPEN_AT ? '\n◆ 新しい扉が現れました（STAGES の EXTRA）' : firstClear && currentStage > XT_OPEN_AT ? `\n◆ EXTRA ${currentStage} が開きました` : '';
  const detail = `${moves}手でそろえました${undone ? `（UNDO ${undone}回を加えて ${spent}手）` : ''}\n` +
    (assistUsed ? 'ヒントか +BOTTLE を使ったため、評価は★1です。' : `最短の目安は ${par}手です。`) +
    (bestNote ? `\n${bestNote}` : '') + (rr && stars < 3 ? `\n★3は ${rr.t3}手以内です` : '');
  $('clear-modal-desc').textContent = `${lead}\n${detail}\n${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}${exOpen}`;
  $('next-btn').textContent = last ? 'BACK TO MENU' : 'NEXT STAGE';
  // 全部の瓶から、少しずつずらして火花を散らす
  bottles.forEach((_, i) => setTimeout(() => burst(i), i * 120));
  setTimeout(() => { if(stageCleared && screens.game.classList.contains('active')) $('clear-modal').classList.add('show'); }, 300);
  clearFlourish(stars, last || currentStage % 10 === 0);
}

/* ---------- エクストラの仕組み ---------- */
/* ---------- エクストラステージ ----------
   各基本ステージをクリアすると、同じ番号のエクストラが開く。色数は2倍。1面につき1つ、フィクションストーンが出る。
   入手の条件は FIC[k-1].cond（xt-prims の部品）。判定に使う行動の記録は、挑戦ごとに作るトラッカー XT。 */
const xtNow = () => window.__xtNow ? new Date(window.__xtNow) : new Date();
const nGems = s => s.gems.filter(i => i < NORMAL_COUNT).length;                 // 通常の宝石・鉱物の発見数（幻の石は除く）
const ficCount = s => s.gems.filter(i => i >= FIC_BASE).length;                 // 入手した幻の石の数
const xtClears = () => Object.keys(xtData.clr).filter(k => xtData.clr[k] > 0).length;
// エクストラは、基本ステージを30クリアするまで、存在ごと隠す（すでに記録がある場合は表示する）

const xtVisible = () => maxUnlockedStage > XT_OPEN_AT || xtClears() > 0 || ficCount(stats) > 0;   // クリア済みのエクストラの数

// 挑戦ごとの行動記録を新しく作る
function xtNewTracker(k, resets){
  const cfg = getStageConfig(k);
  return {k, C:cfg.colorCount, G:cfg.colorCount * BOTTLE_CAPACITY, nb0:cfg.bottleCount, LB:0, t0:performance.now(), moves:0, dur:0, clock:null,
    pours:[], comps:[], undo:0, hint:0, reset:resets || 0, bottle:0, addedIdx:-1, modeSw:0, pourSingle:0, gather:false,
    firstAct:null, maxPourGap:0, sameIdx:-1, sameRun:0, sameMax:0,

    tapT:[], rapid:false, dbl:0, lastBg:null, bgT:[], triple:false, stageT:[], stageTaps:0, titleT:[], titleTaps:0,

// 判定に使う値（手数・所要時間・時刻）を最新にする
function xtSync(){ if(!XT) return; XT.moves = moves; XT.dur = (performance.now() - XT.t0) / 1000; XT.clock = xtNow(); }
// 途中で成立する条件（mode='l'）を調べ、満たしていたらその場で入手する
function xtCheckLive(){
  if(!inExtra || !XT || stageCleared) return;
  const f = FIC[XK - 1];
  if(f.mode !== 'l' || stats.gems.includes(FIC_BASE + XK - 1)) return;
  xtSync();
  if(f.cond(XT)) awardStone(XK, 600);

// 瓶を移したときの記録（完成したら comps にも残す）
function xtPour(from, to, n, color, toBefore){
  const X = XT; if(!X) return;
  const t = performance.now() - X.t0, last = X.pours[X.pours.length - 1];
  if(last) X.maxPourGap = Math.max(X.maxPourGap, (t - last.t) / 1000);
  const comp = bottles[to].length === BOTTLE_CAPACITY && bottles[to].every(v => v === color);
  X.pours.push({t, from, to, n, color, comp, toBefore});
  if(!batchMode) X.pourSingle++;
  if(comp){
    X.comps.push({idx:to, color, t});
    const L = X.pours.slice(-4);   // 空き瓶へ4回続けて移して完成させた
    if(L.length === 4 && L.every(q => q.to === to && q.n === 1) && L[0].toBefore === 0) X.gather = true;
  }
  xtCheckLive();
}
// 瓶をタップしたとき：同じ瓶の連続タップを数える（キーボード操作でも最初の操作として記録する）
function xtTap(idx){
  const X = XT; if(!X) return;
  if(X.firstAct === null) X.firstAct = (performance.now() - X.t0) / 1000;
  X.sameRun = X.sameIdx === idx ? X.sameRun + 1 : 1; X.sameIdx = idx; X.sameMax = Math.max(X.sameMax, X.sameRun);
  xtCheckLive();
}
// UNDOしたとき：直前の記録を取り消す
function xtUndo(){ const X = XT; if(!X) return; X.undo++; const p = X.pours.pop(); if(p && p.comp) X.comps.pop(); }

/* --- 画面のジェスチャーの記録（pointer / キーボード / 向き / タブ移動） --- */
const xtActive = () => inExtra && XT && !stageCleared && screens.game.classList.contains('active') && !$('gem-modal').classList.contains('show') && !$('confirm-modal').classList.contains('show');
let xtPtr = {down:false, x:0, y:0, t:0, idx:-1, kinds:[], moved:false, timer:0};
function xtZone(x, y){
  const W = innerWidth, H = innerHeight, c = 40, e = 20;
  const T = y < c, B = y > H - c, L = x < c, Rr = x > W - c;
  return {corner:(T && L) ? 'TL' : (T && Rr) ? 'TR' : (B && L) ? 'BL' : (B && Rr) ? 'BR' : '',
          edges:[x < e ? 'L' : '', x > W - e ? 'R' : '', y < e ? 'T' : '', y > H - e ? 'B' : ''].filter(Boolean)};
}
function xtDown(e){
  if(!xtActive()) return;
  const X = XT, now = performance.now(), t = now - X.t0, x = e.clientX, y = e.clientY, tg = e.target && e.target.closest ? e.target : document.body;
  if(X.firstAct === null) X.firstAct = t / 1000;
  const z = xtZone(x, y), slot = tg.closest('.slot');
  const idx = slot ? [...slot.parentNode.children].indexOf(slot) : -1;
  // 長押しの対象（隅 / 進み具合の表示 / 瓶）
  const kinds = [];
  if(z.corner) kinds.push(z.corner);
  if(tg.closest('#progress-text,.meter')) kinds.push('meter');
  if(idx >= 0){ kinds.push('bottle'); if(bottles[idx] && bottles[idx].length === 0) kinds.push('empty'); }
  clearInterval(xtPtr.timer);
  xtPtr = {down:true, x, y, t:now, idx, kinds, moved:false, timer:setInterval(xtHoldTick, 100)};
  // 四隅を順にタップ（途中で別の場所を触るとやり直し）
  if(idx < 0){ X.sameIdx = -1; X.sameRun = 0; }   // 瓶以外を触ったら、同じ瓶の連続タップはやり直し
  if(z.corner){ X.cseq.push(z.corner); if(X.cseq.length > 8) X.cseq.shift(); } else X.cseq.length = 0;
  // 画面の端を連続タップ（各タップは2秒以内、別の場所を触るとやり直し）
  ['L', 'R', 'T', 'B'].forEach(s => {
    if(z.edges.includes(s)){ X.edge[s] = (X.edge[s] > 0 && t - X.edgeT[s] <= 2000) ? X.edge[s] + 1 : 1; X.edgeT[s] = t; X.edgeMax[s] = Math.max(X.edgeMax[s], X.edge[s]); }
    else X.edge[s] = 0;
  });
  // 連打（4秒に20回）
  X.tapT.push(t); X.tapT = X.tapT.filter(v => t - v <= 4000); if(X.tapT.length >= 20) X.rapid = true;
  // 何もない所のダブルタップ / 3連続タップ
  if(!tg.closest('button,.slot,header,.modal-overlay,#loading-screen,#toast')){
    const lb = X.lastBg;
    if(lb && t - lb.t < 350 && Math.hypot(x - lb.x, y - lb.y) < 50){ X.dbl++; X.lastBg = null; } else X.lastBg = {t, x, y};
    X.bgT.push(t); X.bgT = X.bgT.filter(v => t - v <= 700); if(X.bgT.length >= 3) X.triple = true;
  }
  // ステージ番号・タイトルの連続タップ
  if(tg.closest('#stage-num')){ X.stageT.push(t); X.stageT = X.stageT.filter(v => t - v <= 5000); X.stageTaps = Math.max(X.stageTaps, X.stageT.length); }
  if(tg.closest('.game-nav h1')){ X.titleT.push(t); X.titleT = X.titleT.filter(v => t - v <= 2000); X.titleTaps = Math.max(X.titleTaps, X.titleT.length); }
  xtCheckLive();
}
function xtMove(e){ if(xtPtr.down && Math.hypot(e.clientX - xtPtr.x, e.clientY - xtPtr.y) > 14) xtPtr.moved = true; }
// 押している間、100msごとに長押しの長さを記録する
function xtHoldTick(){
  const p = xtPtr; if(!p.down || !XT || p.moved || !xtActive()) return;
  const d = performance.now() - p.t;
  p.kinds.forEach(k => { XT.hold[k] = Math.max(XT.hold[k] || 0, d); });
  xtCheckLive();
}
function xtUp(e){
  const p = xtPtr; if(!p.down) return;
  clearInterval(p.timer); p.down = false;
  if(!xtActive()) return;
  const X = XT, dx = e.clientX - p.x, dy = e.clientY - p.y, dist = Math.hypot(dx, dy), dt = performance.now() - p.t;
  if(e.type === 'pointerup' && dt < 900 && dist >= 90){   // すばやくなぞった向きを、矢印として記録
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? '→' : '←') : (dy > 0 ? '↓' : '↑');
    X.dirs = (X.dirs + dir).slice(-16);
    if(p.y < 48 && dy >= 200) X.swipeTop = true;
    if(p.idx === 0 && dy <= -110 && dt < 800 && Math.abs(dx) < 80) X.pullUp = true;
  }
  xtCheckLive();
}
addEventListener('pointerdown', xtDown, true);
addEventListener('pointermove', xtMove, true);
addEventListener('pointerup', xtUp, true);
addEventListener('pointercancel', xtUp, true);
addEventListener('keydown', e => {
  const m = {ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→'}[e.key];
  if(m && xtActive()){ XT.dirs = (XT.dirs + m).slice(-16); xtCheckLive(); }
});
document.addEventListener('visibilitychange', () => {
  if(!XT) return;
  if(document.hidden) XT.hiddenAt = performance.now();
  else if(XT.hiddenAt){ XT.away = Math.max(XT.away, (performance.now() - XT.hiddenAt) / 1000); XT.hiddenAt = 0; xtCheckLive(); }
});
addEventListener('resize', () => { if(XT && (innerWidth > innerHeight) !== XT.land0){ XT.rotated = true; xtCheckLive(); } });

/* --- テーマの適用と解除 --- */
// エクストラの見た目・音を適用する（背景・粒・重ね演出・背景の大きな絵文字・BGM・効果音）
function xtEnter(k){
  const f = FIC[k - 1], th = XT_THEMES[f.theme], r = document.documentElement.style;
  r.setProperty('--bg-gradient-inner', th.bi); r.setProperty('--bg-gradient-outer', th.bo); r.setProperty('--theme-accent', th.ac);
  particleRgb = th.rgb; particleMode = th.pm; particles.forEach(p => p.reset(true));
  [...document.body.classList].filter(c => /^xt/.test(c) || c === 'inxt').forEach(c => document.body.classList.remove(c));
  document.body.classList.add('inxt', 'xt-' + f.theme, 'xtov-' + th.ov);
  $('xt-emblem').textContent = f.emb; $('xt-emblem').style.filter = `saturate(.6) hue-rotate(${(k * 29) % 50 - 25}deg)`;
  $('home-realm-tag').textContent = 'EXTRA'; $('game-realm-tag').textContent = 'EXTRA ' + XT_NAMES[k];
  // 石ごとの違い：移調（半音）とテンポ
  const semi = [0, 2, -2, 3, -3, 5, -5, 1, -1, 4][k % 10], root = th.root * Math.pow(2, semi / 12);
  audio.scale = XT_SCALES[th.sc].map(i => root * Math.pow(2, i / 12));
  audio.base = [root / 2, root / 2 + 5 + (k % 4)];
  audio.xs = {bgm:th.bg, sfx:th.sx, tempo:[1, .9, 1.1, .95, 1.05, .85, 1.15, 1][k % 8]};
  if(audio.bgm){ audio.stopBGM(); audio.startBGM(); }
}
// エクストラから出るとき：通常の見た目・音に戻す
function xtLeave(){
  inExtra = false; XK = 0; XT = null; xtStreak = 0; $('xt-hint').hidden = true;
  clearInterval(xtPtr.timer); xtPtr.down = false;
  [...document.body.classList].filter(c => /^xt/.test(c) || c === 'inxt').forEach(c => document.body.classList.remove(c));
  particleMode = 'rise'; particles.forEach(p => p.reset(true));
  audio.xs = null; audio.base = null;
  applyRealmTheme(getRealm(Math.min(maxUnlockedStage, MAX_STAGE)));
}
// エクストラ用の宝石の選び方：必須の色を先頭に置き、残りは「いま選んだ色からいちばん離れた色」を順に足していく
// （色数が多くても見分けやすくするため。ステージ番号で決まるので、同じ面はいつも同じ色の組になる）。
const gemRgbCache = {};
const gemRgb = i => gemRgbCache[i] || (gemRgbCache[i] = (() => {
  const hx = GEM_PALETTE[i].bg.match(/#[0-9a-fA-F]{6}/g) || ['#888888'], v = [0, 0, 0];
  hx.slice(0, 2).forEach(h => { for(let c = 0; c < 3; c++) v[c] += parseInt(h.substr(1 + 2 * c, 2), 16) / Math.min(2, hx.length); });
  return v;
})());
function xtPickGems(k, n){
  const out = [];
  FIC[k - 1].need.forEach(nm => { const i = gidOf(nm); if(i >= 0 && !out.includes(i) && out.length < n) out.push(i); });
  const rot = (k * 13) % CURATED, pool = Array.from({length:CURATED}, (_, j) => (j + rot) % CURATED).filter(i => !out.includes(i));
  if(!out.length) out.push(pool.shift());
  const dist = (a, b) => { const p = gemRgb(a), q = gemRgb(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
  while(out.length < n && pool.length){
    let bi = 0, bd = -1;
    pool.forEach((c, j) => { const m = Math.min(...out.map(o => dist(c, o))); if(m > bd){ bd = m; bi = j; } });
    out.push(pool.splice(bi, 1)[0]);
  }
  return out;
}
// ヘッダーに、入手のヒント（入手済みなら入手済みの表示）を出す
function showXtHint(){
  const el = $('xt-hint'), f = FIC[XK - 1];
  el.hidden = false;
  el.textContent = stats.gems.includes(FIC_BASE + XK - 1) ? '◆ この石は入手済みです' : '◆ ヒント：' + f.hint;
}

/* --- 石の入手 --- */
// フィクションストーンを入手する（初めてのときだけ true）。少し間をおいて入手の演出を出す。
function awardStone(k, delay){
  const id = FIC_BASE + k - 1;
  if(stats.gems.includes(id)) return false;
  stats.gems.push(id); saveJSON('lumina_stats', stats);
  audio.playStoneGet();
  bottles.forEach((_, i) => setTimeout(() => burst(i), i * 40));
  showToast('幻の石を入手: ' + FIC[k - 1].name);
  checkTitles();
  setTimeout(() => showStoneGet(id), delay === undefined ? 1300 : delay);
  if(inExtra && XK === k) $('xt-hint').textContent = '◆ この石は入手済みです';
  return true;
}
// 入手の演出：図鑑と同じ詳細ポップアップを、「入手しました」の帯つきで開く
function showStoneGet(id){
  $('toast').classList.remove('show');   // お知らせが詳細シートに重ならないように
  gemView = -1; gemList = [id]; gemCur = id; gemJustGot = true; gemOpener = null;
  renderGemModal();
  $('gem-modal').classList.add('show'); $('gs-close').focus();
}
// エクストラをクリアしたときの処理（統計・入手判定・クリア画面）
function clearExtra(){
  const k = XK, X = XT, cfg = getStageConfig(k), undone = 5 - undoRemaining, id = FIC_BASE + k - 1, f = FIC[k - 1];
  xtSync();
  xtData.clr[k] = (xtData.clr[k] || 0) + 1; xtStreak++; saveJSON('lumina_xt', xtData);
  currentIds.forEach(discoverGem);
  stats.clears++; stats.moves += moves; stats.tubes += cfg.colorCount;
  if(undoRemaining === 5) stats.noUndo++;
  if(audio.bgmEnabled) stats.bgmClears++;
  if(X.clock.getHours() < 4) stats.night++;
  saveJSON('lumina_stats', stats);
  const had = stats.gems.includes(id);
  const got = !had && f.cond(X) && awardStone(k);
  checkTitles();
  $('clear-title').textContent = 'EXTRA CLEAR';
  $('clear-modal-desc').textContent = `${moves}手でそろえました${undone ? `（UNDO ${undone}回を加えて ${moves + undone}手）` : ''}\n` +
    (got ? '◆ 幻の石を手に入れました' : had ? '◆ この石は、すでに手元にあります' : '幻の石の気配は、まだ消えていません…');
  const hasNext = k < MAX_STAGE && k + 1 < maxUnlockedStage;
  $('next-btn').textContent = hasNext ? 'NEXT EXTRA' : 'BACK TO MENU';
  bottles.forEach((_, i) => setTimeout(() => burst(i), i * 80));
  setTimeout(() => { if(stageCleared && screens.game.classList.contains('active')) $('clear-modal').classList.add('show'); }, 300);
}

/* ---------- 画面描画 ---------- */

// 図鑑の表示状態：ページ / 発見済みのみ表示 / 開いているジャンル(-1=一覧) / ポップアップの対象

// 図鑑を描く。ジャンル一覧（棚のカード）→ ジャンルを選ぶと5列のタイル表示。タイルを選ぶとポップアップで詳細。
function renderGems(){

    const grid = box.querySelector('.genre-grid');
    GENRES.forEach((g, gi) => {
      if(!g.ids.length || (g.hidden && !ficCount(stats))) return;   // 0件のジャンル、そして未発見の隠しジャンルは表示しない
      const f = g.ids.filter(i => have.has(i)).length, done = f === g.ids.length && f > 0;
      // 棚に並べる見本：ジャンル内から等間隔に最大5つ。未発見は薄く表示する
      const n = Math.min(5, g.ids.length);
      const shelf = Array.from({length:n}, (_, j) => g.ids[Math.floor(j * g.ids.length / n)]).map(id => gemIcon(id, false, have.has(id) ? '' : 'dim')).join('');
      const c = document.createElement('button');
      c.className = 'genre-card' + (done ? ' done' : '');
      c.innerHTML = `<div class="shelf">${shelf}</div><b>${g.name}${done ? ' ✓' : ''}</b><small>${g.desc}</small><div class="bar"><i style="width:${f / g.ids.length * 100}%"></i></div><div class="cnt"><span>${f} / ${g.ids.length}</span></div>`;
      c.addEventListener('click', () => { gemView = gi; gemPage = 0; renderGems(); });
      grid.appendChild(c);
    });
    return;
  }
  const g = GENRES[gemView], all = g.ids, f = all.filter(i => have.has(i)).length;
  gemList = gemFoundOnly ? all.filter(i => have.has(i)) : all;   // ポップアップの「前へ／次へ」もこの並び
  const pages = Math.max(1, Math.ceil(gemList.length / TILES));
  gemPage = Math.min(gemPage, pages - 1);
  h2.textContent = g.name;
  box.innerHTML = `<div style="margin:2px 2px 0"><div style="display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-sub);margin-bottom:6px"><span>${g.desc}</span><span>${f} / ${all.length}</span></div><div class="bar"><i style="width:${f / Math.max(1, all.length) * 100}%"></i></div></div><div class="tile-grid"></div>`;
  const grid = box.querySelector('.tile-grid');
  gemList.slice(gemPage * TILES, (gemPage + 1) * TILES).forEach(id => {
    const t = document.createElement('button'), got = have.has(id);
    t.className = 'tile' + (got ? ' found' : ''); t.dataset.id = id;
    t.setAttribute('aria-label', got ? GEM_LORE[id][0] : '未発見の宝石');
    t.innerHTML = gemIcon(id, !got) + `<span class="nm">${got ? gemEsc(GEM_LORE[id][0]) : '？？？'}</span>`;
    t.addEventListener('click', () => openGem(id, t));
    grid.appendChild(t);
  });
  if(!gemList.length) grid.outerHTML = '<p style="text-align:center;color:var(--text-sub);font-size:.85rem;margin-top:30px;line-height:2">まだ発見した宝石がありません。<br>ステージをクリアして、出会いを探しましょう。</p>';
  $('gem-page').textContent = `${gemPage + 1} / ${pages}`;
  $('gem-prev').disabled = gemPage <= 0; $('gem-next').disabled = gemPage >= pages - 1;
  $('gem-filter').textContent = gemFoundOnly ? 'すべて表示' : '発見済みのみ';
}
/* ---------- 宝石の詳細ポップアップ ---------- */
// ポップアップを開く。opener は閉じたときにフォーカスを戻すタイル。
function openGem(id, opener){
  gemCur = id; gemOpener = opener || null;
  renderGemModal();
  $('gem-modal').classList.add('show');
  $('gs-close').focus();
}
// ポップアップを閉じる。ほかの宝石へ移動していたら、その宝石があるページへ一覧を合わせる。
function closeGem(){
  if(!$('gem-modal').classList.contains('show')) return;
  $('gem-modal').classList.remove('show'); gemJustGot = false;
  if(gemView >= 0 && gemCur >= 0){
    const p = Math.floor(gemList.indexOf(gemCur) / TILES);
    if(p >= 0 && p !== gemPage){ gemPage = p; renderGems(); }
    const t = document.querySelector(`.tile[data-id="${gemCur}"]`);
    if(t) t.focus({preventScroll:false}); else if(gemOpener && gemOpener.isConnected) gemOpener.focus();
  }
}
// 前の／次の宝石へ（一覧の並び順）
function stepGem(d){
  const k = gemList.indexOf(gemCur) + d;
  if(k < 0 || k >= gemList.length) return;
  gemCur = gemList[k]; renderGemModal();
}
// 現在の宝石の内容をシートに描く。厳選80種は専門的な解説、鉱物は化学式から組み立てた解説。
function renderGemModal(){
  const id = gemCur, got = stats.gems.includes(id), l = GEM_LORE[id], e = gemEsc;
  const spec = rows => `<dl class="gs-spec">${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
  const sec = (title, paras) => `<section class="gs-sec"><h3>${title}</h3>${paras.map(p => `<p>${e(p)}</p>`).join('')}</section>`;
  let html;
  if(!got){
    const fic = id >= FIC_BASE, sub = fic ? 'フィクションストーン' : id < CURATED ? '厳選宝石' : GENRES[MINERALS[id - CURATED][3]].name;
    html = `<div class="gs-hero">${gemIcon(id, true)}<div id="gs-name" class="gs-name">？？？？？</div><div class="gs-sub">${sub}　／　未発見</div></div>
      <p class="gs-quote">${fic ? 'まだ眠っています。<br>エクストラのどこかで、出会えるかもしれません。' : 'まだ眠っています。<br>ステージをクリアすると、出会えるかもしれません。'}</p>`;
    if(fic) html += `<p class="gs-note">手がかり：${e(FIC[id - FIC_BASE].hint)}</p>`;
  } else if(id < CURATED){
    const d = GEM_DETAIL[l[0]], L = ['種・材質','化学組成','結晶系','硬度（モース）','比重','屈折率','主な産地'];
    html = `<div class="gs-hero">${gemIcon(id, false)}<div id="gs-name" class="gs-name">${e(l[0])}</div><div class="gs-sub">${e(l[1])}</div></div>
      <p class="gs-quote">${e(l[2])}</p>`;
    if(d){
      html += spec(L.map((k, i) => [k, i === 1 ? e(prettyFormula(d[i])) : e(d[i])])) + sec('特徴', [d[7]]) + sec('歴史と文化', [d[8]]) + sec('見分け方と扱い方', [d[9]]);
      html += '<p class="gs-note">物性の数値は代表的な値です。産地・処理・個体によって幅があります。</p>';
    }
  } else if(id >= FIC_BASE){
    const k = id - FIC_BASE + 1, f = FIC[k - 1];
    html = `${gemJustGot ? '<div class="gs-new">◆　幻の石を手に入れました　◆</div>' : ''}<div class="gs-hero">${gemIcon(id, false)}<div id="gs-name" class="gs-name">${e(f.name)}</div><div class="gs-sub">フィクションストーン　／　出典のジャンル：${e(f.src)}</div></div>
      <p class="gs-quote">${e(f.desc)}</p>`;
    html += spec([['分類', 'フィクションストーン'], ['出典', e(f.src)], ['実在', '実在しない石'], ['入手場所', `EXTRA ${k}（${XT_NAMES[k]}）`], ['入手のしかた', e(f.how)]]);
    html += sec('この石について', ['実在しない石です。元ネタを知っている人は、ニヤリとしてしまうかもしれません。']);
  } else {
    const m = mineralFacts(id), st = MINERALS[id - CURATED][2];
    html = `<div class="gs-hero">${gemIcon(id, false)}<div id="gs-name" class="gs-name">${e(l[0])}</div><div class="gs-sub">${m.genre}</div></div>`;
    html += spec([['化学式', m.formula ? e(prettyFormula(m.formula)) : '未掲載'], ['分類', m.genre], ['承認区分', st === 'G' ? '古くから知られる鉱物（グランドファーザー）' : st === 'Rd' ? '再定義された鉱物' : 'IMA公認鉱物'], ['構成元素', m.els.length ? m.els.map(x => `${x}（${ELEM_NAME[x]}）`).join('、') : '—']]);
    html += sec('この鉱物について', m.paras) + (m.status ? sec('名前と区分', [m.status]) : '');
    m.notes.forEach(n => html += `<p class="gs-warn">⚠ ${e(n)}</p>`);
    html += '<p class="gs-note">この解説は、化学式と分類から組み立てた一般的な内容です。結晶系・硬度・産地など、この鉱物に固有の性質は、ここには記載していません。</p>';
  }
  const body = $('gs-body'); body.innerHTML = html; body.scrollTop = 0;
  const k = gemList.indexOf(id);
  $('gs-pos').textContent = k >= 0 ? `${k + 1} / ${gemList.length}` : '';
  $('gs-prev').disabled = k <= 0; $('gs-next').disabled = k < 0 || k >= gemList.length - 1;
}
/* ---------- アカウント画面 ---------- */
// 再読み込みの直後に出すメッセージを予約する（切替・リセットのあと用）
function flashAfterReload(msg){ try{ sessionStorage.setItem('lumina_flash', msg || ''); }catch(e){} }
// 確認ダイアログを出す。「はい」で true、「キャンセル」で false になる Promise を返す。
function askConfirm(title, msg, yesLabel){
  return new Promise(res => {
    const m = $('confirm-modal'), yes = $('confirm-yes'), no = $('confirm-no');
    $('confirm-title').textContent = title; $('confirm-msg').textContent = msg; yes.textContent = yesLabel || 'OK';
    m.classList.add('show');
    const done = v => { m.classList.remove('show'); yes.onclick = no.onclick = null; res(v); };
    yes.onclick = () => done(true); no.onclick = () => done(false);
  });
}
// アカウント名を整える：制御文字と < > を除き、12文字までにする（空なら fallback）
function cleanName(v, fallback){ return String(v || '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 12) || fallback; }
// アカウント一覧に表示する要約（到達ステージ・発見した宝石の数）
function accSummary(id){
  const st = Math.min(MAX_STAGE, parseInt(rawGet(acKey(id, 'max_stage')), 10) || 1);
  let g = 0; try{ const o = JSON.parse(rawGet(acKey(id, 'stats'))); g = Array.isArray(o && o.gems) ? o.gems.filter(i => i < NORMAL_COUNT).length : 0; }catch(e){}
  return {stage: st, gems: g};
}
// UTF-8 の文字列 ⇔ Base64。セーブコードで日本語名も扱えるようにする。
const b64enc = str => { let bin = ''; new TextEncoder().encode(str).forEach(c => { bin += String.fromCharCode(c); }); return btoa(bin); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
// セーブコードを作る："LJ1." + Base64(JSON)。別の端末やブラウザへデータを移すために使う。
function exportCode(id){
  const data = {}; DATA_KEYS.forEach(k => { const v = rawGet(acKey(id, k)); if(v !== null) data[k] = v; });
  const a = accounts.list.find(x => x.id === id);
  return 'LJ1.' + b64enc(JSON.stringify({v:1, name:a ? a.name : 'PLAYER', data}));
}
// セーブコードを読み込む。形式を確認し、数値や配列を検証して安全な形に直してから返す（不正なら例外）。
function importCode(code){
  code = String(code || '').trim();
  if(code.slice(0, 4) !== 'LJ1.') throw new Error('format');
  const obj = JSON.parse(b64dec(code.slice(4)));
  if(!obj || obj.v !== 1 || !obj.data || typeof obj.data !== 'object') throw new Error('format');
  const p = k => { try{ return JSON.parse(obj.data[k]); }catch(e){ return null; } };
  const out = {}, ms = parseInt(obj.data.max_stage, 10);
  out.max_stage = String(ms >= 1 ? Math.min(ms, MAX_STAGE + 1) : 1);
  const st = p('stats') || {}, s2 = {gems: [...new Set((Array.isArray(st.gems) ? st.gems : []).filter(i => Number.isInteger(i) && i >= 0 && i < GEM_LORE.length))]};
  STAT_KEYS.forEach(k => { s2[k] = Number.isFinite(st[k]) && st[k] >= 0 ? Math.floor(st[k]) : 0; });
  out.stats = JSON.stringify(s2);
  const t = p('titles'); out.titles = JSON.stringify((Array.isArray(t) ? t : []).filter(x => typeof x === 'string' && x.length < 40));
  const sr = p('stars') || {}, sr2 = {}; for(let i = 1; i <= MAX_STAGE; i++) if([1,2,3].includes(sr[i])) sr2[i] = sr[i];
  out.stars = JSON.stringify(sr2); out.batch = JSON.stringify(p('batch') === true);
  const xr = p('xt') || {}, x2 = {clr:{}, att:{}};
  ['clr', 'att'].forEach(k => { const s = xr[k] || {}; for(let i = 1; i <= MAX_STAGE; i++) if(Number.isInteger(s[i]) && s[i] > 0) x2[k][i] = Math.min(s[i], 9999); });
  out.xt = JSON.stringify(x2);
  out.quiz = JSON.stringify(cleanQuiz(p('quiz')));
  out.rec = JSON.stringify(cleanRec(p('rec')));
  return {name: cleanName(obj.name, 'PLAYER'), data: out};
}
// アカウントを追加する（data があればその内容で作る）。上限に達していたら null。
function createAccount(name, data){
  if(accounts.list.length >= MAX_ACCOUNTS) return null;
  const id = 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  accounts.list.push({id, name});
  if(data) DATA_KEYS.forEach(k => { if(data[k] != null) rawSet(acKey(id, k), data[k]); });
  saveAccounts(); return id;
}
// アカウントを切り替える。保存先が変わるため、ページを再読み込みして反映する。
function switchAccount(id, msg){ accounts.current = id; saveAccounts(); flashAfterReload(msg); location.reload(); }
// アカウント画面を組み立てる：一覧（切替・削除）/ 新規作成 / 名前変更 / セーブコード / リセット。
function renderAccount(){
  const box = $('account-container'); box.innerHTML = '';
  const total = NORMAL_COUNT;
  const head = t => { const h = document.createElement('div'); h.className = 'acct-h'; h.textContent = t; box.appendChild(h); };
  const note = t => { const n = document.createElement('p'); n.className = 'acct-note'; n.textContent = t; box.appendChild(n); return n; };
  const btn = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn-action ' + cls; b.textContent = label; b.addEventListener('click', fn); return b; };
  const field = (ph, val) => { const i = document.createElement('input'); i.className = 'acct-in'; i.type = 'text'; i.maxLength = 12; i.placeholder = ph; i.value = val || ''; return i; };

  head('ACCOUNTS');
  accounts.list.forEach(a => {
    const sm = accSummary(a.id), cur = a.id === ACC.id, row = document.createElement('div');
    row.className = 'acct-row' + (cur ? ' current' : '');
    const info = document.createElement('div'); info.className = 'acct-info';
    const nm = document.createElement('div'); nm.className = 'acct-name'; nm.textContent = (cur ? '👤 ' : '') + a.name;
    const sub = document.createElement('div'); sub.className = 'acct-sub'; sub.textContent = `STAGE ${sm.stage}　宝石 ${sm.gems} / ${total}`;
    info.append(nm, sub); row.appendChild(info);
    if(cur){ const tag = document.createElement('span'); tag.className = 'acct-sub'; tag.textContent = '使用中'; row.appendChild(tag); }
    else{
      row.appendChild(btn('切替', 'mini', () => switchAccount(a.id, `「${a.name}」に切り替えました`)));
      row.appendChild(btn('削除', 'mini danger', async () => {
        if(!await askConfirm('DELETE', `「${a.name}」を削除します。\nこのアカウントのデータは元に戻せません。`, '削除する')) return;
        DATA_KEYS.forEach(k => rawDel(acKey(a.id, k)));
        accounts.list = accounts.list.filter(x => x.id !== a.id); saveAccounts();
        showToast(`「${a.name}」を削除しました`); renderAccount();
      }));
    }
    box.appendChild(row);
  });

  head('NEW ACCOUNT');
  note(`最大${MAX_ACCOUNTS}つまで作れます。新しいアカウントは、ステージ1・図鑑が空の状態から始まります。`);
  const nf = document.createElement('div'); nf.className = 'acct-field';

  }));
  box.appendChild(nf);

  head('RENAME');
  const rf = document.createElement('div'); rf.className = 'acct-field';
  const rin = field('名前', ACC.name);
  rf.append(rin, btn('名前を変更', '', () => {
    ACC.name = cleanName(rin.value, ACC.name); saveAccounts();
    $('home-account').textContent = '👤 ' + ACC.name; showToast('名前を変更しました'); renderAccount();
  }));
  box.appendChild(rf);

  head('SAVE CODE');
  note('現在のアカウントのデータを文字列にして、別の端末やブラウザへ移せます。読み込むと、新しいアカウントとして追加されます（今のデータは上書きされません）。');
  const ta = document.createElement('textarea'); ta.className = 'acct-in'; ta.placeholder = 'ここにセーブコードが表示されます。読み込むときは、ここに貼り付けてください。'; ta.spellcheck = false;
  box.appendChild(ta);
  const cf = document.createElement('div'); cf.className = 'acct-field';
  cf.append(
    btn('コードを作成', '', async () => {
      ta.value = exportCode(ACC.id); ta.focus(); ta.select();
      let copied = false; try{ await navigator.clipboard.writeText(ta.value); copied = true; }catch(e){}
      showToast(copied ? 'セーブコードをコピーしました' : 'セーブコードを作成しました。コピーして保管してください');
    }),
    btn('コードから読み込む', '', () => {
      let r; try{ r = importCode(ta.value); }catch(e){ showToast('セーブコードを読み込めませんでした。コードが正しいか確認してください'); return; }
      const id = createAccount(r.name, r.data);
      if(!id){ showToast(`アカウントは${MAX_ACCOUNTS}つまでです。不要なアカウントを削除してください`); return; }
      switchAccount(id, `「${r.name}」を読み込みました`);
    })
  );
  box.appendChild(cf);

  head('RESET');
  note('データはこの端末のブラウザ内に保存されています。ブラウザのデータを消去すると失われるため、大切な記録はセーブコードで控えておくと安心です。');
  const df = document.createElement('div'); df.className = 'acct-field';
  df.append(
    btn('このアカウントをリセット', 'danger', async () => {
      if(!await askConfirm('RESET', `「${ACC.name}」の進行状況、図鑑、称号、星の記録をすべて消去し、ステージ1からやり直します。\nこの操作は元に戻せません。`, 'リセットする')) return;
      DATA_KEYS.forEach(k => rawDel(acKey(ACC.id, k)));
      flashAfterReload('データをリセットしました'); location.reload();
    }),
    btn('すべてのデータを消去', 'danger', async () => {
      if(!await askConfirm('ERASE ALL', `すべてのアカウントとデータを消去します（${accounts.list.length}件）。\nこの操作は元に戻せません。`, 'すべて消去する')) return;
      accounts.list.forEach(a => DATA_KEYS.forEach(k => rawDel(acKey(a.id, k))));
      rawDel(ACC_KEY); flashAfterReload('すべてのデータを消去しました'); location.reload();
    })
  );
  box.appendChild(df);
}
// 称号一覧を描く。上に全体の進捗率、カテゴリごとに見出し（獲得数つき）を出す。

      box.appendChild(card);
    });
  });
}

/* ---------- クイズ ----------
   厳選宝石80種（日本語名の宝石）をすべて発見すると、ホームに QUIZ が現れる。出題は厳選宝石だけ。
   1回10問の四択。出題も選択肢も、そのジャンルで発見済みの石だけから作る。ごほうびは称号。
   厳選宝石 … 説明→名前 / 名前→分類 / 色→名前   その他の鉱物 … 名前→化学式 / 化学式→名前 / 古くから知られる鉱物はどれ */
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// pool から、条件 ok を満たすものを重複なく n 個選ぶ
function pickN(pool, n, ok){
  const out = [];
  for(const i of shuffle(pool.map((_, k) => k))){ if(out.length >= n) break; if(ok(pool[i], out)) out.push(pool[i]); }
  return out;
}
// 厳選宝石の色（パレットの最初の16進色）。色当てで、似た色が選択肢に並ばないようにする
const qzRgb = id => { const m = id < CURATED && /#([0-9a-f]{6})/i.exec(GEM_PALETTE[id].bg); return m ? [0, 2, 4].map(k => parseInt(m[1].slice(k, k + 2), 16)) : null; };
const rgbDist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
// 1問を作る。作れなければ null。ids = そのジャンルの発見済みの石
function quizMake(type, id, ids){
  const L = GEM_LORE[id], name = L[0];
  const mk = (prompt, correct, wrongs, explain, vis) => {
    if(wrongs.length < 3 || new Set([correct, ...wrongs]).size !== 4) return null;
    const o = shuffle([correct, ...wrongs].map((t, i) => ({t, ok:i === 0})));
    return {prompt, vis, options:o.map(x => x.t), ans:o.findIndex(x => x.ok), explain};
  };
  const others = f => pickN(ids, 3, (x, out) => x !== id && f(x) && !out.some(y => f.key && f.key(x) === f.key(y)));
  if(type === 'desc'){
    const prompt = L[1] + '\n' + L[2]; if(prompt.includes(name)) return null;
    const w = pickN(ids, 3, x => x !== id && GEM_LORE[x][1] !== L[1]).map(x => GEM_LORE[x][0]);
    return mk('この説明にあてはまる宝石は？\n\n' + prompt, name, w, `${name}：${L[1]}。${L[2]}`);
  }
  if(type === 'kind'){
    const w = [], seen = new Set([L[1]]);
    for(const x of shuffle(ids.slice())){ if(w.length >= 3) break; const t = GEM_LORE[x][1]; if(!seen.has(t)){ seen.add(t); w.push(t); } }
    return mk(`「${name}」について、あてはまる説明は？`, L[1], w, `${name}：${L[1]}。${L[2]}`);
  }
  // 説明文は「石言葉」「石言葉」。説明の文。の形。石言葉と文に分ける
  const parts = id => { const m = /^((?:「[^」]+」)+)。(.+)$/.exec(GEM_LORE[id][2]); return m ? {kw:m[1], keys:m[1].match(/「[^」]+」/g), sent:m[2]} : null; };
  const P0 = parts(id); if(!P0) return null;
  const far = x => { const c = qzRgb(x), c0 = qzRgb(id); return !c || !c0 || rgbDist(c, c0) >= 110; };   // 色が近い石は、紛らわしいので選択肢に混ぜない
  const disjoint = x => { const q = parts(x); return q && !q.keys.some(k => P0.keys.includes(k)); };
  if(type === 'word'){
    const w = [], seen = new Set([P0.kw]);
    for(const x of shuffle(ids.slice())){ if(w.length >= 3) break; const q = parts(x); if(x !== id && q && disjoint(x) && !seen.has(q.kw)){ seen.add(q.kw); w.push(q.kw); } }
    return mk(`「${name}」の石言葉は？`, P0.kw, w, `${name}：${P0.kw}。${P0.sent}`);
  }
  if(type === 'kw2n'){
    const w = pickN(ids, 3, x => x !== id && disjoint(x)).map(x => GEM_LORE[x][0]);
    return mk(`石言葉が ${P0.kw} の宝石は？`, name, w, `${name}：${P0.kw}。${P0.sent}`);
  }
  if(type === 'sent'){
    const w = [], seen = new Set([P0.sent]);
    for(const x of shuffle(ids.slice())){ if(w.length >= 3) break; const q = parts(x); if(x !== id && q && far(x) && !seen.has(q.sent)){ seen.add(q.sent); w.push(q.sent); } }
    return mk(`「${name}」の説明として、あてはまるのは？`, P0.sent, w, `${name}：${P0.kw}。${P0.sent}`);
  }
  return null;
}
// 1ラウンド（10問）を作る。発見済みの石だけを使う
function quizBuild(gi, mode){
  const have = new Set(stats.gems), ids = GENRES[gi].ids.filter(i => have.has(i)), qs = [];
  const types = ['desc', 'kind', 'word', 'kw2n', 'sent'], want = mode === 'survive' ? ids.length : Math.min(QUIZ_LEN, ids.length);
  for(const id of shuffle(ids.slice())){   // 石を1つずつ、作れる問題の種類を探す（同じ石は1回だけ）
    if(qs.length >= want) break;
    for(const t of shuffle(types.slice())){ const q = quizMake(t, id, ids); if(q){ qs.push(q); break; } }
  }
  return qs;
}
// 図鑑が埋まったジャンルを調べて、クイズを出現させる。only を渡すとそのジャンルだけ調べる
function quizSync(announce, only){
  const have = new Set(stats.gems), added = [];
  (only !== undefined ? [only] : [QUIZ_GENRE]).forEach(gi => {
    if(gi !== QUIZ_GENRE) return;
    const g = GENRES[gi]; if(!g || quiz.open.includes(gi)) return;
    if(g.ids.every(i => have.has(i))){ quiz.open.push(gi); added.push(g.name); }
  });
  if(added.length){
    const first = quiz.open.length === added.length;
    saveJSON('lumina_quiz', quiz);
    if(announce) setTimeout(() => showToast('QUIZ が開きました：厳選宝石'), 1500);
  }
  $('btn-quiz').hidden = !quiz.open.length;
}
const QZ_MODES = {
  normal:{name:'ふつう', desc:'10問を、ゆっくり考えながら。'},
  hard:{name:'むずかしい', desc:'10問。1問ごとに制限時間は12秒です。'},
  survive:{name:'サバイバル', desc:'まちがえるまで、発見した石を出題し続けます。'}
};
const QZ_LIMIT = 12000;
let qz = {view:'menu', gi:-1, mode:'normal', qs:[], n:0, score:0, locked:true, t0:0, tm:null, lastOk:true};
function renderQuiz(){
  clearTimeout(qz.tm);
  const box = $('quiz-container'); box.innerHTML = ''; box.scrollTop = 0;
  const mkEl = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };
  if(qz.view === 'menu'){
    const pct = quiz.total ? Math.round(quiz.right / quiz.total * 100) : 0;
    const sum = mkEl('div', 'quiz-sum'); sum.innerHTML = `<span>正解　<b>${quiz.right}</b> / ${quiz.total}（${pct}%）</span><span>最長の連続正解　<b>${quiz.bestStreak}</b></span><span>遊んだ回数　<b>${quiz.rounds}</b></span>`;
    box.append(sum, mkEl('p', 'quiz-note', '発見した厳選宝石（日本語名の80種）から出題されます。'));
    const grid = mkEl('div', 'genre-grid'), have = new Set(stats.gems), gi = QUIZ_GENRE, g = GENRES[gi];
    const n = Math.min(5, g.ids.length), shelf = Array.from({length:n}, (_, j) => g.ids[Math.floor(j * g.ids.length / n)]).map(id => gemIcon(id, false, have.has(id) ? '' : 'dim')).join('');
    Object.keys(QZ_MODES).forEach(mode => {
      const m = QZ_MODES[mode], c = mkEl('button', 'genre-card done');
      const rec2 = mode === 'normal' ? `最高 ${quiz.best[gi] || 0} / ${QUIZ_LEN}` : mode === 'hard' ? `最高 ${quiz.hardBest} / ${QUIZ_LEN}` : `最長 ${quiz.survBest} 問`;
      c.innerHTML = `<div class="shelf">${shelf}</div><b>${gemEsc(m.name)}</b><small>${gemEsc(m.desc)}</small><div class="qbest"><span>${rec2}</span>${mode === 'normal' ? `<span>${quiz.plays[gi] || 0}回</span>` : ''}</div><div class="cnt"><span>タップで挑戦</span></div>`;
      c.addEventListener('click', () => quizStart(mode));
      grid.appendChild(c);
    });
    box.appendChild(grid); return;
  }
  const g = GENRES[qz.gi], len = qz.qs.length, sv = qz.mode === 'survive';
  if(qz.view === 'result'){
    const sc = qz.score;
    const msg = sv ? (sc >= len ? 'すべての石を、言い当てました。\n図鑑の主と呼ぶほかありません。' : sc >= 30 ? 'お見事です。\n驚くほどの記憶力です。' : sc >= 10 ? 'よく続きました。\nまだ伸びしろがあります。' : '惜しいところでした。\n図鑑を見返して、また挑みましょう。')
      : sc === len ? '満点です。\nすべての石を見分けました。' : sc >= len * .8 ? 'お見事です。\nかなりの目利きです。' : sc >= len * .5 ? '半分以上、正解しました。\n図鑑を見返すと、もっと自信がつきます。' : '惜しいところでした。\n図鑑を見返して、また挑みましょう。';
    const r = mkEl('div', 'qz-res'); r.innerHTML = `<div style="font-size:.85rem;color:var(--text-sub);letter-spacing:.15em">${gemEsc(g.name)}　${gemEsc(QZ_MODES[qz.mode].name)}</div><div class="big">${sc}<small>${sv ? ' 問連続' : ' / ' + len}</small></div>`;
    r.appendChild(mkEl('p', '', msg + (sc > (qz.prevBest || 0) ? '\n◆ 自己ベストを更新しました' : '')));
    const foot = mkEl('div', 'qz-foot'), again = mkEl('button', 'btn-action', 'もう一度'), back = mkEl('button', 'btn-action', 'メニュー');
    again.addEventListener('click', () => quizStart(qz.mode)); back.addEventListener('click', () => { qz.view = 'menu'; renderQuiz(); });
    foot.append(again, back); box.append(r, foot); return;
  }
  // 出題中
  const q = qz.qs[qz.n];
  const top = mkEl('div', 'qz-top'); top.innerHTML = `<span>${gemEsc(g.name)}　${gemEsc(QZ_MODES[qz.mode].name)}</span><span>${sv ? `${qz.n + 1} 問目` : `${qz.n + 1} / ${len}`}　正解 ${qz.score}</span>`;
  const bar = mkEl('div', 'bar'); bar.innerHTML = `<i style="width:${qz.n / len * 100}%"></i>`;
  const qb = mkEl('div', 'qz-q'); if(q.vis != null){ const v = mkEl('div', 'qz-vis'); v.innerHTML = gemIcon(q.vis, false); qb.appendChild(v); }
  qb.appendChild(document.createTextNode(q.prompt));
  const opts = mkEl('div', 'qz-opts');
  q.options.forEach((t, i) => {
    const b = mkEl('button', 'qz-opt'); b.append(mkEl('i', '', 'ABCD'[i]), mkEl('span', '', t));
    b.addEventListener('click', () => quizAnswer(i)); opts.appendChild(b);
  });
  const fb = mkEl('div', 'qz-fb'); fb.id = 'qz-fb';
  const foot = mkEl('div', 'qz-foot'), next = mkEl('button', 'btn-action', !sv && qz.n + 1 >= len ? 'RESULT' : 'NEXT'); next.id = 'qz-next'; next.hidden = true;
  next.addEventListener('click', quizNext); foot.appendChild(next);
  box.append(top, bar);
  if(qz.mode === 'hard'){   // 制限時間のバー
    const tb = mkEl('div', 'qz-timebar'), fill = document.createElement('i'); tb.appendChild(fill); box.appendChild(tb);
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.transition = `width ${QZ_LIMIT}ms linear`; fill.style.width = '0%'; }));
    qz.tm = setTimeout(() => quizAnswer(-1), QZ_LIMIT);
  }
  box.append(qb, opts, fb, foot);
  qz.locked = false; qz.t0 = performance.now();
}
function quizStart(mode){
  mode = QZ_MODES[mode] ? mode : 'normal';
  const qs = quizBuild(QUIZ_GENRE, mode);
  if(qs.length < 4){ showToast('出題できる石が足りません'); return; }
  const prevBest = mode === 'normal' ? (quiz.best[QUIZ_GENRE] || 0) : mode === 'hard' ? quiz.hardBest : quiz.survBest;
  qz = {view:'play', gi:QUIZ_GENRE, mode, qs, n:0, score:0, locked:false, t0:0, tm:null, lastOk:true, prevBest};
  audio.init(); audio.playGemTouch(); renderQuiz();
}
function quizAnswer(i){
  if(qz.locked || qz.view !== 'play') return; qz.locked = true; clearTimeout(qz.tm);
  const q = qz.qs[qz.n], ok = i === q.ans, sec = (performance.now() - qz.t0) / 1000;
  quiz.total++; qz.lastOk = ok;
  if(ok){ quiz.right++; qz.score++; quiz.streak++; quiz.bestStreak = Math.max(quiz.bestStreak, quiz.streak); if(sec <= 3) quiz.fast++; audio.playCompleteHarp(); }
  else{ quiz.streak = 0; audio.playLiquidPour(); }
  saveJSON('lumina_quiz', quiz);
  const bs = [...document.querySelectorAll('.qz-opt')];
  bs.forEach((b, k) => { b.disabled = true; if(k === q.ans) b.classList.add('ok'); else if(k === i) b.classList.add('ng'); else b.classList.add('dim'); });
  const tf = document.querySelector('.qz-timebar i'); if(tf){ tf.style.transition = 'none'; tf.style.width = (Math.max(0, 1 - sec * 1000 / QZ_LIMIT) * 100) + '%'; }
  const fb = $('qz-fb'); fb.innerHTML = ''; const h = document.createElement('b'); h.className = ok ? 'ok' : 'ng'; h.textContent = ok ? '◯ 正解' : i < 0 ? '✕ 時間切れ' : '✕ ざんねん';
  fb.append(h, document.createElement('br'), document.createTextNode(q.explain));
  $('qz-next').hidden = false; if(qz.mode === 'survive' && !ok) $('qz-next').textContent = 'RESULT'; $('qz-next').focus();
  checkTitles();
}
function quizNext(){
  if(!qz.locked || qz.view !== 'play') return;
  const over = qz.mode === 'survive' && !qz.lastOk;
  qz.n++;
  if(over || qz.n >= qz.qs.length){   // ラウンド終了
    const gi = qz.gi, len = qz.qs.length;
    quiz.rounds++;
    if(qz.mode === 'survive') quiz.survBest = Math.max(quiz.survBest, qz.score);
    else{
      if(qz.mode === 'normal'){ quiz.plays[gi] = (quiz.plays[gi] || 0) + 1; quiz.best[gi] = Math.max(quiz.best[gi] || 0, qz.score); }
      else quiz.hardBest = Math.max(quiz.hardBest, qz.score);
      if(qz.score === len && len >= QUIZ_LEN){ quiz.perfect++; if(!quiz.perfectG.includes(gi)) quiz.perfectG.push(gi); }
    }
    saveJSON('lumina_quiz', quiz); qz.view = 'result'; checkTitles();
  }
  renderQuiz();
}
async function quizBack(){
  if(qz.view === 'play'){
    clearTimeout(qz.tm);   // 確認ダイアログを開いている間は、制限時間を止める
    if(!await askConfirm('QUIZ', 'クイズを中断してメニューに戻ります。\nこのラウンドの結果は記録されません（答えた問題の正解数は残ります）。', '中断する')){
      if(qz.view === 'play' && !qz.locked && qz.mode === 'hard') renderQuiz();   // 続ける場合は、同じ問題を最初から（時間は新しく）
      return;
    }
    qz.view = 'menu'; renderQuiz(); return;
  }
  if(qz.view === 'result'){ qz.view = 'menu'; renderQuiz(); return; }
  showScreen('home');
}
// キーボード：1〜4で選ぶ / Enterで次へ
addEventListener('keydown', e => {
  if(!screens.quiz.classList.contains('active') || qz.view !== 'play' || $('confirm-modal').classList.contains('show')) return;
  if(/^[1-4]$/.test(e.key) && !qz.locked) quizAnswer(+e.key - 1);
  else if(e.key === 'Enter' && qz.locked && !$('qz-next').hidden){ e.preventDefault(); quizNext(); }
});
quizSync(false);   // 起動時：すでに埋まっているジャンルがあれば、クイズを出現させる

/* 記録を保存できない環境（プライベートモード等）では、先にお知らせする */
try{ localStorage.setItem('lumina_probe', '1'); localStorage.removeItem('lumina_probe'); }
catch(e){ setTimeout(() => showToast('この環境では記録を保存できません。ブラウザを閉じると進行状況は失われます。'), 600); }
checkTitles(true);
$('home-account').textContent = '👤 ' + ACC.name;
try{ const f = sessionStorage.getItem('lumina_flash'); if(f){ sessionStorage.removeItem('lumina_flash'); showToast(f); } }catch(e){}

// ---------- RECORDS（記録の画面） ----------
function renderRecords(){
  const box = $('records-container'); box.innerHTML = '';
  const fmt = sec => { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? `${h}時間${m}分` : `${m}分`; };
  let sum = 0, full = 0, bests = 0; for(let i = 1; i <= MAX_STAGE; i++){ const v = bestStars[i] || 0; sum += v; if(v === 3) full++; if(rec.best[i]) bests++; }
  const quizPct = quiz.total ? Math.round(quiz.right / quiz.total * 100) : 0;
  const groups = [
    ['プレイ', [['ゲームを開いていた時間', fmt(rec.sec)], ['ステージのクリア回数', stats.clears + ' 回'], ['注いだ回数の合計', stats.moves + ' 手'], ['完成させた色の合計', stats.tubes + ' 色']]],
    ['腕前', [['★の累計', `${sum} / ${MAX_STAGE * 3}`], ['★3のステージ', `${full} / ${MAX_STAGE}`], ['自己ベストのあるステージ', `${bests} / ${MAX_STAGE}`], ['自己ベストの更新', rec.bestUp + ' 回'], ['★3の連続（現在）', stats.run3 + ' ステージ']]],
    ['収集', [['宝石・鉱物', `${nGems(stats)} / ${NORMAL_COUNT}`], ['称号', `${unlockedTitles.size} / ${TITLES_DATA.length}`]]]
  ];
  if(ficCount(stats) > 0) groups[2][1].splice(2, 0, ['幻の石', `${ficCount(stats)} / ${FIC.length}`]);
  if(quiz.open.length) groups.push(['クイズ', [['正解率', `${quiz.right} / ${quiz.total}（${quizPct}%）`], ['最長の連続正解', quiz.bestStreak + ' 問'], ['ふつうの最高', `${quiz.best[QUIZ_GENRE] || 0} / ${QUIZ_LEN}`], ['むずかしいの最高', `${quiz.hardBest} / ${QUIZ_LEN}`], ['サバイバルの最長', quiz.survBest + ' 問'], ['満点の回数', quiz.perfect + ' 回']]]);
  groups.forEach(([h, rows]) => {
    const t = document.createElement('div'); t.className = 'rec-h'; t.textContent = h; box.appendChild(t);
    rows.forEach(([k, v]) => { const r = document.createElement('div'); r.className = 'rec-row'; const a = document.createElement('span'); a.textContent = k; const b = document.createElement('b'); b.textContent = v; r.append(a, b); box.appendChild(r); });
  });
}

// 起動時の既定：BGM・効果音・色の記号をオン。ブラウザの制限で、BGMは最初のタップ（またはキー操作）で鳴り始める。
audio.bgmEnabled = true; document.body.classList.add('symbols');
[['home-bgm-toggle', true], ['game-bgm-toggle', true], ['home-sfx-toggle', true], ['symbol-toggle', true], ['game-symbol-toggle', true]].forEach(([id, on]) => setToggle($(id), on));
['pointerdown', 'keydown'].forEach(t => addEventListener(t, function f(){
  removeEventListener('pointerdown', f, true); removeEventListener('keydown', f, true);
  if(audio.bgmEnabled && !audio.bgm && audio.init()) audio.startBGM();
}, true));
// 起動時：到達しているREALMの色・音階を反映する
applyRealmTheme(getRealm(Math.min(maxUnlockedStage, MAX_STAGE)));
</script>
