<!DOCTYPE html>
<!--
  Lumina Jewels: Healing Color Sort（宝石の色そろえパズル）
  --------------------------------------------------------------
  HTML・CSS・JavaScriptを1ファイルにまとめた、ブラウザだけで動くパズルゲームです。
  ・遊び方   : 瓶をタップして宝石を選び、別の瓶をタップして移す。どの瓶にも（空きがあれば）移せる。
               4個ずつ同じ色にそろえるとステージクリア。全100ステージ、10面ごとに世界観（REALM）が変わる。
  ・★評価    : ステージごとにソルバーが「ほぼ最短の手数」を求め、それとの差で★1〜3を決める。
               HINT または +BOTTLE を使うと、そのステージは必ず★1になる。
  ・エクストラ: 基本ステージを30クリアするまでは存在ごと隠れていて、その後、基本ステージをクリアすると、同じ番号のエクストラ（色数2倍・専用の演出とBGM）が開く。
               各エクストラでは、ある条件を満たすと「フィクションストーン」（実在しない幻の石）が1つ手に入る（全100個）。
  ・癒し     : クリアの余韻（光・花火・昇る音）。
  ・やり込み : 自己ベスト手数と★3の未達表示、RECORDS（記録）、クイズのむずかしい／サバイバル、称号の追加。
  ・クイズ   : 図鑑の「厳選宝石」80種をすべて発見すると「QUIZ」が現れる。四択10問。発見済みの厳選宝石（日本語名の80種）だけが出題され、ごほうびは称号。
  ・保存     : 進行状況・図鑑・称号・クイズの記録は、この端末のブラウザ（localStorage）にアカウントごとに保存される。
  ・構成     : <style> = 見た目 / <body> = 画面の骨組み / <script> = データ → 保存 → 音 → 演出 → ゲーム本体 → 画面描画 → イベント
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina Jewels: Healing Color Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== デザイントークン（色・ガラス質感）とベース =====
   REALMごとに --bg-gradient-* と --theme-accent を JS(applyRealmTheme)が書き換える。 */
:root{--bg-gradient-inner:#0d1224;--bg-gradient-outer:#030408;--gold-light:#fef08a;--theme-accent:#d4af37;--glass-bg:rgba(14,18,32,.65);--glass-border:rgba(212,175,55,.25);--text-main:#f1f5f9;--text-sub:#94a3b8}
/* 全要素の共通設定：テキスト選択とダブルタップ拡大を抑止 */
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0;touch-action:manipulation}
/* 背景：中心が明るい放射グラデーション */
body{background:radial-gradient(circle at 50% 30%,var(--bg-gradient-inner) 0%,var(--bg-gradient-outer) 100%);color:var(--text-main);font-family:'Montserrat',sans-serif;min-height:100vh;min-height:100dvh;overflow:hidden;position:relative}
/* 粒子キャンバスと光の輪。操作の邪魔にならないよう pointer-events:none */
#fx-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.halo{position:absolute;top:50%;left:50%;width:500px;height:500px;margin:-250px 0 0 -250px;border-radius:50%;background:radial-gradient(circle,var(--theme-accent) 0%,transparent 70%);opacity:.15;pointer-events:none;z-index:0}
/* 画面切替：全画面を重ねておき、.active の画面だけ表示する */
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 15px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s,transform .6s,visibility .6s;transform:scale(.98)}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1)}
/* ステージ間のローディング（ヒーリングコラム） */
#loading-screen{position:fixed;inset:0;background:rgba(4,6,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .8s}
#loading-screen.show{opacity:1;pointer-events:auto}
.loader{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:25px}
.loader-gem{width:45px;height:45px;background:radial-gradient(circle at 35% 35%,var(--gold-light),var(--theme-accent));clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);animation:gemPulse 2.5s infinite ease-in-out}
.loader-ring{position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-top-color:var(--theme-accent);border-radius:50%;animation:spin 3s linear infinite}
@keyframes gemPulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:4px;color:var(--gold-light);margin-bottom:20px;opacity:.8}
.column-box{max-width:480px;width:100%;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;padding:20px 24px;text-align:center}
.column-label{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:3px;color:var(--theme-accent);margin-bottom:8px}
.column-title{font-size:.95rem;font-weight:500;margin-bottom:8px}
.column-text{font-size:.8rem;color:var(--text-sub);font-weight:300}
/* 見出し・共通ボタン・アイコンボタン */
h1,h2{font-family:'Cinzel',serif;letter-spacing:5px;background:linear-gradient(135deg,#fff 0%,var(--gold-light) 50%,var(--theme-accent) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.btn-action{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--gold-light);padding:12px 28px;font-size:.9rem;letter-spacing:2px;border-radius:30px;cursor:pointer;transition:all .3s;font-family:'Cinzel',serif;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;backdrop-filter:blur(12px)}
.btn-action:hover:not(:disabled){background:var(--theme-accent);color:#000;border-color:var(--gold-light)}
.btn-action:disabled{opacity:.35;cursor:not-allowed}
.btn-action:focus-visible,.icon-btn:focus-visible,.bottle:focus-visible,.stage-card:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
.icon-btn{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--theme-accent);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem}
.icon-btn:hover,.icon-btn.active{background:rgba(212,175,55,.2);box-shadow:0 0 12px rgba(212,175,55,.4)}
.breath-guide{font-size:.75rem;letter-spacing:2px;color:var(--theme-accent);font-family:'Cinzel',serif;text-align:center;height:18px}
.realm-tag{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:3px;color:var(--theme-accent);margin-top:4px}
/* ホーム画面 */
#home-screen{justify-content:center;gap:35px;text-align:center}
#home-screen h1{font-size:2.6rem;margin-bottom:8px}
.home-sub{color:var(--text-sub);letter-spacing:3px;font-size:.85rem}
.home-menu{display:flex;flex-direction:column;gap:16px;width:260px}
/* ステージ選択・称号・図鑑・アカウントに共通のヘッダーとリスト */
.stage-header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:800px;margin-bottom:15px}
.stage-grid{flex:1;width:100%;max-width:800px;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px;overflow-y:auto;padding:10px;align-content:start}
.stage-card{aspect-ratio:1;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-family:'Cinzel',serif;color:var(--text-main)}
.stage-card:hover:not(:disabled){border-color:var(--gold-light);transform:scale(1.05)}
.stage-card:disabled{opacity:.3;cursor:not-allowed}
.stage-card.milestone{border-color:var(--theme-accent)}
.titles-container{flex:1;width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:10px}
.title-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:20px}
.title-card.unlocked{border-color:var(--theme-accent)}
.title-card.locked{background:rgba(255,255,255,.03)}
.title-card.locked>div:first-child{opacity:.45;filter:grayscale(100%)}
.title-card.locked h3,.title-card.locked p{opacity:.7}
.title-summary{padding:4px 4px 6px}
.ts-row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text-sub);margin-bottom:6px}
.ts-row b{color:var(--theme-accent);font-size:1.1rem}
.title-cat{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:0 4px 4px;border-bottom:1px solid var(--glass-border);font-family:'Shippori Mincho',serif;font-size:.95rem;letter-spacing:.12em;color:var(--theme-accent)}
.title-cat span:last-child{font-size:.72rem;color:var(--text-sub);letter-spacing:.05em}
.tprog{display:flex;align-items:center;gap:10px;margin-top:6px}
.tprog .bar{flex:1}.tprog span{font-size:.7rem;color:var(--text-sub);white-space:nowrap}
/* ゲーム画面のヘッダー（ステージ・手数・UNDO）の基本形 */
header{width:100%;max-width:800px;display:flex;flex-direction:column;background:var(--glass-bg);backdrop-filter:blur(16px);border-radius:20px;border:1px solid var(--glass-border)}
.game-nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.game-nav>:first-child{justify-self:start}
.game-tgls{justify-self:end;display:flex;flex-direction:column;gap:4px}
.toggle-btn.mini{padding:3px 8px;gap:5px;font-size:.62rem;border-radius:14px;justify-content:space-between;min-width:74px}
.toggle-btn.mini .state{font-size:.56rem;padding:1px 6px}
.toggle-btn.mini:hover{transform:none}
.toggle-btn.mini .lbl{white-space:nowrap}
.toggle-btn.mini .ico{font-size:.75rem}
.game-nav>div:nth-child(2){min-width:0}
@media (max-width:430px){.toggle-btn.mini .lbl{display:none}.toggle-btn.mini{min-width:0}}
@media (max-width:350px){.game-nav h1{white-space:normal!important;line-height:1.15;letter-spacing:.5px!important;font-size:.72rem!important}.game-nav #btn-back-game{padding:6px 8px!important;font-size:.7rem!important}}
@media (max-width:380px){.game-nav h1{letter-spacing:1.5px!important;font-size:.82rem!important}.game-nav #btn-back-game{padding:6px 10px!important}.toggle-btn.mini{min-width:0;padding:3px 6px}}
.status-bar{justify-content:space-between;font-size:.85rem;color:var(--text-sub)}
.status-val{color:var(--gold-light);font-weight:600;font-family:'Cinzel',serif}
/* 盤面・瓶・宝石の基本形（後半の「プレイ画面: 宝飾ディスプレイ」ブロックで上書き・拡張） */
#game-board{flex:1;width:100%}
.bottle{position:relative;cursor:pointer;display:flex;flex-direction:column-reverse;align-items:center;transition:transform .4s cubic-bezier(.175,.885,.32,1.275),box-shadow .3s,border-color .3s}
.bottle::before{content:'';position:absolute}
.gem{width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:rgba(0,0,0,.55)}
.gem::after{content:'';position:absolute;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,0))}
.gem span{position:relative;z-index:1;display:none}
body.symbols .gem span{display:block}
/* クリア／確認ダイアログ */
.modal-overlay{position:fixed;inset:0;background:rgba(4,5,12,.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .5s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-content{background:var(--glass-bg);border:1px solid var(--theme-accent);border-radius:28px;padding:35px;text-align:center;max-width:380px;width:85%;display:flex;flex-direction:column;align-items:center;gap:16px}
/* ホームの切替ボタン（BGM・効果音・色の記号）。ON/OFFを文字と色の両方で示す */
.toggles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.toggle-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:var(--text-sub);cursor:pointer;font-family:'Montserrat',sans-serif;font-size:.75rem;transition:border-color .3s,transform .3s}
.toggle-btn .ico{font-size:1rem}
.toggle-btn .state{font-family:'Cinzel',serif;font-weight:700;font-size:.65rem;letter-spacing:1px;padding:2px 8px;border-radius:10px;border:1px solid var(--text-sub)}
.toggle-btn[aria-pressed="true"]{background:rgba(212,175,55,.18);border-color:var(--theme-accent);color:var(--gold-light);box-shadow:0 0 12px rgba(212,175,55,.35)}
.toggle-btn[aria-pressed="true"] .state{background:var(--theme-accent);border-color:var(--theme-accent);color:#000}
.toggle-btn:hover{transform:translateY(-2px);border-color:var(--gold-light)}
.toggle-btn:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
footer .btn-action{padding:10px 16px;font-size:.8rem}
/* お知らせ（トースト） */
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-140%);z-index:300;background:var(--glass-bg);border:1px solid var(--theme-accent);color:var(--gold-light);padding:10px 20px;border-radius:24px;transition:transform .5s;backdrop-filter:blur(12px);font-size:.85rem;text-align:center;max-width:90%}
#toast.show{transform:translate(-50%,0)}
/* 画面の四隅を暗くするヴィネットと、和文向けの明朝系フォント指定 */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 150px rgba(0,0,0,.55)}
.column-title,.column-text,.title-card p,#clear-modal-desc{font-family:'Shippori Mincho','Montserrat',serif;letter-spacing:.08em}
.column-text{line-height:1.95}
.title-card h3{font-family:'Shippori Mincho',serif!important;letter-spacing:.12em}
#clear-modal-desc{white-space:pre-line;line-height:1.9}
#home-screen h1{background-size:200% auto;animation:shimmer 10s ease-in-out infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.gem{transition:transform .5s cubic-bezier(.22,1,.36,1),filter .4s}
/* 宝石の光沢アニメーション・持ち上げ・落下・ヒントの光 */
.gem::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 62%);background-size:250% 100%;background-position:120% 0}
.bottle.completed .gem::before{animation:sweep 6s ease-in-out infinite}
.bottle.completed .gem:nth-child(2)::before{animation-delay:.4s}
.bottle.completed .gem:nth-child(3)::before{animation-delay:.8s}
.bottle.completed .gem:nth-child(4)::before{animation-delay:1.2s}
@keyframes sweep{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.gem.drop{animation:drop .6s cubic-bezier(.22,1,.36,1)}
@keyframes drop{from{transform:translateY(-70px);opacity:.2}to{transform:none;opacity:1}}
.bottle.hint{border-color:var(--gold-light);animation:hintGlow 1.4s ease-in-out 3}
@keyframes hintGlow{50%{box-shadow:0 0 30px rgba(254,240,138,.6)}}
.modal-overlay.show .modal-content{animation:bloom 1.2s cubic-bezier(.22,1,.36,1)}
@keyframes bloom{from{transform:scale(.92);box-shadow:0 0 0 rgba(212,175,55,0)}to{transform:none;box-shadow:0 0 60px rgba(212,175,55,.25)}}
/* 図鑑：ジャンルの棚・宝石タイル（5列）・詳細ポップアップ */
.gem-box{flex:1;width:100%;max-width:800px;overflow-y:auto;padding:10px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--theme-accent),var(--gold-light))}
/* 宝石のカット形のアイコン。形は id%5 の5種、色は --g、面の反射は conic-gradient で重ねる */
.gi-wrap{position:relative;width:100%;aspect-ratio:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.gi{position:absolute;inset:10%;background:var(--g);clip-path:var(--cut)}
.gi::after{content:"";position:absolute;inset:0;background:conic-gradient(from 20deg,rgba(255,255,255,.6),rgba(255,255,255,0) 14%,rgba(0,0,0,.28) 30%,rgba(255,255,255,0) 46%,rgba(255,255,255,.42) 60%,rgba(255,255,255,0) 76%,rgba(0,0,0,.32) 90%,rgba(255,255,255,.6))}
.gi::before{content:"";position:absolute;inset:26%;background:rgba(255,255,255,.16);clip-path:var(--cut);z-index:1}
.cut0{--cut:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.cut1{--cut:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.cut2{--cut:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.cut3{--cut:polygon(50% 2%,98% 90%,2% 90%)}
.cut4{--cut:circle(50% at 50% 50%)}
.gi.lock{background:rgba(255,255,255,.07)}
.gi.lock::after{background:conic-gradient(from 20deg,rgba(255,255,255,.1),rgba(255,255,255,0) 25%,rgba(255,255,255,.06) 50%,rgba(255,255,255,0) 75%,rgba(255,255,255,.1))}
.gi.lock::before{display:none}
/* ジャンル一覧：棚のように、ミニ宝石を5つ並べたカード */
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.genre-card{background:linear-gradient(160deg,rgba(24,30,52,.75),rgba(10,13,26,.75));border:1px solid var(--glass-border);border-radius:14px;padding:14px 14px 12px;cursor:pointer;color:var(--text-main);text-align:left;font-family:'Shippori Mincho',serif;display:flex;flex-direction:column;gap:8px;transition:border-color .3s,transform .3s}
.genre-card:hover,.genre-card:focus-visible{border-color:var(--gold-light);transform:translateY(-2px)}
.genre-card.done{border-color:var(--theme-accent);box-shadow:0 0 18px rgba(212,175,55,.28)}
.genre-card b{font-weight:500;letter-spacing:.1em;font-size:1rem}
.genre-card small{color:var(--text-sub);font-size:.7rem;line-height:1.6}
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 8px 4px;border-bottom:1px solid rgba(212,175,55,.35);margin:2px 0 4px}
.shelf .gi-wrap{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.shelf .gi-wrap.dim{opacity:.4}
.genre-card .cnt{display:flex;justify-content:space-between;align-items:baseline;font-size:.7rem;color:var(--text-sub)}
/* タイル一覧：横5列。アイコンの下に名前だけ小さく添える */
.tile-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 6px;margin-top:14px}
.tile{background:none;border:1px solid transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;color:var(--text-sub);font-family:'Shippori Mincho',serif;min-width:0;transition:background .25s,border-color .25s,transform .25s}
.tile .gi-wrap{max-width:84px}
.tile:hover,.tile:focus-visible{background:rgba(255,255,255,.05);border-color:var(--glass-border);transform:translateY(-2px)}
.tile .nm{width:100%;font-size:.6rem;line-height:1.3;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.found .nm{color:var(--text-main)}
.tile.found.fresh .nm{color:var(--gold-light)}
/* 詳細ポップアップ：鑑定書のような縦長のシート */
#gem-modal{z-index:240}
.gem-sheet{position:relative;width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#121830,#080b18 60%);border:1px solid var(--theme-accent);border-radius:20px;box-shadow:0 0 0 4px rgba(4,5,12,.9),0 0 0 5px rgba(212,175,55,.3),0 24px 60px rgba(0,0,0,.6);text-align:left;overflow:hidden;transform:translateY(14px) scale(.98);transition:transform .45s cubic-bezier(.22,1,.36,1)}
#gem-modal.show .gem-sheet{transform:none}
.gs-close{position:absolute;top:10px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-border);background:rgba(4,5,12,.6);color:var(--text-main);font-size:1.1rem;cursor:pointer}
.gs-close:hover,.gs-close:focus-visible{border-color:var(--gold-light);color:var(--gold-light)}
.gs-body{overflow-y:auto;padding:0 22px 18px;-webkit-overflow-scrolling:touch}
.gs-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 14px;background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.1),rgba(255,255,255,0) 62%);margin:0 -22px 4px}
.gs-hero .gi-wrap{width:110px}
.gs-name{font-family:'Shippori Mincho',serif;font-size:1.5rem;color:var(--theme-accent);letter-spacing:.08em;text-align:center;padding:0 30px}
.gs-sub{font-size:.78rem;color:var(--gold-light);text-align:center;padding:0 20px}
.gs-quote{font-family:'Shippori Mincho',serif;font-size:.88rem;line-height:1.9;color:var(--text-main);text-align:center;margin:6px 6px 14px;padding:10px 0;border-top:1px solid rgba(212,175,55,.3);border-bottom:1px solid rgba(212,175,55,.3)}
.gs-spec{display:grid;grid-template-columns:7.5em 1fr;margin:0 0 14px;font-size:.78rem}
.gs-spec dt,.gs-spec dd{margin:0;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);line-height:1.7}
.gs-spec dt{color:var(--text-sub)}
.gs-spec dd{color:var(--text-main);word-break:break-word}
.gs-sec h3{font-family:'Shippori Mincho',serif;font-weight:500;font-size:.95rem;color:var(--theme-accent);margin:16px 0 4px;letter-spacing:.1em}
.gs-sec p{margin:0 0 6px;font-size:.84rem;line-height:2;color:#cbd5e1;text-align:left}
.gs-note{font-size:.7rem;line-height:1.8;color:var(--text-sub);border-top:1px solid rgba(255,255,255,.08);margin-top:14px;padding-top:10px}
.gs-warn{font-size:.78rem;line-height:1.9;color:#fca5a5;margin:10px 0 0}
.gs-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--glass-border);background:rgba(4,5,12,.7)}
.gs-foot .btn-action{padding:8px 18px;font-size:.8rem}
.gs-foot .pos{font-size:.72rem;color:var(--text-sub)}
@media (max-width:420px){.tile-grid{gap:8px 3px}.tile .nm{font-size:.54rem}.gs-spec{grid-template-columns:6.2em 1fr}}
#gem-modal:not(.show){visibility:hidden;transition:opacity .5s,visibility 0s .5s}
/* アカウント画面 */
.acct-box{flex:1;width:100%;max-width:640px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:12px}
.acct-h{font-family:'Cinzel',serif;letter-spacing:3px;font-size:.8rem;color:var(--theme-accent);margin-top:10px}
.acct-row{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.acct-row.current{border-color:var(--theme-accent);box-shadow:0 0 14px rgba(212,175,55,.2)}
.acct-info{flex:1;min-width:0}
.acct-name{font-family:'Shippori Mincho',serif;font-size:1rem;word-break:break-all}
.acct-sub{font-size:.7rem;color:var(--text-sub);margin-top:2px}
.acct-note{font-size:.72rem;color:var(--text-sub);line-height:1.8;font-family:'Shippori Mincho',serif}
.acct-field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-action.mini{padding:6px 14px;font-size:.7rem;letter-spacing:1px}
input.acct-in,textarea.acct-in{flex:1;min-width:140px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-radius:12px;color:var(--text-main);padding:10px 12px;font-family:inherit;font-size:.85rem;user-select:text;-webkit-user-select:text}
textarea.acct-in{width:100%;min-height:84px;resize:vertical;word-break:break-all}
.acct-in:focus-visible{outline:2px solid var(--gold-light)}
.btn-action.danger{border-color:rgba(248,113,113,.6);color:#fca5a5}
.btn-action.danger:hover:not(:disabled){background:#b91c1c;color:#fff;border-color:#fca5a5}
/* 画面の高さが低いときは、ホームの間隔を詰める */
@media (max-height:700px){#home-screen{gap:12px}.home-menu{gap:8px}#home-screen h1{font-size:2.1rem;margin-bottom:2px}.home-menu .btn-action{padding:9px 24px;font-size:.82rem}.toggles{gap:6px}.toggle-btn{padding:5px 10px;gap:6px}.toggle-btn .ico{font-size:.85rem}}
/* ===== プレイ画面: 宝飾ディスプレイ ===== */
html{overflow:hidden}
:root{--facet:linear-gradient(158deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 38%),linear-gradient(24deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 48%),linear-gradient(90deg,rgba(255,255,255,.1) 0 50%,rgba(0,0,0,.1) 50% 100%)}
/* 背景の光（楕円のぼかし） */
#game-screen::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 38% at 50% 46%,rgba(255,255,255,.07),transparent 72%),radial-gradient(ellipse 60% 20% at 50% 80%,rgba(212,175,55,.09),transparent 72%);background:radial-gradient(ellipse 80% 38% at 50% 46%,rgba(255,255,255,.07),transparent 72%),radial-gradient(ellipse 60% 20% at 50% 80%,color-mix(in srgb,var(--theme-accent) 16%,transparent),transparent 72%)}
/* 画面中央の飾り模様（宝石のファセットをかたどった細い線画） */
.game-deco{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;color:var(--theme-accent);opacity:.15}
.game-deco svg{width:min(125vw,780px);height:auto}
#game-screen>header,#game-screen>main,#game-screen>footer{position:relative;z-index:1}
/* ヘッダー上辺の金色の細い線 */
header::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--theme-accent),transparent)}
header{padding:12px 18px 10px;gap:6px}
.status-bar{display:grid;grid-template-columns:repeat(3,1fr);letter-spacing:0}
/* ヘッダーの3つの数値（STAGE / MOVES / UNDO） */
.stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.stat+.stat{border-left:1px solid var(--glass-border)}
.stat small{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:3px;color:var(--text-sub)}
.stat b{font-size:1.4rem;line-height:1.15}
/* 進捗メーターと、その下の「SORTED n / m」「★の基準」行 */
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.meter-fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--theme-accent),var(--gold-light));box-shadow:0 0 10px var(--theme-accent);transition:width .9s cubic-bezier(.22,1,.36,1)}
.meter-cap{display:flex;justify-content:space-between;gap:8px;font-size:.62rem;color:var(--text-sub);letter-spacing:1px;white-space:nowrap}
/* 盤面：--sc は瓶の拡大率（fitBoard が決める）。すべてのサイズを calc(... * var(--sc)) で連動させる */
#game-board{--sc:1;display:flex;flex-wrap:nowrap;align-items:flex-start;justify-content:center;align-content:normal;gap:0;padding:0 8px;overflow-x:hidden;overflow-y:auto}
/* 瓶を並べる棚。本数が多いと折り返す（段の本数は fitBoard が均等に調整） */
.rack{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:calc(22px*var(--sc,1)) calc(14px*var(--sc,1));margin:auto;width:100%;padding:calc(46px*var(--sc,1)) 0 14px}
/* 1本分のまとまり：瓶 + 台座 + 名札 */
.slot{display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* 瓶本体：ガラスの質感と金色の口輪 */
.bottle{flex:none;isolation:isolate;width:calc(60px*var(--sc,1));height:calc(195px*var(--sc,1));padding:calc(7px*var(--sc,1)) calc(6px*var(--sc,1));gap:calc(5px*var(--sc,1));border:1px solid rgba(255,255,255,.28);border-top:none;border-radius:0 0 calc(28px*var(--sc,1)) calc(28px*var(--sc,1));background:linear-gradient(90deg,rgba(255,255,255,.2) 0,rgba(255,255,255,.04) 14%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 82%,rgba(255,255,255,.08) 100%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02) 55%,rgba(0,0,0,.22));box-shadow:inset 0 -18px 26px rgba(0,0,0,.28),inset 0 0 14px rgba(255,255,255,.05)}
.bottle::before{top:calc(-10px*var(--sc,1));width:calc(72px*var(--sc,1));height:calc(10px*var(--sc,1));border:1px solid rgba(212,175,55,.65);border-radius:calc(6px*var(--sc,1));background:linear-gradient(180deg,rgba(254,240,138,.55),rgba(212,175,55,.18) 55%,rgba(120,90,20,.35));box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.bottle.selected{border-color:var(--theme-accent);box-shadow:inset 0 -18px 26px rgba(0,0,0,.28),0 0 28px rgba(212,175,55,.3);box-shadow:inset 0 -18px 26px rgba(0,0,0,.28),0 0 28px color-mix(in srgb,var(--theme-accent) 45%,transparent)}
.bottle.selected::after{content:'';position:absolute;z-index:-1;top:calc(-58px*var(--sc,1));left:50%;width:calc(84px*var(--sc,1));height:calc(84px*var(--sc,1));transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,var(--theme-accent) 0%,transparent 65%);opacity:.45;pointer-events:none}
.bottle.completed{border-color:rgba(255,215,0,.7);box-shadow:inset 0 -18px 26px rgba(0,0,0,.2),0 0 24px rgba(255,215,0,.3)}
.bottle.completed::before{border-color:rgba(255,226,120,.95);background:linear-gradient(180deg,rgba(255,244,170,.95),rgba(212,175,55,.6) 55%,rgba(150,110,20,.7));box-shadow:0 0 16px rgba(255,215,0,.55),inset 0 1px 0 rgba(255,255,255,.7)}
/* 宝石：八角形に切り抜き、ファセット模様 --facet と色 --g を重ねる */
.gem{height:calc(40px*var(--sc,1));border:0;border-radius:0;background:var(--facet),var(--g,#64748b);clip-path:polygon(13% 0,87% 0,100% 26%,100% 74%,87% 100%,13% 100%,0 74%,0 26%);box-shadow:inset 0 0 0 calc(3px*var(--sc,1)) rgba(255,255,255,.2),inset 0 3px 6px rgba(255,255,255,.5),inset 0 -5px 9px rgba(0,0,0,.5)}
.gem::after{top:8%;left:16%;width:34%;height:26%;border-radius:2px 1px 6px 1px}
.gem.lifted{transform:translateY(calc(-38px*var(--sc,1)));filter:none}
/* 瓶の下の台座 */
.pedestal{flex:none;width:calc(88px*var(--sc,1));height:calc(16px*var(--sc,1));margin-top:calc(-9px*var(--sc,1));border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.3),rgba(255,255,255,.05) 70%);border:1px solid rgba(212,175,55,.45);border:1px solid color-mix(in srgb,var(--theme-accent) 60%,transparent);box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 18px rgba(212,175,55,.2);transition:box-shadow .5s,border-color .5s}
.bottle.selected+.pedestal{box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 30px var(--theme-accent)}
.slot.done .pedestal{border-color:rgba(255,215,0,.75);box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 26px rgba(255,215,0,.45)}
/* 完成した瓶に付く宝石名の名札 */
.plate{width:calc(96px*var(--sc,1));height:calc(18px*var(--sc,1));margin-top:6px;line-height:calc(18px*var(--sc,1));text-align:center;font-family:'Shippori Mincho',serif;font-size:max(.58rem,calc(.7rem*var(--sc,1)));letter-spacing:.08em;color:var(--gold-light);text-shadow:0 0 10px rgba(254,240,138,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes plateIn{from{opacity:0;transform:translateY(-6px);letter-spacing:.3em}}
@keyframes pedPulse{from{box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 46px rgba(255,235,150,.9)}}
.slot.fresh .plate{animation:plateIn 1.2s cubic-bezier(.22,1,.36,1)}
.slot.fresh .pedestal{animation:pedPulse 1.6s ease-out}
/* 画面下の操作ドック（UNDO / RESET / +BOTTLE / 移動モード / HINT） */
.dock{display:flex;gap:2px;margin-bottom:10px;padding:6px;flex-wrap:wrap;justify-content:center;max-width:min(100%,640px);background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:30px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dock .btn-action{background:transparent;border-color:transparent;padding:9px 13px;font-size:.74rem;letter-spacing:1.5px;border-radius:24px}
.dock .btn-action:hover:not(:disabled){background:var(--theme-accent);color:#000;border-color:var(--gold-light)}
/* 到達できなくなった★の段は、薄くして打ち消し線 */
.meter-cap .lost{opacity:.35;text-decoration:line-through}
/* エクストラステージ：背景の絵文字・重ね演出・宝石の形・ステージ選択のタブ */
#xt-emblem,#xt-ov{position:fixed;inset:0;pointer-events:none;display:none}
#xt-emblem{z-index:0;align-items:center;justify-content:center;font-size:min(82vw,60vh);opacity:.15;animation:xtFloat 14s ease-in-out infinite}
#xt-ov{z-index:2}
body.inxt #xt-emblem{display:flex}
body.inxt #xt-ov{display:block}
@keyframes xtFloat{0%,100%{transform:translateY(-1.5%) rotate(-3deg) scale(1)}50%{transform:translateY(1.5%) rotate(3deg) scale(1.04)}}
@keyframes xtPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes xtFlash{0%,93%,100%{opacity:0}94%{opacity:.2}95%{opacity:.02}96%{opacity:.14}98%{opacity:0}}
@keyframes xtFlick{0%{opacity:.55}20%{opacity:.9}35%{opacity:.65}60%{opacity:1}80%{opacity:.7}100%{opacity:.85}}
body.xtov-scan #xt-ov{background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 2px,transparent 2px 4px)}
body.xtov-grid #xt-ov{background:linear-gradient(rgba(55,240,255,.08) 1px,transparent 1px) 0 0/42px 42px,linear-gradient(90deg,rgba(255,60,200,.07) 1px,transparent 1px) 0 0/42px 42px}
body.xtov-wave #xt-ov{background:radial-gradient(ellipse at 50% 110%,color-mix(in srgb,var(--theme-accent) 22%,transparent),transparent 60%);animation:xtPulse 6s ease-in-out infinite}
body.xtov-fog #xt-ov{background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.14),transparent 62%);animation:xtPulse 7s ease-in-out infinite}
body.xtov-flash #xt-ov{background:#fff;animation:xtFlash 9s linear infinite}
body.xtov-flick #xt-ov{background:radial-gradient(ellipse at 50% 112%,rgba(255,110,30,.3),transparent 60%);animation:xtFlick 1.1s ease-in-out infinite alternate}
body.xtov-dust #xt-ov{background:linear-gradient(180deg,transparent 45%,rgba(255,179,71,.13))}
body.xtov-vig #xt-ov{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--theme-accent) 13%,transparent),transparent 66%)}
/* テーマごとの宝石の形・瓶のふた */
body.xt-retro .gem{clip-path:none;border-radius:3px}
body.xt-cyber .gem{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
body.xt-candy .gem,body.xt-aqua .gem,body.xt-abyss .gem{clip-path:ellipse(50% 50%)}
body.xt-ice .gem{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
body.xt-fire .gem,body.xt-horror .gem,body.xt-thunder .gem{clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%)}
body.inxt .bottle::before{border-color:var(--theme-accent);background:linear-gradient(180deg,color-mix(in srgb,var(--theme-accent) 70%,#fff),color-mix(in srgb,var(--theme-accent) 35%,#000))}
body.inxt #game-screen{touch-action:none}
body.inxt.xt-scroll #game-board{touch-action:pan-y}
#xt-hint{font-family:'Shippori Mincho',serif;font-size:.68rem;line-height:1.5;color:var(--gold-light);letter-spacing:.06em;text-align:center;padding:2px 4px 0}
#xt-hint[hidden]{display:none}
/* ステージ選択のタブ（STAGE / EXTRA） */
.stage-tabs{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
.stage-tabs .tab{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.18em;padding:8px 20px;border-radius:20px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);color:var(--text-sub);cursor:pointer}
.stage-tabs .tab.on{background:rgba(212,175,55,.16);border-color:var(--theme-accent);color:var(--gold-light)}
.stage-tabs .tab:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px}
.stage-card.xt{border-color:rgba(255,92,120,.45);background:linear-gradient(160deg,rgba(60,14,30,.7),rgba(12,8,22,.7))}
.stage-card.xt.got{border-color:var(--gold-light);box-shadow:0 0 14px rgba(254,240,138,.25)}
.stage-card.xt .xtmk{font-size:.95rem;height:1.1rem;line-height:1.1rem;font-family:sans-serif}
.gs-new{margin:0 -22px;padding:8px 0;text-align:center;font-family:'Shippori Mincho',serif;font-size:.82rem;letter-spacing:.2em;color:#1a1200;background:linear-gradient(90deg,#b8902a,#fef08a,#b8902a)}
/* シークレット称号：未獲得はひみつ、獲得後はきらびやかな背景 */
.title-card.secret{border-style:dashed;background:rgba(255,255,255,.02)}
.title-card.secret>div:first-child{opacity:.6}
.title-card{flex-shrink:0}
.title-card.secret-got{position:relative;overflow:hidden;border-color:var(--gold-light);background:linear-gradient(120deg,rgba(212,175,55,.22),rgba(192,132,252,.2) 35%,rgba(56,189,248,.2) 65%,rgba(244,114,182,.22));box-shadow:0 0 18px rgba(254,240,138,.28),inset 0 0 22px rgba(255,255,255,.07)}
.title-card.secret-got::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 48%,transparent 62%);background-size:260% 100%;background-position:130% 0;animation:secSweep 5s ease-in-out infinite;pointer-events:none}
.title-card.secret-got::after{content:'SECRET';position:absolute;top:6px;right:12px;font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.2em;color:var(--gold-light);opacity:.9}
.title-card.secret-got>div{position:relative;z-index:1}
@keyframes secSweep{0%,30%{background-position:130% 0}70%,100%{background-position:-30% 0}}
.star-sum{width:100%;max-width:800px;padding:0 12px 6px}
.star-sum .ss-row{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--text-sub);margin-bottom:6px}
.star-sum b{color:var(--gold-light);font-weight:500}
/* 操作ドック：UNDOを中央に大きく、RESETは誤タップを避けて左端に小さく */
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex-wrap:nowrap;width:min(100%,640px)}
.dock .btn-action{padding:9px 6px;white-space:nowrap;text-align:center;letter-spacing:1px}
#reset-btn{grid-column:span 2;justify-self:start;opacity:.7;font-size:.68rem}
#undo-btn{grid-column:span 2;font-size:.86rem;padding:11px 6px;border-color:var(--glass-border)}
#add-bottle-btn{grid-column:span 2;justify-self:end}
#mode-btn{grid-column:span 3}
#hint-btn{grid-column:span 3}
/* 「視覚効果を減らす」設定の人には、アニメーションとトランジションを止める */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ===== 癒し・やり込み ===== */
@media (max-width:430px){.par-best{display:none}}
#clear-glow{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;background:radial-gradient(circle at 50% 55%,var(--theme-accent) 0%,transparent 62%)}
#clear-glow.go{animation:clearglow 2.8s ease-out}
@keyframes clearglow{0%{opacity:0;transform:scale(.6)}22%{opacity:.4}100%{opacity:0;transform:scale(1.6)}}
.stage-card.is3{opacity:.45}
.stage-card.need3:not(:disabled){border-color:var(--gold-light);box-shadow:0 0 12px rgba(254,240,138,.35)}
.need3-row{display:flex;justify-content:center;margin:0 0 10px}
.rec-row{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07);font-size:.85rem;color:var(--text-sub)}
.rec-row b{color:var(--gold-light);font-weight:500;text-align:right}
.rec-h{margin:18px 2px 4px;font-size:.78rem;letter-spacing:.2em;color:var(--theme-accent)}
.qz-timebar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 10px}
.qz-timebar i{display:block;height:100%;width:100%;background:var(--gold-light)}
/* ===== クイズ ===== */
.btn-action[hidden]{display:none}
.quiz-sum{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--text-sub);margin:0 2px 14px}
.quiz-sum b{color:var(--gold-light);font-weight:500}
.quiz-note{font-size:.78rem;color:var(--text-sub);line-height:1.8;margin:0 2px 14px}
.genre-card.lock{opacity:.5;cursor:default}
.genre-card.lock:hover,.genre-card.lock:focus-visible{transform:none;border-color:var(--glass-border)}
.genre-card .qbest{display:flex;justify-content:space-between;font-size:.7rem;color:var(--gold-light);margin-top:2px}
.qz-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--text-sub);margin:2px 2px 8px}
.qz-q{background:linear-gradient(160deg,rgba(24,30,52,.75),rgba(10,13,26,.75));border:1px solid var(--glass-border);border-radius:16px;padding:18px 16px 16px;margin:12px 0 14px;font-family:'Shippori Mincho',serif;line-height:1.9;font-size:.98rem;white-space:pre-line;text-align:center;overflow-wrap:anywhere}
.qz-vis{display:flex;justify-content:center;margin-bottom:12px}
.qz-vis .gi-wrap{width:76px}
.qz-opts{display:grid;grid-template-columns:1fr;gap:10px}
.qz-opt{display:flex;gap:12px;align-items:baseline;text-align:left;background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-main);border-radius:14px;padding:12px 14px;font-family:'Shippori Mincho',serif;font-size:.92rem;line-height:1.6;cursor:pointer;overflow-wrap:anywhere;transition:border-color .25s,background .25s,box-shadow .25s}
.qz-opt i{font-style:normal;color:var(--theme-accent);font-family:'Cinzel',serif;font-size:.8rem;flex:none}
.qz-opt:hover:not(:disabled),.qz-opt:focus-visible{border-color:var(--gold-light)}
.qz-opt:disabled{cursor:default}
.qz-opt.ok{border-color:#6fe3a1;background:rgba(40,100,70,.28);box-shadow:0 0 16px rgba(111,227,161,.35)}
.qz-opt.ng{border-color:#ff7a8a;background:rgba(120,30,50,.28)}
.qz-opt.dim{opacity:.55}
.qz-fb{margin:12px 2px 0;font-size:.84rem;line-height:1.9;color:var(--text-sub);min-height:4.2em;overflow-wrap:anywhere}
.qz-fb b{font-weight:500;letter-spacing:.1em}
.qz-fb b.ok{color:#8ff0b8}.qz-fb b.ng{color:#ff9aa7}
.qz-foot{display:flex;justify-content:center;gap:12px;margin:14px 0 6px;flex-wrap:wrap}
.qz-res{text-align:center;padding:18px 8px 6px}
.qz-res .big{font-family:'Cinzel',serif;font-size:3.2rem;color:var(--gold-light);line-height:1.2}

<body>
<!-- 背景の粒子を描くキャンバスと、呼吸ガイドに合わせて拡縮する光の輪（halo） -->
<canvas id="fx-canvas"></canvas>

<div id="xt-emblem" aria-hidden="true"></div>
<div id="xt-ov" aria-hidden="true"></div>

    <div id="column-text" class="column-text"></div>

</div>

<!-- ホーム画面：タイトル・メニュー・BGM／効果音／色の記号の切替ボタン -->

    <h1>LUMINA JEWELS</h1>
    <p class="home-sub">HEALING COLOR SORT</p>

  </div>
  <div class="breath-guide" id="breath-text" aria-hidden="true">BREATHE IN...</div>
  <div class="home-menu">
    <button id="btn-play" class="btn-action">PLAY GAME</button>

  </div>

  </div>

<!-- アカウント画面（renderAccount() が作る） -->

  </div>

  {title:"ルビーとサファイアは同じ鉱物",text:"ルビーとサファイアは、どちらも「コランダム」という同じ鉱物です。赤いものがルビー、それ以外の色のものがサファイアと呼ばれます。"},
  {title:"エメラルドの「庭」",text:"エメラルドには、内部に細かなひびや内包物が入りやすい性質があります。その模様は、フランス語で庭を意味する「ジャルダン」と呼ばれ、個性として楽しまれます。"},
  {title:"琥珀は木の樹脂の化石",text:"琥珀は、木の樹脂が長い年月をかけて固まったもので、鉱物ではありません。ときどき、中に小さな虫や植物が閉じ込められています。"},
  {title:"真珠は貝がつくる宝石",text:"真珠は、貝の体の中でゆっくりとつくられる宝石です。主な成分は炭酸カルシウムで、鉱物の宝石のように掘り出されるわけではありません。"},
  {title:"アメジストの名前の由来",text:"アメジストの名は、「酔わない」という意味の古代ギリシャ語に由来するといわれます。この石を身につけると酔いにくいと信じられていたそうです。"},
  {title:"オパールの虹色",text:"オパールの虹色の輝きは、微小なシリカの粒が規則正しく並び、光を分けることで生まれます。見る角度によって色が移ろいます。"},
  {title:"光で色が変わるアレキサンドライト",text:"アレキサンドライトは、太陽光の下では青緑、白熱灯の下では赤みを帯びて見えることで知られます。この性質は「変色効果」と呼ばれます。"},
  {title:"ラピスラズリと群青",text:"深い青のラピスラズリは、古くから顔料「ウルトラマリン」の原料でした。名前は「海を越えてきた」という意味の言葉に由来します。"},
  {title:"ヒスイは日本の国石",text:"ヒスイは、2016年に日本鉱物科学会が日本の「国石」に選びました。新潟県の糸魚川では、縄文時代からヒスイが加工されていたことが知られています。"},
  {title:"黒曜石は火山のガラス",text:"黒曜石は、火山のマグマが急に冷えて固まった天然のガラスです。割ると鋭い刃になるため、石器時代には道具の材料として重宝されました。"},
  {title:"蛍光の語源は蛍石",text:"蛍石に紫外線を当てると光る性質から、「蛍光」という言葉が生まれたといわれます。英語の fluorescence も、蛍石（fluorite）が語源です。"},
  {title:"方解石の二重像",text:"透明な方解石を文字の上に置くと、文字が二重に見えます。光が二つに分かれて進む「複屈折」という性質によるものです。"},
  {title:"キャッツアイの一本の筋",text:"キャッツアイは、石の内部の細い繊維が光を反射し、一本の筋が猫の目のように浮かび上がる宝石です。石を動かすと、その筋も滑らかに動きます。"},
  {title:"宝石を見極める「4C」",text:"ダイヤモンドの品質は、カラット（重さ）・カラー（色）・クラリティ（透明度）・カット（形）の4つの「C」で評価されます。"},
  {title:"1カラットはどれくらい？",text:"宝石の重さの単位「1カラット」は、0.2グラムです。小さな粒ですが、その重さが輝きとともに価値を決める目安になります。"},
  {title:"モース硬度とは",text:"鉱物の硬さを10段階で表す「モース硬度」は、19世紀のはじめに、ドイツの鉱物学者モースが考えた物差しです。いちばん硬いのがダイヤモンドの10です。"},
  {title:"誕生石のはじまり",text:"いまの誕生石の一覧は、1912年にアメリカの宝石商の団体が定めたものがもとになっています。日本では、1958年に独自の一覧が決められました。"},
  {title:"雪の結晶はなぜ六角形？",text:"雪の結晶が六角形になるのは、水の分子が六角形の並びで氷になるためです。気温や湿度によって、枝分かれの形が変わります。"},
  {title:"ゆっくり冷えると大きな結晶に",text:"溶けた物質は、ゆっくり冷えるほど、結晶が大きく育つ傾向があります。大きな水晶ができる背景には、地下深くでの長い時間があります。"},
  {title:"星の色と温度",text:"夜空の星の色は、表面の温度で決まります。青白い星は高温で、赤っぽい星は比較的低温です。肉眼でも、明るい星の色の違いが見分けられます。"},
  {title:"虹は何色？",text:"虹は、雨粒の中で光が曲がり、反射することで見えます。日本では七色と数えますが、国や地域によって、二色から六色までさまざまな数え方があります。"},
  {title:"目に見える光の幅",text:"人の目に見える光（可視光）の波長は、おおよそ380〜780ナノメートルです。この範囲の中で、波長が短い順に、紫から赤へ色が変わります。"},
  {title:"森林浴という言葉",text:"「森林浴」という言葉は、1982年に日本の林野庁が使いはじめたとされています。木々に囲まれて歩くと、気分が和らぐと感じる人は多いようです。"},
  {title:"体内時計は約24時間",text:"人の体には、約24時間周期のリズム「概日リズム」があります。朝に光を浴びると、このリズムが整いやすいといわれています。"},
  {title:"グラスハープの音",text:"水を入れたグラスの縁を濡れた指でなぞると、音が鳴ります。水の量を変えると音の高さが変わり、グラスを並べれば音階をつくることもできます。"},
  {title:"サンゴも宝石になる",text:"サンゴは、海に生きるサンゴ虫が作る骨格で、生き物由来の宝石です。赤、桃、白などの色があり、日本でも古くから装飾に使われてきました。"},
  {title:"パライバトルマリンの青",text:"鮮やかなネオンブルーが特徴のパライバトルマリンは、1980年代に、ブラジルのパライバ州で見つかりました。青い色は、微量の銅によるものです。"},
  {title:"ゆっくり息を吐く",text:"息を吐く時間を、吸う時間より長くすると、気持ちが落ち着きやすいといわれます。疲れたときは、ゆっくり吐くことを意識してみてください。"},
  {title:"宝石の「内包物」は個性",text:"宝石の中の小さな傷や粒は「内包物」と呼ばれます。欠点とされることもありますが、天然の石であることの証や、産地の手がかりになることもあります。"},
  {title:"トルコ石の長い歴史",text:"トルコ石は、古代エジプトの装飾品にも使われていた、歴史の長い宝石です。青緑色の石は、旅のお守りとして大切にされてきました。"},
  {title:"規則正しい繰り返しの心地よさ",text:"波や呼吸のように、一定のリズムで繰り返されるものには、気持ちを落ち着かせる力があるといわれます。このゲームの光の呼吸も、そのひとつです。"}

/* ---------- エクストラ：入手条件の部品 ----------
   各部品 P.xxx(...) は「トラッカー X を受け取って true/false を返す関数」を返す。
   X は、エクストラの1回の挑戦ごとの行動記録（startStage で作り、操作のたびに更新する）。
     X.pours[]  移した記録 {t, from, to, n, color, comp}   X.comps[] 完成の記録 {idx, color, t}
     X.moves 手数 / X.dur 所要秒 / X.clock クリア時の Date / X.LB 手数の下限 / X.k, X.C, X.G ほか */
const moonPhase = d => (((d.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000) % 29.530588 + 29.530588) % 29.530588 / 29.530588;
const isPrime = n => { if(n < 2) return false; for(let i = 2; i * i <= n; i++) if(n % i === 0) return false; return true; };
const gidOf = name => GEM_LORE.findIndex((l, i) => i < CURATED && l[0] === name);
const P = {
  /* 手数 */
  mvEnd:d => X => X.moves > 0 && X.moves % 10 === d,
  mvMult:n => X => X.moves > 0 && X.moves % n === 0,
  mvEq:n => X => X.moves === n,
  mvEq2G:() => X => X.moves === X.G * 2,
  mvEq2K:() => X => X.moves === X.k * 2,
  mvRep:() => X => X.moves >= 11 && /^(\d)\1+$/.test(String(X.moves)),
  mvPal:() => X => { const s = String(X.moves); return X.moves >= 100 && s === [...s].reverse().join('') && !/^(\d)\1+$/.test(s); },
  mvPrime:() => X => isPrime(X.moves),
  mvSquare:() => X => X.moves >= 4 && Number.isInteger(Math.sqrt(X.moves)),
  mvFib:() => X => [21, 34, 55, 89, 144, 233].includes(X.moves),
  mvLeLB:f => X => X.moves <= Math.ceil(X.LB * f),
  mvGeLB:f => X => X.moves >= Math.ceil(X.LB * f),
  /* 時間・時刻 */
  tmUnder:s => X => X.dur <= s,
  tmOver:s => X => X.dur >= s,
  tmFirstIdle:s => X => X.firstAct !== null && X.firstAct >= s,
  tmGap:s => X => X.maxPourGap >= s,
  tmCharge:s => X => X.pours.length > 1 && X.pours[X.pours.length - 1].t - X.pours[X.pours.length - 2].t >= s * 1000,
  tmFinal:(n, s) => X => { const p = X.pours; if(p.length < n + 1) return false; for(let i = p.length - n; i < p.length; i++) if(p[i].t - p[i - 1].t > s * 1000) return false; return true; },
  tmHour:(a, b) => X => X.clock.getHours() >= a && X.clock.getHours() < b,
  tmAt:(h, m1, m2) => X => X.clock.getHours() === h && X.clock.getMinutes() >= m1 && X.clock.getMinutes() < m2,
  tmHH:() => X => X.clock.getHours() === X.clock.getMinutes(),
  tmSec:(a, b) => X => X.clock.getSeconds() >= a && X.clock.getSeconds() <= b,
  tmDow:d => X => X.clock.getDay() === d,
  tmMoon:w => X => { const p = moonPhase(X.clock); return w === 'full' ? Math.abs(p - .5) < .065 : (p < .04 || p > .96); },
  tmDom:w => X => w === 'first' ? X.clock.getDate() === 1 : new Date(X.clock.getFullYear(), X.clock.getMonth(), X.clock.getDate() + 1).getDate() === 1,
  /* ボタン操作 */
  acPure:() => X => !X.undo && !X.hint && !X.bottle && !X.reset,
  acUndoAll:() => X => X.undo >= 5,
  acUndoOne:() => X => X.undo === 1,
  acHintAll:() => X => X.hint >= 3,
  acHintOne:() => X => X.hint === 1,
  acBottle:() => X => X.bottle > 0,
  acReset:n => X => X.reset >= n,
  acNoReset:() => X => !X.reset,
  acModeSw:n => X => X.modeSw >= n,
  acBatchOnly:() => X => X.pours.length > 0 && X.pourSingle === 0,
  acBgmOn:() => X => audio.bgmEnabled,
  acSymOn:() => X => document.body.classList.contains('symbols'),
  /* 画面のジェスチャー（途中で成立するので mode='l' で使う） */
  gsHoldEmpty:ms => X => X.hold.empty >= ms,
  gsHoldMeter:ms => X => X.hold.meter >= ms,
  gsHoldBottle:ms => X => X.hold.bottle >= ms,
  gsHoldCorner:(c, ms) => X => X.hold[c] >= ms,
  gsPullUp:() => X => X.pullUp,
  gsSwipeTop:() => X => X.swipeTop,
  gsEdge:(s, n) => X => X.edgeMax[s] >= n,
  gsCorners:seq => X => X.cseq.slice(-seq.length).join() === seq.join(),
  gsCode:code => X => X.dirs.endsWith(code),
  gsTapStage:n => X => X.stageTaps >= n,
  gsTapTitle:n => X => X.titleTaps >= n,
  gsRapid:() => X => X.rapid,
  gsDbl:n => X => X.dbl >= n,
  gsTriple:() => X => X.triple,
  gsSameTap:n => X => X.sameMax >= n,
  gsRotate:() => X => X.rotated,
  gsTabAway:s => X => X.away >= s,
  /* 盤面・移し方 */
  bdOuro:() => X => X.pours.length > 0 && X.comps.length > 0 && X.pours[0].color === X.comps[X.comps.length - 1].color,
  bdGather:() => X => X.gather,
  bdBatch:n => X => X.pours.some(p => p.n >= n),
  bdColorFirst:name => X => X.comps.length > 0 && X.comps[0].color === gidOf(name),
  bdColorLast:name => X => X.comps.length > 0 && X.comps[X.comps.length - 1].color === gidOf(name),
  bdPair:(a, b) => X => { const A = gidOf(a), B = gidOf(b), c = X.comps; for(let i = 1; i < c.length; i++) if((c[i].color === A && c[i - 1].color === B) || (c[i].color === B && c[i - 1].color === A)) return true; return false; },
  bdAscending:n => X => X.comps.length >= n && X.comps.slice(0, n).every((c, i, a) => i === 0 || c.idx > a[i - 1].idx),
  bdLastIsAdded:() => X => X.addedIdx >= 0 && X.comps.length > 0 && X.comps[X.comps.length - 1].idx === X.addedIdx,
  bdFirstMoveRL:() => X => X.pours.length > 0 && X.pours[0].from === 0 && X.pours[0].to === X.nb0 - 2,   // 動かせる先は最初から空の右端2本だけ。その左側（nb0-2）へ、一番左の瓶から
  bdFirstCompLeft:() => X => X.comps.length > 0 && X.comps[0].idx === 0,
  bdCombo:n => X => { let run = 0; for(const p of X.pours){ run = p.comp ? run + 1 : 0; if(run >= n) return true; } return false; },
  bdPingpong:n => X => { let run = 1; const p = X.pours; for(let i = 1; i < p.length; i++){ run = (p[i].from === p[i - 1].to && p[i].to === p[i - 1].from) ? run + 1 : 1; if(run >= n) return true; } return false; },
  bdLastBatch:n => X => X.pours.length > 0 && X.pours[X.pours.length - 1].n >= n,
  bdSameSrc:n => X => { let run = 1; const p = X.pours; for(let i = 1; i < p.length; i++){ run = p[i].from === p[i - 1].from ? run + 1 : 1; if(run >= n) return true; } return false; },
  /* 記録・コレクション */
  meGems:n => X => stats.gems.filter(i => i < NORMAL_COUNT).length >= n,
  meTitles:n => X => unlockedTitles.size >= n,
  meFic:n => X => stats.gems.filter(i => i >= FIC_BASE && i !== FIC_BASE + X.k - 1).length >= n,
  meNthClear:n => X => (xtData.clr[X.k] || 0) === n,
  meAttempt:n => X => (xtData.att[X.k] || 0) === n,
  meStreak:n => X => xtStreak >= n,
  meBaseStars:() => X => bestStars[X.k] === 3
};

  "ルビー":["コランダム（酸化鉱物）のうち赤色のもの","Al2O3（Cr3+を微量含む）","三方晶系","9","3.99〜4.10","1.762〜1.770","ミャンマー（モゴック）、モザンビーク、タイ、スリランカ、マダガスカル","酸化アルミニウムのAl3+の一部を微量のクロム（Cr3+）が置き換えると、青緑の光を吸収して赤く見え、同時に強い赤色の蛍光を放ちます。この蛍光が、日光の下で内側から燃えるような色合いを生みます。ミャンマー産は鉄が少なくクロムが多いため蛍光が強く、最上級の赤は「ピジョンブラッド（鳩の血）」と呼ばれます。内部に整列したルチルの針（シルク）は、産地や加熱処理の有無を推定する手がかりになります。","サンスクリット語では「宝石の王」を意味するラトナラージと呼ばれ、古代インドでは宝石の最上位とされました。ミャンマー北部のモゴックは古くからの名産地で、近年はモザンビークなどアフリカ産が市場の大きな部分を占めます。7月の誕生石で、情熱・勇気・活力の象徴です。","天然ルビーの大半は加熱処理を受けています。ひびを鉛ガラスで埋めた処理品も多く流通するため、購入時は鑑別書で処理の有無を確認します。合成ルビーは20世紀初頭に火炎溶融法で量産が始まり、現在も大量に作られています。モース硬度は9ですが、特定の方向に割れやすい性質（裂開）があるため、強い衝撃は避けます。"],
  "サファイア":["コランダム（酸化鉱物）のうち赤以外のもの","Al2O3（FeとTiを微量含む）","三方晶系","9","3.99〜4.10","1.762〜1.770","ミャンマー、スリランカ、カシミール、マダガスカル、オーストラリア","コランダムのうち、赤以外のものをサファイアと呼びます。代表的な青色は、鉄（Fe2+）とチタン（Ti4+）の間で電子が移るときに赤〜黄の光を吸収することで生じます。見る方向で青の濃さが変わる多色性があり、ルチルの針が三方向に整列していると、光を当てたときに六条の星形（アステリズム）が現れます。ピンク・黄・緑・無色などもすべてサファイアです。","カシミール産は「コーンフラワーブルー」と呼ばれる柔らかな青で、1880年代の短い採掘期の産出が伝説的な評価を受けています。青は古くから誠実・慈愛・高潔の象徴とされ、王侯の婚約指輪にも使われてきました。9月の誕生石です。","市場の大半は加熱処理品です。ベリリウムを拡散させて色を整える処理もあり、処理の有無や産地で価格が大きく変わるため、鑑別書の確認が重要です。合成サファイアは精密機器の窓材や腕時計の風防など、工業用途でも広く使われています。"],
  "エメラルド":["ベリル（ケイ酸塩鉱物）のうち緑色のもの","Be3Al2Si6O18（Cr3+、V3+を微量含む）","六方晶系","7.5〜8","2.67〜2.78","1.565〜1.602","コロンビア、ザンビア、ブラジル、ジンバブエ","ベリルのうち、クロムやバナジウムで緑に発色したものです。ほとんどの結晶は内部にひびや包有物を持ち、その模様は庭に見立てて「ジャルダン」と呼ばれます。コロンビア産では、液体・気体・結晶の三つの相が入った「三相包有物」が特徴的で、産地推定に役立ちます。硬度は高いのに靭性が低く、衝撃で割れやすい石です。","古代エジプトのクレオパトラが愛し、紅海沿岸の鉱山を所有したと伝えられます。16世紀にはスペイン人がコロンビアの鉱山を発見し、以後はコロンビアが代表的な産地になりました。5月の誕生石で、幸運と安定の象徴です。","ひびを油や樹脂で目立たなくする含浸処理が一般的で、処理の程度は価格に影響します。超音波洗浄や急な温度変化は、含浸剤の抜けや割れの原因になるため避けます。ガラスや合成の類似品が多いので、鑑別書の確認が重要です。"],
  "トパーズ":["トパーズ（ケイ酸塩鉱物）","Al2SiO4(F,OH)2","直方晶系（斜方晶系）","8","3.49〜3.57","1.609〜1.643","ブラジル、パキスタン、ロシア、スリランカ、ナイジェリア","Al2SiO4(F,OH)2の組成を持ち、一方向に完全な劈開があるため、硬いのに衝撃で割れやすい石です。天然の色は黄・橙・ピンク・無色などで、赤みを帯びた橙色のインペリアルトパーズは特に高く評価されます。市場に多い青色は、無色の結晶に放射線を当て、加熱して作られたものです。","名の由来には、サンスクリット語で「火」を意味する語に由来するという説と、紅海の島の名に由来するという説があります。11月の誕生石で、友情と希望の象徴です。ブラジルのオウロ・プレットが世界的な産地として知られます。","青色の大半は放射線処理品です。強い衝撃や、急な温度変化は割れの原因になるため避けます。モース硬度の基準鉱物（硬度8）としても知られています。"],
  "アメジスト":["石英（ケイ酸塩鉱物）のうち紫色のもの","SiO2（Feを微量含む）","三方晶系","7","2.65","1.544〜1.553","ブラジル、ウルグアイ、ザンビア、南アフリカ","石英のうち紫色のものです。結晶中の微量の鉄（Fe3+）が、天然の放射線を受けて色中心をつくり、紫に発色します。結晶の先端側ほど色が濃く、色が不均一になりやすい性質があります。加熱すると黄色〜橙色（シトリン）や無色に変わるため、市場にあるシトリンの多くは加熱されたアメジストです。","名はギリシャ語の「酔わない」に由来し、酒の酔いを防ぐ護符として杯などに用いられました。かつては最高級の宝石のひとつで、ブラジルで大きな鉱床が見つかってから価格が下がりました。2月の誕生石で、心の平穏の象徴です。","長時間の強い日光や高温で退色することがあるため、保管は暗所が向いています。合成アメジストは天然と性質がほぼ同じなので、見分けるには内部の特徴を観察する必要があります。"],
  "ダイヤモンド":["ダイヤモンド（元素鉱物）","C（炭素）","等軸晶系","10","3.52","2.417","ボツワナ、ロシア、カナダ、コンゴ民主共和国、オーストラリア、南アフリカ","炭素だけでできた鉱物で、天然物質では最も硬い（モース硬度10）一方、4方向に劈開があるため衝撃で欠けます。屈折率が高く、白色光を虹色に分ける分散も強いため、ブリリアントカットで強くきらめきます。地下約150km以深の高温高圧下で結晶化し、キンバーライトなどのマグマによって地表近くへ運ばれました。石墨と同じ炭素だけでできていますが、結晶構造が異なるため、性質はまったく違います。","名はギリシャ語の「征服されない」に由来します。18世紀にブラジルで見つかるまで、主な産地はインドでした。現在のブリリアントカットは、1919年に数学者マルセル・トルコウスキーが理論的に示した形が基礎になっています。4月の誕生石で、永遠の絆の象徴です。","熱には強いものの、高温の空気中では燃焼して二酸化炭素になります。油脂をはじく性質が弱く、親油性があるため、汚れが付くと輝きが鈍ります。合成ダイヤモンドは天然と同じ成分・構造で、見分けには専門機器による鑑別が必要です。"],
  "ローズクォーツ":["石英（ケイ酸塩鉱物）のうち淡い桃色のもの","SiO2（Ti、Fe、Mnを微量含む）","三方晶系","7","2.65","1.544〜1.553","ブラジル、マダガスカル、インド、南アフリカ","石英のうち淡い桃色のものです。色の原因は、内部の極めて細かな繊維状の包有物とする説と、微量元素による色中心とする説があり、研究が続いています。透明で結晶面を持つ結晶は稀で、多くは微細な包有物のため乳白色を帯びます。光を当てると、まれに星形の光（アステリズム）が現れます。","古代から、彫刻や装身具に用いられてきた石で、愛やいつくしみの象徴とされます。ブラジルは主要な産地で、大きな塊で産出するため、彫刻にも多く使われます。","強い光に長くさらすと退色することがあります。保管は直射日光を避けます。染色や、加熱による処理品もあります。"],
  "アクアマリン":["ベリル（ケイ酸塩鉱物）のうち青〜青緑色のもの","Be3Al2Si6O18（Fe2+を微量含む）","六方晶系","7.5〜8","2.68〜2.74","1.567〜1.590","ブラジル、ナイジェリア、モザンビーク、パキスタン","ベリルのうち、鉄（Fe2+）によって青〜青緑色になったものです。同じベリルの仲間であるエメラルドと違って、内部が清澄で巨大な結晶が採れるため、大粒の宝石に向きます。原石の黄緑みを、加熱処理で取り除いて青くすることが広く行われています。","名はラテン語の「海水」に由来し、船乗りが航海の安全を祈るお守りにしたとされます。3月の誕生石で、幸福と勇気の象徴です。ブラジルのミナスジェライス州が有名な産地で、巨大な結晶が採れることもあります。","比較的丈夫ですが、強い衝撃は避けます。加熱処理は安定していて、通常の使用では色は変わりません。"],
  "ガーネット":["ガーネット族（ケイ酸塩鉱物）","A3B2(SiO4)3（A＝Ca, Mg, Fe2+, Mn2+ / B＝Al, Fe3+, Cr3+）","等軸晶系","6.5〜7.5","3.5〜4.3","1.72〜1.94（種類による）","インド、マダガスカル、タンザニア、スリランカ、アメリカ","パイロープ、アルマンディン、スペサルティン、グロッシュラー、アンドラダイト、ウバロバイトなど、複数の種が固溶体をつくる鉱物族の総称です。赤い石が有名ですが、緑・橙・黄・紫と、青以外の幅広い色があります。結晶は12面体や24面体になりやすく、劈開がなく丈夫です。","名は、結晶の形と色がザクロの種子に似ることから、ラテン語のザクロに由来します。古代から装身具に使われ、1月の誕生石として、真実と友愛の象徴とされます。硬さを活かして、研磨材（ガーネットペーパー）やウォータージェットにも使われます。","一般に丈夫で、日常使いに向きます。種類によって屈折率や比重が異なるため、鑑別では、これらの測定値が手がかりになります。"],
  "ペリドット":["かんらん石（オリビン）のうち宝石質のもの","(Mg,Fe)2SiO4","直方晶系（斜方晶系）","6.5〜7","3.27〜3.37","1.654〜1.690","エジプト（ザバルガド島）、パキスタン、アメリカ（アリゾナ）、ミャンマー、中国","かんらん石（オリビン）の宝石質のものです。色は鉄を主成分として含むことによる「自色」で、不純物による発色ではありません。複屈折が強く、ファセット面を通して反対側の稜線を見ると、二重に見えることがあります。上部マントルを構成する主要な鉱物で、火山岩に取り込まれて地表へ運ばれるほか、隕石（パラサイト）にも含まれます。","古代エジプトでは、ザバルガド島で採掘され、「太陽の宝石」と呼ばれました。中世ヨーロッパの教会宝物にも見られます。8月の誕生石で、夫婦愛と幸福の象徴です。","酸に弱く、超音波洗浄は避けます。硬度は6.5〜7で、傷がつきやすいため、リングよりもペンダントなどが向きます。"],
  "オパール":["含水非晶質シリカ","SiO2・nH2O（水を3〜21%含む）","非晶質（一部は微結晶）","5.5〜6.5","1.9〜2.3","1.37〜1.47","オーストラリア、エチオピア、メキシコ、ブラジル","非晶質の含水シリカで、水を3〜21%ほど含みます。遊色効果は、色素ではなく構造色です。直径が約150〜400ナノメートルのシリカの球が規則正しく積み重なり、その隙間で光が回折することで、角度に応じて虹色に変わります。乾燥や急な温度変化で、細かなひびが入ることがあります。","オーストラリアが長く産出の大半を占め、近年はエチオピアも重要な産地です。古代ローマでは、最高級の宝石のひとつとされました。10月の誕生石で、希望と創造力の象徴です。","乾燥・急な温度変化・水や油脂を避けます。オパールは水を含むため、長期の乾燥でひび割れることがあり、柔らかい布で保管します。ソリッドと、薄い層を貼り合わせたダブレット・トリプレットがあります。"],
  "カーネリアン":["カルセドニー（微細な石英の集合体）のうち赤橙色のもの","SiO2（酸化鉄を微量含む）","三方晶系（潜晶質）","6.5〜7","2.58〜2.64","1.53〜1.54","インド、ブラジル、ウルグアイ","カルセドニー（微細な石英の集合体）のうち、赤橙色のものです。赤橙色の原因は、微細な酸化鉄（ヘマタイトなど）で、鉄を含む黄褐色の石を加熱して色を深める方法は、古代から知られていました。半透明で、割れ口はなめらかな貝殻状です。","古代エジプトやメソポタミアで、印章やビーズに使われました。封蝋が貼りつきにくいため、ローマ時代の印章指輪に好まれたといわれます。勇気の象徴とされ、古代のお守りとされました。","丈夫で、日常使いに向いています。現在も加熱や染色による色の改良が行われています。"],
  "ターコイズ":["含水銅アルミニウムリン酸塩","CuAl6(PO4)4(OH)8・4H2O","三斜晶系（微晶質）","5〜6","2.6〜2.9","約1.61〜1.65","イラン、アメリカ南西部、中国、エジプト（シナイ半島）、メキシコ","含水銅アルミニウムリン酸塩で、青は銅（Cu2+）、緑みは鉄の混入によります。小さな結晶の集合体で、肉眼で結晶が見えることはほとんどありません。多孔質のため吸水しやすく、母岩の網目が残った「スパイダーウェブ」模様は愛好されます。","イランのニシャプールは、数千年にわたって知られた産地です。ペルシャからトルコ経由でヨーロッパへ伝わったため、「トルコ石」と呼ばれるようになりました。12月の誕生石で、成功と旅のお守りとされます。アメリカ先住民の工芸でも重要な素材です。","多孔質のため、皮脂・化粧品・洗剤で変色することがあります。樹脂含浸などで安定化させた石が多く流通し、着色品や、再生した粉末を固めたものも存在します。"],
  "タンザナイト":["ゾイサイト（灰簾石、ケイ酸塩鉱物）の青紫色のもの","Ca2Al3(SiO4)(Si2O7)O(OH)（V3+を微量含む）","直方晶系（斜方晶系）","6.5〜7","約3.35","1.691〜1.700","タンザニア（メレラニ丘陵）","ゾイサイト（灰簾石）の青紫色のもので、バナジウムによって発色します。見る方向で青・紫・赤褐色と色が変わる強い三色性を持ちます。原石の多くは褐色で、約600℃前後の加熱で鮮やかな青紫に変わります。産地は世界でほぼタンザニアのメレラニ丘陵に限られます。","1967年にタンザニアで発見され、1968年にアメリカの宝飾店が「タンザナイト」と名づけて売り出しました。12月の誕生石で、高貴さと冷静さの象徴です。発見から日が浅い宝石のひとつです。","劈開があり脆いため、強い衝撃は避けます。加熱処理は安定していますが、超音波洗浄は避けるのが無難です。"],
  "シトリン":["石英（ケイ酸塩鉱物）のうち黄色のもの","SiO2（Feを微量含む）","三方晶系","7","2.65","1.544〜1.553","ブラジル、ボリビア、マダガスカル","石英のうち黄色のものです。色の原因は結晶中の微量の鉄です。天然の黄色い石英は稀で、市場にあるシトリンの多くは、アメジストや煙水晶を加熱して黄色にしたものです。加熱品は、結晶の根元に紫が残ることがあります。","名はフランス語でレモンを意味する語に由来します。11月の誕生石で、繁栄と希望の象徴です。古代ギリシャでは装身具やカメオ・インタリオに使われました。","丈夫で扱いやすい石です。強い加熱を受けると、色が変わることがあります。"],
  "ロードクロサイト":["菱マンガン鉱（炭酸塩鉱物）","MnCO3","三方晶系","3.5〜4","3.4〜3.7","1.597〜1.817（複屈折が非常に大きい）","アルゼンチン、ペルー、南アフリカ、アメリカ（コロラド）","菱マンガン鉱という炭酸塩鉱物で、マンガン（Mn2+）に由来する鮮やかなばら色が特徴です。方解石と同じ構造を持ち、3方向に完全な劈開があります。鍾乳石のように成長した結晶を切ると、同心円状の縞模様が現れます。モース硬度は3.5〜4と軟らかい鉱物です。","名はギリシャ語の「バラ」と「色」に由来します。アルゼンチンの国石で、インカローズの名でも知られ、インカの王や女王の血が固まった石という伝承が残ります。アルゼンチンのカタマルカ州にある鉱山が有名です。","軟らかく、酸・熱・衝撃に弱い石です。薄い塩酸で泡を出して溶けるので、取り扱いに注意します。透明な結晶は非常に稀で、コレクター向けです。"],
  "ジェイド（翡翠）":["硬玉（ヒスイ輝石、ケイ酸塩鉱物）を主とする集合体","NaAlSi2O6","単斜晶系","6.5〜7","3.30〜3.38","1.66〜1.68","ミャンマー（カチン州）、日本（新潟県糸魚川・青海）、グアテマラ、ロシア","硬玉（ヒスイ輝石）を主とする集合体です。微細な繊維状の結晶が絡み合っているため、靭性が非常に高く、割れにくい宝石です。鮮やかな緑色はクロムによります。軟玉（ネフライト）は角閃石族の別の鉱物で、見た目が似ているため、同じく「ジェイド」と呼ばれます。","日本では縄文時代に、糸魚川産のヒスイが各地へ流通しており、大珠などの装飾品が出土します。2016年に日本鉱物科学会が国石に選定しました。中国では「玉」として最高位の宝石とされ、ミャンマー産が主に使われます。","酸で漂白して樹脂を含浸させた処理品や、染色品があります。処理の有無で価値が大きく変わるため、鑑別書の確認が大切です。"],
  "オニキス":["カルセドニー（微細な石英の集合体）の縞状のもの","SiO2","三方晶系（潜晶質）","6.5〜7","2.60〜2.65","1.53〜1.54","ブラジル、インド、ウルグアイ、アメリカ","カルセドニーのうち、白と黒などの平行な縞を持つものをオニキスと呼びます。縞が褐色〜白のものはサードニクスです。市場にある黒一色のものは、多くが染色された石です。","名はギリシャ語の「爪」に由来し、キューピッドが爪を切った破片という伝説があります。古代ローマでは、縞を利用して浮き彫りにしたカメオに彫られました。魔除けの石とされます。","丈夫で、日常使いに向いています。染色品は、強い日光で色が変わることがあります。"],
  "ムーンストーン":["長石（ケイ酸塩鉱物）","(K,Na)AlSi3O8","単斜晶系〜三斜晶系","6〜6.5","2.56〜2.59","1.518〜1.526","スリランカ、インド、ミャンマー、マダガスカル","長石の一種で、カリ長石と曹長石が微細な層をつくって混ざっています。この層に光が干渉・散乱して、青白い光が浮かびます。これをアデュラレッセンス（シラー）と呼びます。2方向に完全な劈開があり、割れやすい宝石です。","インドでは聖なる石とされ、月の満ち欠けとの関連が古くから語られてきました。スリランカ産の青く光る石が特に高く評価されます。6月の誕生石で、旅の安全や愛の象徴です。","劈開で欠けやすいため、強い衝撃は避けます。カボションカットにして、光の動きを見せます。"],
  "アレキサンドライト":["クリソベリル（酸化鉱物）の変色種","BeAl2O4（Cr3+を微量含む）","直方晶系（斜方晶系）","8.5","3.71〜3.75","1.746〜1.755","ロシア（ウラル）、スリランカ、ブラジル、インド、タンザニア","クリソベリルの変色種です。クロムによる吸収帯が黄色の光域に強く現れるため、青緑の光が多い昼の太陽光の下では青緑に、赤い光の多い白熱灯の下では赤紫に見えます。これを変色効果と呼びます。天然の宝石質のものは極めて稀です。","1830年代にウラルで発見され、ロシア皇帝アレクサンドル2世にちなんで命名されたと伝えられます。ロシアの帝国の色（赤と緑）を示すとされ、同国で愛されました。6月の誕生石です。","天然品はきわめて希少で、合成品が多く流通します。合成アレキサンドライトの中には、天然と似た変色を示すものがあり、鑑別が重要です。"],
  "ラピスラズリ":["岩石（ラズライトを主成分とし、方解石・黄鉄鉱などを含む）","（Na,Ca）8(AlSiO4)6(S,SO4,Cl)2（ラズライト）","等軸晶系（ラズライト）","5〜5.5","2.7〜2.9","約1.50","アフガニスタン、チリ、ロシア（バイカル湖周辺）、ミャンマー","単一の鉱物ではなく、ラズライトを主成分とし、方解石・黄鉄鉱などを含む岩石です。深い青は、硫黄由来のラジカル（S3−）によります。黄鉄鉱の金色の斑点は、夜空の星に例えられます。","アフガニスタンのサリサング鉱山では、数千年前から採掘されてきました。粉にして顔料「ウルトラマリン」として使われ、ルネサンス期には金より高価とされ、フェルメールの絵にも用いられました。9月の誕生石の仲間で、日本では12月の誕生石にも入ります。","多孔質で、酸や汗に弱い面があります。着色や、樹脂含浸、合成の類似品があり、黄鉄鉱の斑点の有無が見分けの手がかりのひとつです。"],
  "モルガナイト":["ベリル（ケイ酸塩鉱物）のうち桃色のもの","Be3Al2Si6O18（Mnを微量含む）","六方晶系","7.5〜8","2.71〜2.90","1.572〜1.600","ブラジル、マダガスカル、アフガニスタン、モザンビーク","ベリルのうち桃色のものです。マンガンによって、淡いピンクから桜色に発色します。加熱して、黄みを取りピンクを整える処理が一般的です。大粒のきれいな結晶が採れます。","1910年頃に、ニューヨークの宝石収集家J・P・モルガンにちなんで名づけられました。ブラジルとマダガスカルの産地が知られます。愛と安らぎの象徴とされます。","丈夫ですが、強い衝撃は避けます。強い光で退色することがあります。"],
  "フローライト":["蛍石（ハロゲン化物鉱物）","CaF2","等軸晶系","4","3.0〜3.3","1.434","中国、メキシコ、イギリス、アメリカ、ドイツ","蛍石は、八面体の劈開がきわめて明瞭で、結晶を割ると正八面体の破片ができます。紫外線で青紫の蛍光を示すことがあり、「蛍光」を意味する英語は、この鉱物に由来します。屈折率が低く、光学レンズにも使われます。色は、希土類元素や色中心によって、紫・緑・青・黄などさまざまです。","名は、ラテン語の「流れる」に由来し、製錬で金属を溶かしやすくする融剤として使われたことによります。中国やメキシコが主要な産地で、イギリスのブルージョンは特産品として有名です。","軟らかく劈開があるため、傷つきやすく割れやすい石です。日光や熱で退色することがあるため、コレクションや置物に向きます。"],
  "ラブラドライト":["斜長石（ケイ酸塩鉱物）のうち中間組成のもの","(Ca,Na)(Al,Si)4O8","三斜晶系","6〜6.5","2.68〜2.72","1.559〜1.570","カナダ（ラブラドル半島）、フィンランド、マダガスカル","斜長石の中間的な組成のもので、内部に微細な層状構造があります。光が干渉して、角度によって青や金に光り、これをラブラドレッセンスと呼びます。2方向に劈開があります。光る方向を探して、カットします。","1770年に、カナダのラブラドル半島で、モラヴィア教会の宣教師によって見出されたとされます。イヌイットの間では、オーロラが石に閉じ込められたという伝承があります。フィンランド産のスペクトロライトは、特に鮮やかです。","劈開があり、強い衝撃は避けます。"],
  "ツァボライト":["グロッシュラーガーネット（ケイ酸塩鉱物）の緑色のもの","Ca3Al2(SiO4)3（V3+、Cr3+を微量含む）","等軸晶系","7〜7.5","3.57〜3.70","1.740〜1.744","ケニア、タンザニア","グロッシュラーガーネットの緑色のもので、バナジウムやクロムによって発色します。屈折率が高く、エメラルドより内部が清澄な石が採れます。大きな結晶は稀で、小粒のものが多く流通します。","1960年代末にケニア・タンザニア国境付近で発見され、アメリカの宝飾店が名づけました。ケニアのツァボ国立公園近くに由来する名です。1月の誕生石の仲間です。","劈開がなく、丈夫です。"],
  "サンストーン":["長石（ケイ酸塩鉱物）","(Na,Ca)(Al,Si)4O8","三斜晶系","6〜6.5","2.62〜2.65","1.525〜1.548","アメリカ（オレゴン）、インド、タンザニア、ノルウェー","長石の仲間で、内部に整列した微小な板状結晶が光を反射し、金属のようなきらめきを放ちます。この現象をアベンチュレッセンスと呼びます。インド産などでは赤鉄鉱や針鉄鉱の薄片が、アメリカのオレゴン産では自然銅の微小な板が原因です。オレゴン産はラブラドライトに近い組成の斜長石で、銅の量によって、淡い黄色から橙、赤、緑までさまざまな色を示します。","オレゴン州の州の宝石に指定されています。古くから、太陽の力を宿す石とされ、活力や前向きさを象徴します。8月の誕生石として挙げられることもあります。","劈開があり、強い衝撃は避けます。オレゴン産の鮮やかな赤や緑の石では、拡散処理（銅を加熱して浸透させる処理）を施した石が流通した例があり、天然かどうかの確認が重要です。"],
  "スギライト":["スギライト（ケイ酸塩鉱物）","KNa2(Fe,Mn,Al)2Li3Si12O30","六方晶系","5.5〜6.5","2.74〜2.80","1.607〜1.610","南アフリカ（ウェッセルズ鉱山）、日本（愛媛県岩城島）","KNa2(Fe,Mn,Al)2Li3Si12O30という複雑な組成を持つ、リチウムを含むケイ酸塩鉱物です。紫色は、三価のマンガンによります。南アフリカ北ケープ州のウェッセルズ鉱山などのマンガン鉱床から、半透明で鮮やかな紫色の良質な石が産出し、宝石として評価されます。","1944年に、愛媛県の岩城島で、地質学者の杉健一博士が見出したのが最初とされます。発見の後、1976年に新鉱物として記載され、発見者にちなんでスギライトと名づけられました。日本で見出された鉱物が宝石として世界に広まった、珍しい例です。","日光や熱で色が変わることがあります。多孔質で、水や汗にも弱いため、保管は直射日光を避け、柔らかい布で包みます。染色品や樹脂処理品があります。"],
  "ラリマー":["ペクトライト（ケイ酸塩鉱物）の青色のもの","NaCa2Si3O8(OH)","三斜晶系","4.5〜5","2.74〜2.88","1.595〜1.645","ドミニカ共和国（バオルコ）","ペクトライト（ソーダ石灰輝石）の青色のもので、銅が置き換わることで、カリブ海の浅瀬のような青になります。白い網目状の模様が入ることが多く、波や空を連想させます。この青いペクトライトは、世界でドミニカ共和国のバオルコ地方にほぼ限られます。","1974年に、発見者の1人ミゲル・メンデスが、娘ラリッサの名と、スペイン語の「海」を合わせて命名しました。もともと地元の人々はその存在を知っていましたが、宝石として広く知られるようになったのは20世紀後半です。","モース硬度は4.5〜5と比較的軟らかく、熱や水、汗に弱い石です。高温や急な温度変化で色が褪せることがあるため、着用後は柔らかい布で拭いて保管します。"],
  "パライバトルマリン":["エルバイト（リチア電気石、ケイ酸塩鉱物）","Na(Li,Al)3Al6(BO3)3Si6O18(OH)4（Cuを含む）","三方晶系","7〜7.5","約3.06","1.62〜1.64","ブラジル（パライバ州）、ナイジェリア、モザンビーク","エルバイト（リチア電気石）のうち、銅（Cu2+）とマンガンを含み、ネオンのような鮮やかな青や緑に光るものです。銅を含むトルマリンは極めて珍しく、希少です。ブラジルのパライバ州産が名の由来ですが、のちにナイジェリアやモザンビークでも銅を含むトルマリンが見つかり、これらもパライバトルマリンとして扱われることがあります。","1989年に、ブラジルのパライバ州サン・ジョゼ・ダ・バタリャで、鉱山技師エイトール・ディマス・バルボーザが発見したとされます。鮮烈な色合いは宝石市場に衝撃を与え、大粒の石は非常に高価です。","熱処理で発色を高めた石が多く流通します。産地による含有元素の違いを調べる、専門機関の鑑別書を取るのが一般的です。内部に割れが多いものがあるので、強い衝撃は避けます。"],
  "スフェーン":["チタナイト（ケイ酸塩鉱物）","CaTiSiO5","単斜晶系","5〜5.5","3.52〜3.54","1.843〜1.950","マダガスカル、ブラジル、パキスタン、メキシコ","チタナイトという鉱物の宝石名で、CaTiSiO5の組成を持ちます。分散が0.051とダイヤモンドよりも高く、強い虹色の輝き（ファイア）を示します。複屈折も大きく、多色性もあるため、見る方向で色の見え方が変わります。名はギリシャ語の「くさび」に由来し、結晶の形を表します。","コレクター向けの宝石で、市場に出る数は多くありません。緑・黄・橙・褐色のものがあり、マダガスカルやパキスタンなどから、大粒の結晶が産出します。","硬度が5〜5.5と低く、傷つきやすい石です。リングよりも、イヤリングやペンダントに向きます。"],
  "スピネル":["スピネル（酸化鉱物）","MgAl2O4","等軸晶系","8","3.58〜3.61","1.712〜1.762","ミャンマー、スリランカ、ベトナム、タジキスタン","MgAl2O4の組成を持つ酸化鉱物です。等軸晶系で、多色性や複屈折はありません。発色はクロム（赤）やコバルト（青）、鉄などによります。赤・ピンク・青・紫など、鮮やかな色があります。天然の色は、そのまま使われることが多く、処理されないものが比較的多い石です。","長くルビーと混同されてきました。イギリス王室の王冠にある「黒太子のルビー」や、「ティムール・ルビー」は、実は赤いスピネルです。ミャンマーのモゴックやタジキスタンのコーヒスタンが、古くからの産地です。","丈夫で扱いやすい石です。近年は、天然の無処理スピネルの人気が高まっています。合成スピネルも存在するので、購入時は鑑別書を確認します。"],
  "ブラッドストーン":["カルセドニー（微細な石英の集合体）","SiO2（緑泥石などを含む）","三方晶系（潜晶質）","6.5〜7","2.58〜2.64","1.53〜1.54","インド、ブラジル、オーストラリア","カルセドニーのうち、緑色の地に赤い斑点が散らばるものです。緑は緑泥石などの微細な鉱物、赤い斑点は赤鉄鉱や赤色のジャスパーによります。別名ヘリオトロープで、ギリシャ語の「太陽」と「向きを変える」に由来します。","イエスの磔刑の血が、足元の緑の石に染み込んだという伝承があり、キリスト教の聖遺物の彫刻に使われました。3月の誕生石の伝統的な石で、勇気や健康の象徴とされます。インドが主要な産地です。","丈夫で扱いやすい石です。染色された類似品があるため、赤い斑点が自然なものかを確認します。"],
  "タイガーアイ":["石英（ケイ酸塩鉱物）","SiO2","三方晶系","6.5〜7","2.64〜2.71","約1.54","南アフリカ、オーストラリア、インド","石英のうち、金色〜褐色の絹のような光の筋（シャトヤンシー）を示すものです。青石綿（クロシドライト）の繊維が、石英に置き換わった石で、もとの繊維の並びが残るために、光の筋が現れます。黄褐色は、鉄が酸化したためで、酸化する前の青いものは「ホークスアイ」と呼ばれます。","南アフリカのグリクワランド西部が主要な産地で、ホークスアイと混ざったものもあります。古代ローマの兵士が、身を守るお守りとして身につけたという伝承があります。","丈夫ですが、強い光で退色することがあります。加熱で赤みを帯びた石や、染色された石もあります。"],
  "ソーダライト":["ソーダライト（準長石）","Na8Al6Si6O24Cl2","等軸晶系","5.5〜6","2.27〜2.33","1.483〜1.487","カナダ、ブラジル、ナミビア、インド","Na8Al6Si6O24Cl2の組成を持つ、塩素を含む準長石です。籠のような構造（ソーダライト構造）を持ち、ゼオライトに似た骨格を作ります。ラピスラズリに似ますが、黄鉄鉱をほとんど含まず、白い方解石の筋が入るのが見分けの手がかりです。","名はナトリウム（ソーダ）を多く含むことに由来します。カナダのオンタリオ州産の濃い青の石が有名で、建築用の装飾石や彫刻にも使われます。","劈開があるため、強い衝撃は避けます。"],
  "アパタイト":["アパタイト（リン酸塩鉱物）","Ca5(PO4)3(F,Cl,OH)","六方晶系","5","3.16〜3.23","1.629〜1.667","メキシコ、ブラジル、ミャンマー、マダガスカル","Ca5(PO4)3(F,Cl,OH)の組成を持つリン酸塩鉱物です。歯や骨の主成分は、水酸アパタイトに近い生体鉱物です。モース硬度5の基準鉱物で、リン肥料の原料でもあります。名はギリシャ語の「欺く」に由来し、他の鉱物と間違えやすいことから名づけられました。","ベリル、トルマリン、ペリドットなどと間違われてきた歴史があります。鮮やかな青緑のものは、ネオンアパタイトとも呼ばれ、ブラジルやマダガスカルなどから産出します。","軟らかく傷つきやすいため、ペンダントやイヤリングなど、擦れにくい用途に向きます。"],
  "カルセドニー":["微細な石英の集合体（潜晶質石英）","SiO2","三方晶系（潜晶質）","6.5〜7","2.57〜2.64","1.530〜1.539","ブラジル、インド、アイスランド、ナミビア","微細な石英の集合体（潜晶質石英）です。数十ナノメートルから数マイクロメートルの、繊維状の石英が集まっています。岩石の空洞に、低温のシリカを含む溶液から沈殿してできます。瑪瑙、カーネリアン、クリソプレーズなどの総称でもあり、単色で縞のないものを、狭い意味でのカルセドニーと呼びます。","名は、小アジアの古代都市カルケドンに由来するとされます。古代から、彫刻、印章、ビーズに使われ、染色によって色を整える技術も古くから発達しました。","丈夫で傷つきにくく、日常使いに向きます。染色された石は、強い日光で色が変わることがあります。"],
  "ベニトアイト":["ベニトアイト（ケイ酸塩鉱物）","BaTiSi3O9","六方晶系","6〜6.5","3.64〜3.67","1.757〜1.804","アメリカ（カリフォルニア州サンベニト郡）","BaTiSi3O9の組成を持つ、バリウムとチタンのケイ酸塩鉱物です。強い多色性があり、見る方向で無色から青に変わります。短波長の紫外線を当てると、青白い蛍光を示します。宝石質の産地が、アメリカのカリフォルニア州のサンベニト郡にほぼ限られ、きわめて希少です。","1907年にカリフォルニア州で発見され、1985年に州の宝石に指定されました。発見当初は、サファイアと間違われたと伝えられます。","希少なため、小粒のものが多く流通します。コレクター向けの石です。"],
  "グランディディエライト":["グランディディエライト（ホウケイ酸塩鉱物）","(Mg,Fe2+)Al3(SiO4)(BO3)O2","直方晶系（斜方晶系）","7.5","約2.85〜3.00","約1.590〜1.639","マダガスカル、スリランカ","(Mg,Fe2+)Al3(SiO4)(BO3)O2の組成を持つ、ホウ素を含むケイ酸塩鉱物です。青緑色で、強い三色性があり、見る方向で青緑・緑・無色に変わります。宝石質のものは、非常に希少です。","1902年に、フランスの鉱物学者アルフレッド・ラクロワが、マダガスカルで見つけた鉱物に、探検家アルフレッド・グランディディエの名を付けました。","希少品のため、扱いは慎重にします。強い衝撃や急な温度変化は避けます。"],
  "ペインタイト":["ペインタイト（ホウ酸塩鉱物）","CaZrBAl9O18","六方晶系","8","約4.0","1.787〜1.816","ミャンマー（モゴック）","CaZrBAl9O18の組成を持つ、ジルコニウムとホウ素を含む珍しい鉱物です。赤褐色で、六角柱状の結晶になります。ジルコニウムを含む宝石は他にほとんどなく、化学的にも特異です。","1950年代に、イギリスの鉱物商アーサー・ペインが、ミャンマーで見つけてその名が付きました。長い間、世界に数個しか知られず、「最も希少な宝石」としてギネス記録にも載りましたが、2000年代以降の新産出で数は増えました。","希少なため、研究・収集の対象です。丈夫ですが、紛失や衝撃に注意します。"],
  "マスグレイバイト":["マスグレイバイト（酸化鉱物）","BeMg2Al6O12","三方晶系","8〜8.5","3.60〜3.69","約1.71〜1.74","ミャンマー、スリランカ","BeMg2Al6O12の組成を持つ、ベリリウムとマグネシウムとアルミニウムの酸化物で、灰緑〜紫色を示します。宝石質のものは、世界でごく少数しか知られていません。タフェアイトと近縁の鉱物です。","1967年に、南オーストラリアのマスグレイブ山脈で記載されたことが、名の由来です。宝石質のものは、後にスリランカやミャンマーなどで見つかっています。","希少で小粒のものが多く、収集向けの石です。丈夫ですが、紛失や衝撃に注意してください。"],
  "ジルコン":["ジルコン（ケイ酸塩鉱物）","ZrSiO4","正方晶系","6.5〜7.5","3.9〜4.7","1.925〜1.984（低型は約1.78）","スリランカ、カンボジア、ミャンマー、オーストラリア","ZrSiO4の組成を持つケイ酸塩鉱物で、ウランやトリウムを微量に含みます。放射壊変によって結晶構造が壊れる（メタミクト化）ことがあり、その程度で性質が変わります。U-Pb法による年代測定に使われ、西オーストラリアのジャック・ヒルズで見つかったジルコンは、約44億年前のもので、地球上で最古級の物質です。","12月の誕生石で、純粋さの象徴とされます。無色のジルコンは、古くはダイヤモンドの代用品として使われました。スリランカやカンボジアが主な産地です。キュービックジルコニア（人工のジルコニウム酸化物）とは別物です。","脆く、稜線が欠けやすい石です。青や無色は、加熱処理で作られます。"],
  "アイオライト":["菫青石（コーディエライト、ケイ酸塩鉱物）","Mg2Al4Si5O18（Feを含む）","直方晶系（斜方晶系）","7〜7.5","2.58〜2.66","1.53〜1.55","インド、スリランカ、ミャンマー、マダガスカル、ブラジル","菫青石（コーディエライト）の宝石名で、Mg2Al4Si5O18を基本とします。方向によって青紫・黄灰・無色と色が変わる、強い三色性を持ちます。名はギリシャ語の「すみれ色の石」に由来します。","バイキングが、偏光を利用して太陽の方向を知る道具に使ったという説がありますが、あくまで仮説です。インドやスリランカ、ミャンマーなどが主な産地です。","劈開があり、強い衝撃で割れることがあります。多色性が強いので、カットの向きで色が大きく変わります。"],
  "マラカイト":["孔雀石（炭酸塩鉱物）","Cu2CO3(OH)2","単斜晶系","3.5〜4","3.6〜4.05","1.655〜1.909","コンゴ民主共和国、ロシア（ウラル）、ザンビア、アメリカ（アリゾナ）","Cu2CO3(OH)2の組成を持つ炭酸塩鉱物で、銅鉱床の酸化帯でできる二次鉱物です。同心円状の縞模様を示し、塩酸で泡を出して溶けます。藍銅鉱（アズライト）とともに産することが多く、青と緑の対比が美しい石です。","粉末は古代から、顔料（孔雀石緑）や、古代エジプトのアイシャドウに使われました。ウラル山脈で産した大きな塊は、ロシア宮殿の装飾に使われたことでも知られます。","軟らかく、酸や熱に弱い石です。研磨時の粉は、吸い込まないよう注意します。"],
  "ロードライトガーネット":["ガーネット族（ケイ酸塩鉱物）のうちパイロープとアルマンディンの中間","(Mg,Fe)3Al2(SiO4)3","等軸晶系","7〜7.5","3.7〜3.9","1.74〜1.76","タンザニア、スリランカ、ジンバブエ、アメリカ（ノースカロライナ）","パイロープとアルマンディンの中間組成のガーネットで、バラ色を帯びた赤紫色が特徴です。名はギリシャ語の「バラ」に由来します。屈折率が高く、透明度の良い石が多く採れます。","19世紀末に、アメリカのノースカロライナ州で見つかったバラ色のガーネットが、この名で呼ばれるようになりました。タンザニアやスリランカが主な産地です。","劈開がなく、丈夫です。"],
  "セレスタイト":["天青石（硫酸塩鉱物）","SrSO4","直方晶系（斜方晶系）","3〜3.5","3.95〜3.97","1.622〜1.631","マダガスカル、アメリカ（ミシガン）、リビア、ポーランド","SrSO4の組成を持つ硫酸塩鉱物で、淡い青の結晶が特徴です。ストロンチウムは、炎色反応で鮮やかな赤色を示すため、花火や発煙筒の原料に使われます。名はラテン語の「天空の」に由来します。","大きな晶洞の中に、淡い青の結晶がびっしり育ったものが、マダガスカルなどから産出します。そのやさしい色合いから、安らぎの石として親しまれています。","軟らかく、劈開で割れやすい石です。熱や日光で退色することがあります。"],
  "ジャスパー":["不透明な潜晶質石英","SiO2（酸化鉄などを含む）","三方晶系（潜晶質）","6.5〜7","2.5〜2.9","約1.54","世界各地","不透明な潜晶質石英で、酸化鉄などの不純物を多く含みます。赤・黄・緑・茶と、色や模様がさまざまです。石英の微細な結晶が集まってできていて、割れ口はなめらかな貝殻状です。","古代から、印章や護符の材料として使われ、聖書にもその名が見えます。産地や模様によって、さまざまな名前の石が知られています。","丈夫で傷つきにくい石です。多孔質のものは汚れが入り込みやすいので、洗剤の使用は避けます。"],
  "アメトリン":["石英（ケイ酸塩鉱物）","SiO2（Feを含む）","三方晶系","7","2.65","1.544〜1.553","ボリビア（アナヒ鉱山）","石英のうち、1つの結晶の中に、アメジストの紫とシトリンの黄色の領域が共存するものです。色の分かれ方は、結晶の成長方向による鉄の取り込みの差によると考えられています。主要な産地は、ボリビアのアナヒ鉱山です。","17世紀に、ボリビアの鉱山が、スペインの王妃への贈り物として紹介されたという話が伝わります。","丈夫ですが、加熱で色が変わります。"],
  "パイライト":["黄鉄鉱（硫化鉱物）","FeS2","等軸晶系","6〜6.5","4.95〜5.10","不透明","スペイン、ペルー、イタリア（エルバ島）、アメリカ","FeS2の組成を持つ硫化鉱物で、立方体や五角十二面体の結晶になります。金色の金属光沢から「愚者の金」と呼ばれますが、金より硬く、もろいことで区別できます。名はギリシャ語の「火」に由来し、鉄とたたくと火花が出ます。","古代には、火打石として使われました。スペインのナバフンで産出する、立方体の整った結晶は、コレクターに愛されます。","湿気の多い環境で分解し、硫酸を生じて劣化する、黄鉄鉱病が起こることがあります。保管は乾燥した環境で行います。"],
  "カイヤナイト":["藍晶石（ケイ酸塩鉱物）","Al2SiO5","三斜晶系","4〜5（長軸方向）、6.5〜7（幅方向）","3.53〜3.68","1.710〜1.734","ブラジル、ネパール、ミャンマー、ケニア","Al2SiO5の組成を持つケイ酸塩鉱物で、結晶の方向によって硬さが大きく違う、特異な鉱物です。長軸方向の硬度は4〜5ですが、幅方向では6.5〜7あります。アンダルサイト、シリマナイトと同じ組成で、結晶構造が違う多形の関係にあり、泥質の変成岩の高圧条件の指標になります。","名はギリシャ語の「濃い青」に由来します。ネパールやブラジルが主要な産地です。","劈開があり、硬さに方向性があるため、加工が難しい石です。"],
  "コーラル（珊瑚）":["有機宝石（宝石サンゴの骨軸）","CaCO3（高マグネシウム方解石）と有機質","三方晶系（微結晶）","3〜4","2.6〜2.7","約1.49〜1.66","日本（土佐湾・小笠原）、地中海、台湾","宝石になるサンゴは、深海に棲む八放サンゴで、その骨軸を使います。主成分はCaCO3（高マグネシウム方解石）と有機質で、酸で泡を出して溶けます。赤・ピンク・白など、色はさまざまです。","日本は宝石サンゴの主要な産地・加工地で、土佐湾や小笠原近海で採れます。古代ローマの時代から、魔除けとされてきました。3月の誕生石です。","酸・汗・化粧品に弱い石です。着色や、樹脂含浸の処理品、プラスチックやガラスの類似品があります。"],
  "チャロアイト":["チャロアイト（ケイ酸塩鉱物）","K(Ca,Na)2Si4O10(OH,F)・H2O","単斜晶系","5〜5.5","2.5〜2.78","1.550〜1.559","ロシア（サハ共和国、チャロ川流域）","K(Ca,Na)2Si4O10(OH,F)・H2Oの組成を持つケイ酸塩鉱物で、紫色の渦巻き模様や繊維状の組織が特徴です。色はマンガンによります。世界でほぼ一か所の産地、ロシアのサハ共和国に限られます。","1940年代に発見され、1978年に新鉱物として承認されました。名は、産地のチャロ川に由来します。","日光で色が薄くなることがあります。"],
  "プレナイト":["ぶどう石（ケイ酸塩鉱物）","Ca2Al2Si3O10(OH)2","直方晶系（斜方晶系）","6〜6.5","2.80〜2.95","1.610〜1.646","南アフリカ、オーストラリア、中国、マリ","Ca2Al2Si3O10(OH)2の組成を持つケイ酸塩鉱物で、玄武岩の空洞（晶洞）に産し、淡い緑色のぶどうの房のような形になります。低温の変成条件を示す鉱物です。","18世紀のオランダ軍人ヘンドリック・フォン・プレーン大佐が、南アフリカで見つけたことにちなむ名です。人名にちなんで命名された、初期の鉱物のひとつとされます。","劈開があり、衝撃を避けます。"],
  "ジェット":["亜炭（褐炭）の一種","有機物（炭素主体）","非晶質","2.5〜4","1.30〜1.34","約1.66","イギリス（ウィットビー）、スペイン、アメリカ","亜炭（褐炭）の一種で、ジュラ紀の流木が化石化した有機質の宝石です。軽く、擦ると静電気を帯びます。有機物なので、結晶構造は持たず、非晶質です。","イギリスのヴィクトリア女王が、夫アルバート公の死後に、ウィットビー産ジェットの喪の装身具を身につけたことで流行しました。","軟らかく、傷つきやすい石です。プラスチックやガラスの類似品が多く、熱した針を当てて石炭のような臭いがするかで確認することもあります。"],
  "パパラチアサファイア":["コランダム（酸化鉱物）","Al2O3（Cr、Feを含む）","三方晶系","9","約4.00","1.762〜1.770","スリランカ、マダガスカル、ベトナム、タンザニア","コランダムのうち、蓮の花のような、オレンジがかったピンクのものです。クロム（ピンク〜赤）と鉄（黄）の組み合わせによって生じます。名はシンハラ語の「蓮の花の色」に由来します。","もともとスリランカ産の石を指す名称でしたが、現在は産地を問わず色によって呼ぶことがあり、鑑別機関の基準も異なります。天然で未処理のものは極めて稀です。","鑑別書で、産地と処理の有無の記載を確認します。"],
  "ユークレース":["ユークレース（ケイ酸塩鉱物）","BeAl(SiO4)(OH)","単斜晶系","7.5","3.05〜3.10","1.652〜1.671","ブラジル、ジンバブエ、タンザニア、コロンビア","BeAl(SiO4)(OH)の組成を持つケイ酸塩鉱物で、一方向に完全な劈開があり、硬いのに脆い石です。名はギリシャ語の「良い」と「割れる」に由来し、「割れやすい」という意味を持ちます。","加工が難しく、コレクター向けの希少な宝石です。ブラジルのオーロ・プレットが有名な産地です。","着用には向かず、取り扱いには注意が必要です。"],
  "アンバー（琥珀）":["樹脂が化石化した有機物","有機高分子（C10H16Oなどを主成分とする）","非晶質","2〜2.5","1.05〜1.10","約1.54","バルト海沿岸（ポーランド、ロシア）、ドミニカ共和国、ミャンマー、日本（岩手県久慈）","樹脂が化石化した有機物で、非晶質です。バルト海産の琥珀は、約4000万年前の樹脂が化石化したものです。中に昆虫や植物が閉じ込められることがあり、飽和食塩水に浮かびます。","擦ると静電気が起きることから、電気を意味する言葉は琥珀を意味するギリシャ語に由来します。バルト海沿岸は古代から交易路（琥珀の道）で知られます。","軟らかく、有機溶剤や熱に弱い石です。プラスチックや、再生琥珀の類似品があるため、見分けには専門家の鑑別が必要です。"],
  "クンツァイト":["スポジュメン（リシア輝石、ケイ酸塩鉱物）のうちピンク〜紫のもの","LiAlSi2O6（Mn3+を含む）","単斜晶系","6.5〜7","3.16〜3.20","1.660〜1.676","アフガニスタン、ブラジル、アメリカ（カリフォルニア）、マダガスカル","スポジュメン（リシア輝石）のうち、ピンク〜紫のものです。強い多色性があり、紫外線で蛍光します。劈開が2方向に明瞭で脆く、光にさらすと退色します。","1903年に、宝石学者ジョージ・クンツにちなんで名づけられました。アメリカのカリフォルニア州で最初に発見されたとされます。","光で退色し、衝撃で割れやすい石です。保管は、暗所が向いています。"],
  "アマゾナイト":["微斜長石（ケイ酸塩鉱物）","KAlSi3O8","三斜晶系","6〜6.5","2.55〜2.58","1.522〜1.530","ロシア（ミアスク）、アメリカ（コロラド）、ブラジル、マダガスカル","微斜長石の緑〜青緑色のもので、KAlSi3O8の組成を持ちます。青緑は、微量の鉛と水の存在によると考えられています。格子状の双晶によって、緑と白の細かな縞が現れます。","名はアマゾン川に由来しますが、その流域での産出は確認されていません。ロシアのミアスクやアメリカのコロラド州が、有名な産地です。","劈開があり、強い衝撃は避けます。"],

// 化学式から元素記号を出現順に取り出す（数字・括弧・電荷表記は読み飛ばす）
function elementsOf(f){
  const out = [], seen = new Set();
  (f.match(/[A-Z][a-z]?/g) || []).forEach(t => {
    const s = ELEM_NAME[t] ? t : (ELEM_NAME[t[0]] ? t[0] : null);
    if(s && !seen.has(s)){ seen.add(s); out.push(s); }
  });
  return out;
}
// 化学式の数字を下付き文字に（Mg2SiO4 → Mg₂SiO₄）。電荷（Fe2+ など）は誤変換を避けるため触らない。
function prettyFormula(f){
  const sub = '₀₁₂₃₄₅₆₇₈₉';
  return f.replace(/([A-Za-z\)\]])(\d+)(?![\d+\-]|\+|−)/g, (m, a, n) => a + n.replace(/\d/g, d => sub[d]));
}

// 鉱物（厳選80種以外）の解説を、化学式・区分・分類から組み立てる。{formula, els, paras, notes}
function mineralFacts(id){
  const k = id - CURATED, m = MINERALS[k], name = m[0], f = m[1], st = m[2], gi = m[3];
  const els = elementsOf(f), paras = [], notes = [];
  if(f){
    const names = els.slice(0, 8).map(e => ELEM_NAME[e]).join('・') + (els.length > 8 ? ' ほか' : '');
    paras.push(`${els.length}種類の元素（${names}）からなる鉱物です。`);
  }
  paras.push(CLASS_ESSAY[gi] || CLASS_ESSAY[11]);
  const fl = [];
  if(/OH/.test(f)) fl.push('化学式に水酸基（OH）を含み、水に関わる環境でできた鉱物と考えられます。');
  if(/H2O/.test(f)) fl.push('結晶水（H2O）を含む水和鉱物で、加熱や乾燥で水を失うと、構造が変わったり、崩れたりすることがあります。');
  if(/-\((Ce|La|Nd|Y|Yb|Dy|Sm|Gd|Pr|Eu|Er|Ho|Lu|Tb|Tm)\)/.test(name) || els.some(e => RARE_EARTH.has(e)))
    fl.push('希土類（レアアース）元素を含みます。名前の末尾の「-(Ce)」のような表記は、レビンソン接尾辞といい、その鉱物で最も多い希土類元素を表すルールです。');
  if(els.some(e => RADIOACTIVE.has(e))) notes.push('ウランやトリウムなどの放射性元素を含み、微量の放射線を出します。収集や保管には、適切な管理が必要です。');
  if(els.some(e => TOXIC.has(e))) notes.push('ヒ素・鉛・水銀・タリウム・カドミウム・ベリリウムなどの有害な元素を含みます。粉末の吸入や、口に入れることは避けてください。');
  paras.push(...fl);
  return {formula:f, els, paras, notes, status:STATUS_TEXT[st] || '', genre:GENRES[gi].name};
}

// localStorage の読み・書き・削除。プライベートモード等で例外が出ても止まらないよう、すべて try/catch で包む。
function rawGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function rawSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function rawDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const accounts = (() => {
  let a = null;
  try{ a = JSON.parse(rawGet(ACC_KEY)); }catch(e){}
  if(!a || !Array.isArray(a.list) || !a.list.length || !a.list.every(x => x && typeof x.id === 'string' && /^[a-z0-9]+$/.test(x.id))){
    a = {list:[{id:'a1', name:'PLAYER'}], current:'a1'};
    DATA_KEYS.forEach(k => { const v = rawGet('lumina_' + k); if(v !== null){ rawSet(acKey('a1', k), v); rawDel('lumina_' + k); } });   // 旧バージョンの記録を引き継ぐ
    rawSet(ACC_KEY, JSON.stringify(a));

})();

  const r = {open:[], plays:{}, best:{}, perfectG:[], rounds:0, total:0, right:0, streak:0, bestStreak:0, perfect:0, fast:0, hardBest:0, survBest:0};
  if(!o || typeof o !== 'object' || Array.isArray(o)) return r;
  ['rounds','total','right','streak','bestStreak','perfect','fast','hardBest','survBest'].forEach(k => { if(Number.isFinite(o[k]) && o[k] >= 0) r[k] = Math.min(Math.floor(o[k]), 999999); });

/* Web Audio API による効果音とBGM。音は外部ファイルを使わず、オシレーターとノイズで合成する。
   ブラウザの制限で、最初のタップ（audio.init）があるまで音は鳴らない。 */
/* ---------- 音響 ---------- */
// 音を扱うクラス。効果音（触れる・注ぐ・完成のハープ）と、BGM（バイノーラルビート + ピンクノイズ + ときどきのチャイム）を持つ。
class AudioEngine{
  constructor(){ this.ctx=null; this.bgmEnabled=false; this.sfxEnabled=true; this.scale=REALMS[0].scale; this.base=[216,226]; this.bgm=null; this.timer=null; this.xs=null; }   // xs = エクストラ用の音の設定（null なら通常の音）
  // AudioContext を用意する（無ければ作成、停止中なら再開）。使えない環境では false を返す。
  init(){
    if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false; this.ctx = new AC(); }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  }
  // 対応端末では短く振動させる
  vibrate(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
  // 1音を鳴らす：周波数・最大音量・長さ・波形。slideTo を指定すると、その周波数へ滑らかに変化する。残響にも送る。
  tone(freq, peak, dur, type='sine', slideTo){
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + 0.12);
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    const rv = this.reverb(); if(rv) g.connect(rv);
    o.start(t); o.stop(t + dur);
  }
  // 残響（コンボルバー）を最初の1回だけ作る。減衰するノイズをインパルス応答にして、やわらかな響きにする。
  reverb(){
    if(this._rv !== undefined) return this._rv;
    try{
      const c = this.ctx, len = Math.floor(c.sampleRate * 2.8), ir = c.createBuffer(2, len, c.sampleRate);
      for(let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for(let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
      const cv = c.createConvolver(); cv.buffer = ir;
      const w = c.createGain(); w.gain.value = .35; cv.connect(w); w.connect(c.destination);
      this._rv = cv;
    }catch(e){ this._rv = null; }
    return this._rv;
  }
  // 宝石に触れたときの音
  playGemTouch(){ if(!this.sfxEnabled || !this.init()) return; this.vibrate(8); if(this.xs) return this.xplay('touch'); this.tone(this.scale[3]*2, .12, .6); }
  // 宝石を移したときの音
  playLiquidPour(){ if(!this.sfxEnabled || !this.init()) return; this.vibrate(15); if(this.xs) return this.xplay('pour'); this.tone(this.scale[0], .1, .3, 'sine', this.scale[2]); }
  // 瓶が完成したときの、上昇するハープ風の和音
  playCompleteHarp(){
    if(!this.sfxEnabled || !this.init()) return;
    this.vibrate([20,30,20]);
    if(this.xs) return this.xplay('harp');
    [0,3,4,7].forEach((n,i)=> setTimeout(()=> this.tone(this.scale[n], .08, 1.2), i*70));
  }
  // エクストラの効果音：[波形, 音階の番号, 周波数の倍率, 音量, 長さ(秒), 遅れ(ms), 滑らせる倍率] の並びを鳴らす
  xplay(kind){
    const sp = this.xs && this.xs.sfx[kind]; if(!sp) return;
    sp.forEach(([w, i, mul, pk, dur, dl, sl]) => {
      const f = this.scale[i % this.scale.length] * mul, go = () => { if(this.ctx) this.tone(f, pk, dur, w, sl ? f * sl : undefined); };
      dl ? setTimeout(go, dl) : go();
    });
  }
  // 幻の石を手に入れたときのファンファーレ（エクストラの音の設定があればそれを使う）
  playStoneGet(){
    if(!this.sfxEnabled || !this.init()) return;
    this.vibrate([30, 40, 30, 40, 60]);
    if(this.xs) return this.xplay('get');
    [0,2,4,7,4,7,9].forEach((n, i) => setTimeout(() => this.tone(this.scale[n % this.scale.length] * 2, .09, 1.4), i * 110));
  }
  // BGMのオン/オフを切り替え、切り替え後の状態を返す
  toggleBGM(){
    if(!this.init()) return false;
    this.bgmEnabled = !this.bgmEnabled;
    this.bgmEnabled ? this.startBGM() : this.stopBGM();
    return this.bgmEnabled;
  }
  // ピンクノイズ（高音ほど小さい、雨音に近い音）を2秒分つくり、ループ再生するノードを返す
  pinkNoise(){
    const size = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate), out = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<size;i++){
      const w = Math.random()*2-1;
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852;
      b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898;
      out[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.015; b6=w*.115926;
    }
    const n = this.ctx.createBufferSource(); n.buffer = buf; n.loop = true; return n;
  }
  // BGM開始：左右の耳へ少し違う周波数（バイノーラルビート）+ ピンクノイズ + ランダムな間隔のチャイム
  startBGM(){
    if(this.xs) return this.startBGMX();
    const c = this.ctx, gain = c.createGain();
    gain.gain.setValueAtTime(.0001, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(.025, c.currentTime + .5);
    gain.connect(c.destination);
    const nodes = [];
    [[this.base[0],-1],[this.base[1],1]].forEach(([f,pan])=>{   // バイノーラル：左右を分離
      const o = c.createOscillator(), p = c.createStereoPanner ? c.createStereoPanner() : null;
      o.frequency.value = f;
      if(p){ p.pan.value = pan; o.connect(p); p.connect(gain); } else o.connect(gain);
      o.start(); nodes.push(o);
    });
    const noise = this.pinkNoise(); noise.connect(gain); noise.start(); nodes.push(noise);
    const session = { gain, nodes, alive: true };
    this.bgm = session;
    const chime = ()=>{
      if(!session.alive) return;
      this.tone(this.scale[Math.floor(Math.random()*this.scale.length)], .02, 4);
      this.timer = setTimeout(chime, 2500 + Math.pow(Math.random(),2)*3000);
    };
