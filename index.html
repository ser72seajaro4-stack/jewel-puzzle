<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Jewels - 癒しの宝石パズル</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --gold-accent: #d4af37;
            --text-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #1a1c2e 0%, #080910 100%);
            color: var(--text-color);
            font-family: 'Cinzel', 'Helvetica Neue', serif, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 輝くパーティクル背景用キャンバス */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
            background: rgba(15, 17, 26, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.1);
            max-width: 90vw;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 0%, var(--gold-accent) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.95rem;
            color: #a0aec0;
            letter-spacing: 1px;
        }

        /* パズルボード */
        #board-container {
            position: relative;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #game-board {
            display: grid;
            gap: 12px;
            justify-content: center;
        }

        .cell {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .cell:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .cell.active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* 宝石の輝きと色彩 */
        .gem {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            transition: all 0.4s ease;
            position: relative;
            filter: drop-shadow(0 0 8px currentColor);
        }

        .gem::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 30%;
            height: 30%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* 宝石タイプ（カラーパレット） */
        .gem-1 { background: radial-gradient(circle at 35% 35%, #ff7675, #d63031); color: #ff7675; } /* ルビー */
        .gem-2 { background: radial-gradient(circle at 35% 35%, #74b9ff, #0984e3); color: #74b9ff; } /* サファイア */
        .gem-3 { background: radial-gradient(circle at 35% 35%, #55efc4, #00b894); color: #55efc4; } /* エメラルド */
        .gem-4 { background: radial-gradient(circle at 35% 35%, #ffeaa7, #fdcb6e); color: #ffeaa7; } /* トパーズ */
        .gem-5 { background: radial-gradient(circle at 35% 35%, #a29bfe, #6c5ce7); color: #a29bfe; } /* アメジスト */

        /* ボタンデザイン */
        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            background: transparent;
            border: 1px solid var(--gold-accent);
            color: var(--gold-accent);
            padding: 10px 24px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            background: var(--gold-accent);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* クリアモーダル */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        #modal h2 {
            font-size: 2.5rem;
            color: var(--gold-accent);
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 6px;
        }

        #modal p {
            color: #a0aec0;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <h1>LUMINA JEWELS</h1>
            <div class="status-bar">
                <span>STAGE <span id="stage-num">1</span> / 100</span>
                <span>MOVES: <span id="moves-num">0</span></span>
            </div>
        </header>

        <div id="board-container">
            <div id="game-board"></div>
        </div>

        <div class="controls">
            <button id="reset-btn">RESET</button>
        </div>
    </div>

    <div id="modal">
        <h2>HARMONY</h2>
        <p>静寂と輝きが満たされました</p>

        <button id="next-btn">NEXT STAGE</button>
    </div>

    <script>
        /* --------------------------------------------------
         * 1. 音響エンジン (Web Audio API - サラウンド和音&透明感のある音)
         * -------------------------------------------------- */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                // ソルフェジオ周波数やペンタトニックスケールに基づく癒しの音階（Hz）
                this.scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            // タップ音（クリスタル風の澄んだ高音）
            playGemSound(index) {
                this.init();
                const freq = this.scale[index % this.scale.length];
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                // アタックとディケイ（余韻を残して消える）
                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.2, this.ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 1.2);
            }

            // クリア音（優しく包み込むアルペジオ和音）
            playClearSound() {
                this.init();
                const chord = [0, 2, 4, 7, 9]; // メジャーセブンス系の透明感ある構成音
                chord.forEach((noteIndex, i) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(this.scale[noteIndex] * 0.5, this.ctx.currentTime);

                        gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.15, this.ctx.currentTime + 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.5);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start();
                        osc.stop(this.ctx.currentTime + 2.5);
                    }, i * 120);
                });
            }
        }

        /* --------------------------------------------------
         * 2. 背景パーティクル演出 (高級感あふれる光の塵)
         * -------------------------------------------------- */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.speedY = -(Math.random() * 0.3 + 0.1);
                this.fade = Math.random() * 0.005 + 0.002;
            }

            update() {
                this.y += this.speedY;
                this.alpha -= this.fade;

                if (this.alpha <= 0 || this.y < 0) {
                    this.reset();
                    this.y = canvas.height + 10;
                }
            }

            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* --------------------------------------------------
         * 3. パズルゲームコアロジック (100ステージ生成 & ライトアウト方式)
         * -------------------------------------------------- */
        const audio = new SoundEngine();
        let currentStage = 1;
        let moves = 0;
        let grid = [];
        let gridSize = 3;

        const boardEl = document.getElementById('game-board');
        const stageNumEl = document.getElementById('stage-num');
        const movesNumEl = document.getElementById('moves-num');
        const modalEl = document.getElementById('modal');

        // ステージ構造のアルゴリズム定義（1〜100に沿って徐々に高難易度化）
        function getStageConfig(stage) {
            // ステージ数に応じてグリッドサイズを徐々に拡張（3x3 -> 4x4 -> 5x5）
            let size = 3;
            if (stage > 20) size = 4;
            if (stage > 60) size = 5;

            // 色の種類（宝石のバリエーション）
            let colorCount = 2;
            if (stage > 10) colorCount = 3;
            if (stage > 40) colorCount = 4;
            if (stage > 75) colorCount = 5;

            // 初期シャッフル手数（難易度調整）
            let shuffleSteps = Math.min(stage + 2, 25);

            return { size, colorCount, shuffleSteps };
        }

        function initStage(stage) {
            currentStage = stage;
            moves = 0;
            stageNumEl.textContent = currentStage;
            movesNumEl.textContent = moves;

            const config = getStageConfig(stage);
            gridSize = config.size;

            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 60px)`;
            
            // 全体を目標状態（すべて状態0：同色の輝き）で初期化
            grid = Array(gridSize).fill(0).map(() => Array(gridSize).fill(0));

            // 解ける状態から逆算して配置（確実にクリア可能な盤面を自動生成）
            for (let i = 0; i < config.shuffleSteps; i++) {
                const rx = Math.floor(Math.random() * gridSize);
                const ry = Math.floor(Math.random() * gridSize);
                applyToggle(rx, ry, config.colorCount, false);
            }

            renderBoard();
        }

        function applyToggle(x, y, colorCount, animate = true) {
            const dirs = [[0,0], [0,1], [0,-1], [1,0], [-1,0]];
            dirs.forEach(([dx, dy]) => {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
                    grid[ny][nx] = (grid[ny][nx] + 1) % colorCount;
                }
            });
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            const config = getStageConfig(currentStage);

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    const val = grid[y][x];
                    if (val > 0) {
                        const gem = document.createElement('div');
                        gem.className = `gem gem-${val}`;
                        cell.appendChild(gem);
                    }

                    cell.addEventListener('click', () => handleCellClick(x, y));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(x, y) {
            const config = getStageConfig(currentStage);
            
            // 効果音再生
            audio.playGemSound(grid[y][x]);

            // 盤面更新
            applyToggle(x, y, config.colorCount);
            moves++;
            movesNumEl.textContent = moves;

            renderBoard();

            // クリア判定（すべてのマスが0＝調和された状態になったか）
            if (checkClear()) {
                setTimeout(() => {
                    audio.playClearSound();
                    modalEl.classList.add('show');
                }, 300);
            }
        }

        function checkClear() {
            return grid.every(row => row.every(val => val === 0));
        }

        // イベントリスナー
        document.getElementById('reset-btn').addEventListener('click', () => {
            initStage(currentStage);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            modalEl.classList.remove('show');
            if (currentStage < 100) {
                initStage(currentStage + 1);
            } else {
                alert('全100ステージクリアおめでとうございます！すべての調和が達成されました。');
                initStage(1);
            }
        });

        // ゲーム開始
        initStage(1);
    </script>
</body>
</html>
